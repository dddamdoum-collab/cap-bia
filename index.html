Q("F","Les deux principaux composants de l'air sec sont :",["l'azote et l'oxygène.","l'oxygène et le gaz carbonique.","l'azote et l'hélium.","l'oxygène et l'hydrogène."],0,"Pense aux deux gaz les plus abondants dans l'air que tu respires.","L'air sec est composé d'environ 78 % d'azote et 21 % d'oxygène. Les autres gaz (argon, gaz carbonique...) sont en proportions très faibles.","","BIA 2017 · 1.1 ✓");
Q("F","Dans l'atmosphère standard, la température et la pression de 0 à 11 km d'altitude évoluent de la manière suivante :",["la température diminue, la pression augmente.","la température diminue et la pression reste constante.","la température et la pression sont constantes.","la température et la pression diminuent."],3,"Observe ce qui se passe à mesure que l'on monte dans la troposphère.","Dans la troposphère, la température décroît d'environ 6,5 °C par 1000 m et la pression diminue avec l'altitude, car la masse d'air située au-dessus se réduit.","tempstd","BIA 2017 · 1.2 ✓");
Q("F","Dans l'atmosphère standard, la température au niveau de la mer est de :",["0°C.","10°C.","15°C.","20°C."],2,"C'est une valeur de référence de l'atmosphère type OACI.","L'atmosphère type OACI (ISA) fixe au niveau de la mer une température de 15 °C et une pression de 1013,25 hPa.","","BIA 2017 · 1.3 ✓");
Q("G","L'instrument utilisé pour mesurer la vitesse du vent en surface est :",["une girouette placée sur un pylône.","un anémomètre placé sur un pylône.","un ballon sonde.","un baromètre placé sur un pylône."],1,"Quel instrument mesure une vitesse, et non une direction ?","L'anémomètre mesure la vitesse du vent. La girouette indique sa direction et le baromètre mesure la pression.","instrvent","BIA 2017 · 1.4 ✓");
Q("F","Sur une carte de pression une ligne qui joint les points d'égale pression est nommée :",["une isotherme.","une isocline.","une isophyse.","une isobare."],3,"Le préfixe iso- signifie « égal » ; le suffixe renvoie à la pression.","Une isobare relie les points de même pression atmosphérique. Une isotherme relie les points de même température.","isobares","BIA 2017 · 1.5 ✓");
Q("F","« marais barométrique » désigne :",["une zone où la pression varie peu.","une zone ou un axe de basses pressions.","une zone ou un axe de hautes pressions.","une zone où le gradient de pression est très élevé."],0,"Dans un marais, rien ne bouge beaucoup.","Un marais barométrique est une région où les pressions sont voisines et varient très peu d'un point à l'autre : le gradient de pression est faible et le vent y est faible.","isobares","BIA 2017 · 1.6 ✓");
Q("G","Au niveau d'un front chaud :",["l'air chaud repousse l'air froid devant lui et passe au-dessus.","l'air froid repousse l'air chaud devant lui et passe au-dessus.","l'air froid repousse l'air chaud devant lui et passe au-dessous.","l'air chaud repousse l'air froid devant lui et passe au-dessous."],0,"L'air chaud est moins dense que l'air froid.","Dans un front chaud, l'air chaud avance et glisse en pente douce au-dessus de l'air froid, plus dense, qu'il repousse.","frontchaud","BIA 2017 · 1.8 ✓");
Q("G","Si un observateur se place face au vent dans l'hémisphère nord, la dépression et l'anticyclone se situent de la manière suivante :",["anticyclone sur sa droite, dépression sur sa gauche.","anticyclone devant lui, dépression derrière lui.","anticyclone sur sa gauche, dépression sur sa droite.","anticyclone derrière lui, dépression devant lui."],2,"Rappelle-toi la loi de Buys-Ballot : elle se formule dos au vent.","Dans l'hémisphère nord, dos au vent, la dépression est à gauche et l'anticyclone à droite. Face au vent, c'est l'inverse : anticyclone à gauche, dépression à droite.","buysballot","BIA 2017 · 1.9 ✓");
Q("H","Le phénomène rentrant le plus souvent en jeu dans la formation des nuages est :",["le refroidissement d'une masse d'air humide.","l'augmentation de la pression atmosphérique.","le réchauffement d'une masse d'air saturée.","l'assèchement d'une masse d'air humide."],0,"Pour condenser la vapeur d'eau, il faut atteindre la saturation.","Quand une masse d'air humide se refroidit (souvent en s'élevant), elle atteint la saturation et la vapeur d'eau se condense en gouttelettes : c'est un nuage.","condens","BIA 2017 · 1.10 ✓");
Q("H","Le préfixe des nuages dont la base est la plus élevée est :",["alto.","strato.","cirro.","cumulo."],2,"Les nuages de l'étage supérieur sont constitués de cristaux de glace.","Les nuages de l'étage supérieur (cirrus, cirrocumulus, cirrostratus) ont une base située au-dessus d'environ 6000 m : ils portent le préfixe cirro-.","nuages","BIA 2017 · 1.11 ✓");
Q("H","La grêle est un type de précipitation qui se forme dans :",["les stratus.","les nimbostratus.","les cumulonimbus.","les stratocumulus."],2,"Il faut de très forts courants verticaux pour faire grossir des grêlons.","La grêle se forme dans les cumulonimbus, où de puissants courants ascendants font monter et redescendre les gouttes qui gèlent et grossissent par couches successives.","cumulonimbus","BIA 2017 · 1.14 ✓");
Q("G","Les courants de vent puissants que l'on rencontre à très haute altitude sont nommés :",["jet-stream.","jet-lag.","tornade.","rafale."],0,"Ce terme anglais désigne un « courant-jet ».","Le jet-stream est un courant d'ouest très rapide, de l'ordre de 100 à 300 km/h ou plus, situé près de la tropopause.","","BIA 2017 · 1.15 ✓");
Q("G","La brise de pente (montante) se forme en région :",["côtière et de jour.","côtière et de nuit.","montagneuse et de nuit.","montagneuse et de jour."],3,"Ce sont les versants chauffés par le soleil qui réchauffent l'air à leur contact.","Le jour, le versant ensoleillé réchauffe l'air à son contact, qui devient plus léger et monte le long de la pente : c'est la brise de pente montante, propre aux régions montagneuses.","brisepente","BIA 2017 · 1.16 ✓");
Q("G","En plaine, dans les basses couches de l'atmosphère, les turbulences sont générées par :",["l'onde.","les trous d'air.","la convection.","le brouillard."],2,"Le sol chauffé par le soleil réchauffe l'air à son contact.","En plaine, la convection thermique crée des mouvements verticaux d'air qui provoquent des turbulences dans les basses couches. L'onde est liée au relief montagneux.","thermique","BIA 2017 · 1.18 ✓");
Q("H","Le principal danger induit par le brouillard sur le vol est :",["la formation de givrage possible en toutes saisons.","la turbulence associée.","la diminution de la visibilité.","le risque de foudroiement."],2,"Le brouillard est un nuage au contact du sol.","Le brouillard est constitué de fines gouttelettes en suspension qui réduisent fortement la visibilité horizontale, ce qui rend le vol à vue et l'atterrissage dangereux.","","BIA 2017 · 1.19 ✓");
Q("H","Parmi les éléments suivants, une conséquence possible du givrage est :",["gain d'altitude.","altération des profils aérodynamiques.","amélioration des performances de l'aéronef.","diminution de la traînée."],1,"La glace modifie la forme de l'aile et alourdit l'avion.","Le givre déforme les profils des ailes et de l'empennage : la portance diminue, la traînée et la masse augmentent et les performances de l'aéronef se dégradent.","givrage","BIA 2017 · 1.20 ✓");
Q("A","Sur le profil de l'aile, la vitesse de l'écoulement de l'air :",["est constante sur l'intrados et l'extrados.","diminue sur l'intrados et augmente sur l'extrados.","diminue sur l'extrados et augmente sur l'intrados.","diminue sur l'intrados et l'extrados."],1,"Pense à la dépression qui se crée sur la face supérieure de l'aile.","L'air accélère sur l'extrados (la pression y diminue) et ralentit sur l'intrados (la pression y augmente). Cette différence de pression engendre la portance.","vitesseprofil","BIA 2017 · 2.1 ✓");
Q("B","La force parallèle, de même sens que le vent relatif Vr est :",["la portance.","la traînée.","le poids.","la résultante aérodynamique."],1,"Cette force s'oppose à l'avancement de l'avion.","La traînée est la composante de la résultante aérodynamique parallèle au vent relatif et de même sens que lui ; la portance lui est perpendiculaire.","forces","BIA 2017 · 2.3 ✓");
Q("A","Si en vol la température extérieure augmente fortement, la portance :",["augmente fortement.","reste constante.","augmente faiblement.","diminue."],3,"Regarde ce qui arrive à la masse volumique de l'air quand il se réchauffe.","La portance est proportionnelle à la masse volumique de l'air. Quand la température augmente, l'air se dilate, sa masse volumique diminue et la portance diminue.","densite","BIA 2017 · 2.4 ✓");
Q("A","Les paramètres intervenant dans la formule de la portance sont :",["la vitesse et la surface alaire de l'aile.","la masse volumique et le poids de l'avion.","le coefficient de portance et le poids des ailes.","la vitesse et le coefficient de traînée."],0,"La formule fait intervenir Rz = ½ · ρ · S · V² · Cz.","La portance dépend de la masse volumique de l'air, de la surface de l'aile, du carré de la vitesse et du coefficient de portance Cz. Le poids de l'avion n'y intervient pas.","","BIA 2017 · 2.5 ✓");
Q("A","L'angle de calage d'une aile est compris entre :",["la corde de profil de l'aile et l'axe longitudinal de l'avion.","la corde de profil de l'aile et le vent relatif.","le plan de l'aile et l'horizontale.","le bord d'attaque et la perpendiculaire de l'axe avion."],0,"Cet angle est fixé à la construction, il ne dépend pas du vol.","L'angle de calage est l'angle fixe entre la corde de profil de l'aile et l'axe longitudinal du fuselage. L'angle entre la corde et le vent relatif est l'incidence.","calage","BIA 2017 · 2.8 ✓");
Q("B","L'angle de pente est :",["l'angle entre l'horizontale et l'axe longitudinal de l'avion.","l'angle entre la corde de profil de l'aile et le vent relatif.","l'angle affiché sur l'horizon artificiel du pilote","l'angle entre l'horizontale et la trajectoire réelle de l'avion."],3,"Il décrit la trajectoire, pas l'orientation du fuselage.","La pente est l'angle entre l'horizontale et la trajectoire de l'avion. L'angle entre l'horizontale et l'axe longitudinal est l'assiette, et celui entre la corde et le vent relatif est l'incidence.","assietteincidencepente","BIA 2017 · 2.9 ✓");
Q("A","L'air autour du profil de l'aile est :",["en dépression sur l'extrados et en surpression sur l'intrados.","en surpression sur l'extrados et en dépression sur l'intrados.","en dépression sur l'extrados et l'intrados.","en surpression sur l'extrados et l'intrados."],0,"La portance est dirigée vers le haut.","En vol normal, la pression est plus faible sur l'extrados (dépression) et plus forte sur l'intrados (surpression). Cette différence est à l'origine de la portance.","pression","BIA 2017 · 2.10 ✓");
Q("B","Lorsqu'un aéronef est en vol horizontal stabilisé :",["la portance équilibre la traction et le poids équilibre la traînée.","la portance équilibre le poids et la traînée équilibre la traction.","la portance équilibre la traînée et le poids équilibre la traction.","toutes les forces sont différentes."],1,"Les forces verticales s'équilibrent entre elles, de même que les forces horizontales.","En palier stabilisé, la portance compense le poids (forces verticales) et la traction compense la traînée (forces horizontales).","forces4","BIA 2017 · 2.11 ✓");
Q("C","Ce qui assure la plus grande stabilité d'un aéronef est :",["le dièdre et la flèche positifs.","le dièdre négatif et la flèche nulle.","le dièdre et la flèche négatifs.","le dièdre positif et la flèche nulle."],0,"Ces deux dispositions de l'aile contribuent à la stabilité en roulis.","Le dièdre positif et la flèche positive stabilisent l'avion en roulis : après une inclinaison, ils créent un couple qui ramène les ailes à l'horizontale.","diedrefleche","BIA 2017 · 2.12 ✓");
Q("B","Pour passer en régime de montée stabilisée, le pilote doit :",["réduire la puissance moteur.","tirer sur le manche et conserver la même puissance moteur.","tirer sur le manche et augmenter la puissance moteur.","pousser sur le manche et réduire la puissance moteur."],2,"Monter demande de gagner de l'énergie.","Pour monter à vitesse stabilisée, le pilote cabre en tirant sur le manche et augmente la puissance, car une partie de la traction compense la composante du poids le long de la trajectoire.","montee","BIA 2017 · 2.13 ✓");
Q("B","En vol, si le pilote tire fortement sur le manche, le facteur de charge :",["augmente.","diminue.","reste constant.","devient nul."],0,"Pense à ce que tu ressens dans le siège lors d'une ressource.","Tirer fortement sur le manche augmente l'incidence et la portance : le facteur de charge (rapport portance sur poids) augmente.","facteurcharge","BIA 2017 · 2.14 ✓");
Q("B","Un planeur de finesse 50 vole en ligne droite à 2000m d'altitude dans un air stable. La distance maximale qu'il peut parcourir sans ascendance est de :",["10 km.","25 km.","40 km.","100 km."],3,"La finesse est le rapport entre la distance parcourue et la hauteur perdue.","Avec une finesse de 50, le planeur parcourt 50 m par mètre perdu. Distance maximale = 50 × 2000 m = 100 000 m, soit 100 km.","finesse","BIA 2017 · 2.16 ✓");
Q("D","Lorsque la somme des forces qui s'appliquent à un ballon libre est nulle :",["le ballon est en situation d'équilibre.","le ballon est en montée.","le ballon est en descente.","le ballon se dégonfle."],0,"Que dit le principe d'inertie quand les forces se compensent ?","Si la poussée d'Archimède compense exactement le poids, la résultante est nulle et le ballon est en équilibre : il ne monte ni ne descend.","archi","BIA 2017 · 2.17 ✓");
Q("D","En cas d'élévation de température extérieure, la force ascensionnelle d'un aérostat :",["n'évolue pas.","augmente.","diminue.","dépend exclusivement du vent."],2,"La poussée d'Archimède dépend de la masse volumique de l'air extérieur.","Quand l'air extérieur se réchauffe, sa masse volumique diminue. La poussée d'Archimède diminue donc et la force ascensionnelle de l'aérostat diminue.","","BIA 2017 · 2.18 ✓");
Q("E","En orbite circulaire à 36000 km, la durée d'une révolution (tour complet) d'un satellite est de :",["90 mn.","120 mn.","12 heures.","24 heures."],3,"Cette altitude est celle de l'orbite géostationnaire.","À environ 36 000 km d'altitude, la période est de 24 h : le satellite tourne à la même vitesse angulaire que la Terre et reste au-dessus d'un même point de l'équateur (orbite géostationnaire).","orbites","BIA 2017 · 2.19 ✓");
Q("E","Le poids d'un satellite tournant autour d'un astre est :",["compensé par sa force de portance.","compensé par sa force centrifuge.","compensé uniquement par ses moteurs fusées.","nul car il est en apesanteur."],1,"Sur une orbite circulaire, la gravité est équilibrée par un effet lié à la rotation.","Sur son orbite, l'attraction gravitationnelle (poids) est équilibrée par la force centrifuge liée à sa vitesse orbitale. Il n'y a ni portance ni besoin de moteur.","equilibreorbite","BIA 2017 · 2.20 ✓");
Q("J","On appelle emplanture de l'aile :",["la partie située à la jonction aile-fuselage.","le dessous de l'aile.","la partie la plus fine d'une aile.","la partie extrême de l'aile aussi appelée « saumon »."],0,"C'est l'endroit où l'aile « prend racine ».","L'emplanture est la partie de l'aile fixée au fuselage. L'extrémité opposée est le saumon.","aileparties","BIA 2017 · 3.4 ✓");
Q("J","Au sol, le carburant contenu dans une aile, entraîne sur les longerons :",["un effort de cisaillement.","un effort de flexion.","un effort de torsion.","n'a pas d'influence sur la structure de l'aile."],1,"Au sol, le poids du carburant et de l'aile n'est pas compensé par la portance.","Au sol, le poids du carburant et de l'aile tire les extrémités vers le bas : les longerons travaillent en flexion.","flexionaile","BIA 2017 · 3.5 ✓");
Q("A","Parmi les dispositifs suivants, lequel n'est pas un dispositif hypersustentateur :",["les volets à fente.","les becs de bord d'attaque.","les aérofreins.","les volets Fowler."],2,"Un hypersustentateur augmente la portance à basse vitesse.","Les volets et les becs augmentent la portance à faible vitesse. Les aérofreins, au contraire, augmentent la traînée et diminuent la portance.","aerofreins","BIA 2017 · 3.7 ✓");
Q("A","Un avion a les caractéristiques suivantes : envergure 10 mètres, épaisseur relative de l'aile 0,20 mètres, profondeur moyenne de l'aile 1 mètre. Sachant que cette aile est rectangulaire, son allongement est de :",["10.","50.","60.","100."],0,"L'épaisseur est une donnée inutile pour ce calcul.","L'allongement est le rapport de l'envergure à la profondeur moyenne (corde) : 10 m / 1 m = 10.","allongementdef","BIA 2017 · 3.8 ✓");
Q("C","Un déplacement du manche vers la droite :",["abaisse simultanément les ailerons.","lève l`aileron droit et baisse l`aileron gauche.","relève simultanément les ailerons.","baisse l`aileron droit et lève l`aileron gauche."],1,"Pour pencher à droite, l'aile droite doit perdre de la portance.","Manche à droite : l'aileron droit se lève (moins de portance à droite) et l'aileron gauche s'abaisse (plus de portance à gauche), ce qui fait rouler l'avion vers la droite.","ailerons","BIA 2017 · 3.9 ✓");
Q("J","Sur une hélice à pas variable, le « plein petit pas » est utilisé pour le :",["vol en croisière.","vol à haute altitude.","vol à grande vitesse.","décollage."],3,"À basse vitesse, l'hélice doit « mordre » l'air avec un faible angle de calage.","Le petit pas, avec un angle de calage faible, permet au moteur de tourner à plein régime et d'obtenir une traction maximale à basse vitesse : il est utilisé au décollage.","petitgrandpas","BIA 2017 · 3.10 ✓");
Q("J","La plupart des moteurs d`avions légers est équipée d`un système de double allumage qui a pour principal avantage :",["de réguler la consommation électrique.","de réduire la consommation de carburant.","d`améliorer la combustion et d`augmenter la sécurité en vol.","de diminuer l`usure des bougies."],2,"Deux circuits d'allumage indépendants apportent à la fois une redondance et un avantage de combustion.","Le double allumage (deux magnétos, deux bougies par cylindre) améliore la combustion et assure la sécurité : le moteur continue de fonctionner si l'un des circuits tombe en panne.","","BIA 2017 · 3.12 ✓");
Q("K","L`horizon artificiel fournit des indications sur :",["les variations d`altitude.","la symétrie du vol.","la visibilité horizontale.","l'assiette de l`avion et son inclinaison."],3,"Il matérialise la position de l'avion par rapport à l'horizon.","L'horizon artificiel indique l'assiette (attitude en tangage) et l'inclinaison (roulis) de l'avion par rapport à l'horizon.","horizonartificiel","BIA 2017 · 3.14 ✓");
Q("L","Une des caractéristiques d'un autogire est :",["son rotor est constamment entraîné par le moteur.","son rotor est entraîné par le vent relatif.","son rotor est utilisé pour la propulsion.","son rotor est doté d'un pas collectif."],1,"Dans un autogire, l'hélice propulsive est distincte du rotor.","Le rotor d'un autogire tourne en autorotation, entraîné par le vent relatif. La traction est fournie par une hélice distincte.","autogire","BIA 2017 · 3.15 ✓");
Q("K","L'instrument qui exploite les variations de volume d'une capsule soumise à une variation de pression est :",["l'altimètre.","la centrale inertielle.","l'horizon artificiel.","l'indicateur de cap."],0,"Il mesure une pression pour en déduire une grandeur de position verticale.","L'altimètre contient une capsule anéroïde qui se déforme avec la pression statique. Cette déformation est traduite en altitude.","altimetrecapsule","BIA 2017 · 3.16 ✓");
Q("K","Pour afficher une vitesse, l'anémomètre mesure uniquement :",["la pression statique.","la pression totale.","la pression statique et la pression totale.","la pression totale et la pression dynamique."],2,"Il est relié à deux prises de pression différentes.","L'anémomètre est branché sur la prise de pression totale (tube de Pitot) et sur la prise de pression statique. La différence entre les deux, la pression dynamique, permet d'afficher la vitesse.","pitot","BIA 2017 · 3.17 ✓");
Q("K","Sur un indicateur de vitesse VNE représente :",["la vitesse conseillée en utilisation normale.","la vitesse en vol croisière.","la vitesse de décrochage.","la vitesse à ne jamais dépasser."],3,"Elle est repérée par un trait radial rouge sur l'anémomètre.","La VNE (Velocity Never Exceed) est la vitesse à ne jamais dépasser, marquée par un trait rouge sur l'anémomètre.","anemo","BIA 2017 · 3.18 ✓");
Q("J","L'intérêt de l'utilisation des matériaux composites en construction aéronautique est :",["meilleure conductibilité électrique.","meilleure recyclabilité.","allègement de la structure.","coût de la matière première."],2,"Pour une résistance donnée, ces matériaux sont plus légers que les métaux.","Les matériaux composites (fibres de carbone, de verre...) offrent une grande résistance pour une faible masse, ce qui allège la structure.","","BIA 2017 · 3.19 ✓");
Q("E","Les lanceurs spatiaux utilisent principalement des propulseurs fonctionnant :",["au kérosène.","à l'oxygène et l'hydrogène.","au méthane.","au gasoil."],1,"Ce couple de propergols cryogéniques donne une très grande vitesse d'éjection.","Les lanceurs utilisent principalement des propergols cryogéniques (hydrogène liquide et oxygène liquide), très performants, éventuellement complétés par des propulseurs à poudre.","","BIA 2017 · 3.20 ✓");
Q("N","La hauteur minimale de survol d'un rassemblement de plus de 100 000 personnes est :",["150 m.","1500 m.","2000 m.","3000 m."],1,"Plus le rassemblement est important, plus la hauteur minimale est élevée.","La réglementation française impose une hauteur minimale de 1500 m pour le survol d'un rassemblement de plus de 100 000 personnes par un aéronef motopropulsé.","","BIA 2017 · 4.1 ✓");
Q("N","Le vol VFR est :",["un vol effectué dans des conditions de vol à vue.","un vol effectué dans des conditions de vol aux instruments.","un vol de type commercial.","un vol limité au tour de piste."],0,"VFR signifie Visual Flight Rules.","VFR (Visual Flight Rules) désigne les règles de vol à vue : le pilote se repère et évite les obstacles à vue, à condition que les conditions météorologiques le permettent.","","BIA 2017 · 4.2 ✓");
Q("M","Sur une carte au 1/500 000éme, une distance mesurée de 10 cm correspond à une distance de :",["5 km.","15 km.","50 km.","150 km."],2,"Multiplie la distance mesurée par le dénominateur de l'échelle, puis convertis.","À l'échelle 1/500 000, 1 cm représente 500 000 cm = 5 km. Donc 10 cm représentent 50 km.","echelle","BIA 2017 · 4.3 ✓");
Q("M","La masse approximative d'un litre d'essence est de l'ordre de :",["550 g.","750 g.","1050 g.","1250 g."],1,"L'essence est moins dense que l'eau.","L'essence aviation (AVGAS 100LL) a une masse volumique d'environ 0,72 kg/L, soit de l'ordre de 750 g par litre. Elle flotte sur l'eau.","","BIA 2017 · 4.4 ✓");
Q("M","Une piste dont l'orientation magnétique est de 113 sera numérotée :",["11.","12.","29.","110."],0,"Le numéro de piste est l'orientation magnétique arrondie à la dizaine, divisée par 10.","Le numéro de piste correspond à l'orientation magnétique arrondie à la dizaine la plus proche, divisée par 10 : 113° devient 110°, soit la piste 11.","numeropiste","BIA 2017 · 4.5 ✓");
Q("I","Un METAR est :",["un avis qui mentionne la modification d'une installation.","un message d'alerte et de danger.","un service d'assistance et de secours.","un message météorologique régulier."],3,"Il s'agit d'un bulletin d'observation météo codé.","Le METAR est un message d'observation météorologique d'aérodrome, émis à intervalles réguliers (généralement toutes les 30 minutes ou toutes les heures).","","BIA 2017 · 4.6 ✓");
Q("N","La règle d'évitement d'un aéronef qui dépasse un autre aéronef est :",["évitement par la gauche.","évitement par la droite.","évitement par le haut.","évitement par le bas."],1,"En règle générale, les aéronefs s'écartent vers la droite.","Un aéronef qui en dépasse un autre doit l'éviter par la droite, comme pour la plupart des règles de croisement.","priorites","BIA 2017 · 4.7 ✓");
Q("N","Sur une fréquence radio un aéronef immatriculé F-GTAX s'identifie :",["Fox-Trot-Golf-Tango-Alpha-X-Ray.","Fox-Golf-Tango-Alpha-Xilo.","French-Golf-Tango-Alpha-X-Ray.","Fox-Trot-Golf-Tango-Alpha-Xilo."],0,"Chaque lettre est épelée avec l'alphabet radiotéléphonique international.","Avec l'alphabet OACI, F se dit Fox-Trot, G Golf, T Tango, A Alpha et X X-Ray.","alphabet","BIA 2017 · 4.9 ✓");
Q("N","Sur une carte, une zone identifiée par la lettre « P » correspond à :",["une zone interdite provisoirement.","une zone à la pénétration restreinte sous certaines conditions.","une zone à la pénétration interdite.","une zone dangereuse."],2,"P vient de l'anglais « Prohibited ».","Sur les cartes aéronautiques, P désigne une zone interdite (Prohibited), R une zone réglementée (Restricted) et D une zone dangereuse (Danger).","","BIA 2017 · 4.10 ✓");
Q("N","Un aérodrome ouvert à la CAP :",["n'est ouvert qu'aux appareils d'Etat.","est ouvert à la circulation aérienne publique.","est interdit aux ULM.","nécessite un certificat d'aptitude à se poser."],1,"CAP signifie « circulation aérienne publique ».","Un aérodrome ouvert à la circulation aérienne publique (CAP) est accessible à tout aéronef qui répond aux conditions d'utilisation de la plateforme.","","BIA 2017 · 4.11 ✓");
Q("N","Une CTR est :",["un espace aérien militaire de haute altitude.","une zone interdite jusqu'au sol.","une zone d'expérimentation provisoire.","un espace aérien contrôlé aux abords d'un aérodrome."],3,"CTR signifie Control Zone.","Une CTR (zone de contrôle) est un espace aérien contrôlé qui s'étend du sol jusqu'à une limite supérieure donnée, aux abords d'un ou plusieurs aérodromes.","espaces","BIA 2017 · 4.12 ✓");
Q("N","Un paramoteur est :",["un aéronef classé dans la règlementation vol libre.","un aéronef classé dans la règlementation du parachutisme.","un aéronef classé dans la réglementation ULM.","un aéronef classé dans la règlementation des drones."],2,"Il est motorisé et léger.","Le paramoteur (parapente équipé d'un moteur porté par le pilote) est classé en France dans la catégorie des ULM, classe 1.","","BIA 2017 · 4.13 ✓");
Q("N","Sur un aérodrome non contrôlé, l'éventuelle fréquence sur laquelle les pilotes peuvent échanger de l'information est nommée :",["fréquence d'auto-information.","fréquence d'alerte.","fréquence de courtoisie.","fréquence de détresse."],0,"Sans contrôleur, les pilotes s'informent eux-mêmes.","Sur un aérodrome sans organisme de contrôle, les pilotes peuvent échanger leurs positions et leurs intentions sur une fréquence d'auto-information (A/A).","","BIA 2017 · 4.14 ✓");
Q("R","En France les fédérations aéronautiques et sportives sont regroupées dans un organisme dont le sigle est :",["GIFAS.","FNAM.","DGAC.","CNFAS."],3,"Le sigle désigne un comité national.","Le CNFAS (Comité national des fédérations aéronautiques et sportives) regroupe les fédérations aéronautiques et sportives françaises.","","BIA 2017 · 4.15 ✓");
Q("R","La fédération française qui prend en charge l'aéromodélisme est :",["la FFA.","la FFAM.","la FFVL.","la FNAM."],1,"Le sigle contient le « M » de modélisme.","La FFAM (Fédération française d'aéromodélisme) regroupe les pratiquants de l'aéromodélisme.","","BIA 2017 · 4.16 ✓");
Q("O","Dans un planeur, le parachute est :",["obligatoire pour tous les occupants.","obligatoire uniquement pour le pilote.","n'est pas obligatoire.","obligatoire uniquement en compétition."],0,"Il est recommandé, mais la réglementation ne l'impose pas en vol normal.","Le parachute est conseillé en planeur mais il n'est pas obligatoire en vol normal ; il l'est pour certaines activités comme la voltige.","","BIA 2017 · 4.17 ✓");
Q("O","Le taux d'alcoolémie maximum autorisé pour piloter doit être inférieur ou égal à :",["0,2 gramme par litre de sang.","0,3 gramme par litre de sang.","0,4 gramme par litre de sang.","0,5 gramme par litre de sang."],0,"Cette limite est identique à celle de la conduite automobile pour un pilote non professionnel.","Pour un pilote non professionnel, le taux maximal d'alcool autorisé est de 0,5 g/l de sang.","","BIA 2017 · 4.18 ✓");
Q("O","En phase d'atterrissage, une remise des gaz doit être considérée :",["comme une manœuvre à éviter dans l'aviation commerciale.","comme une manœuvre spécifique au vol en instruction.","comme une saine décision en cas de mauvaise approche.","comme une erreur de pilotage."],2,"En cas d'approche non stabilisée, la sécurité prime.","La remise des gaz est une manœuvre normale de sécurité : en cas d'approche mal stabilisée ou de piste non dégagée, le pilote doit la décider sans hésiter.","","BIA 2017 · 4.19 ✓");
Q("O","La plupart des accidents ont lieu :",["en vol de croisière en raison d'un arrêt moteur.","en vol par collision.","au-dessus des zones maritimes.","au décollage et à l'atterrissage."],3,"Ce sont les phases où l'avion est près du sol et où la charge de travail est forte.","La majorité des accidents surviennent lors des phases proches du sol, au décollage et à l'atterrissage, où les marges de sécurité sont les plus faibles.","","BIA 2017 · 4.20 ✓");
Q("P","En 1752 Benjamin Franklin démontre l'origine électrique de la foudre à l'aide d'un engin en vol dans un ciel d'orage. Il s'agit :",["d'une fusée pyrotechnique.","d'un cerf volant.","d'un ballon à gaz.","d'un ballon à air chaud."],1,"L'engin est retenu au sol par un fil, et les ballons n'existent pas encore.","En 1752, les ballons n'avaient pas encore été inventés (1783). Franklin utilisa un cerf-volant retenu par un fil pour montrer que la foudre est un phénomène électrique.","","BIA 2017 · 5.1 ✓");
Q("P","En 1858, Felix Tournachon dit \"Nadar\", fut le premier à réussir depuis la nacelle d'un ballon à gaz :",["un relevé de pression atmosphérique en haute altitude.","une mesure précise de vitesse d'ascension.","une photographie aérienne de Paris.","la mesure de la déclinaison du champ magnétique terrestre."],2,"Nadar était photographe.","Nadar, photographe, réalisa en 1858 la première photographie aérienne depuis un ballon captif au-dessus de Paris (Petit-Clamart).","","BIA 2017 · 5.2 ✓");
Q("P","En 1797, un aérostier effectue depuis la nacelle d'une montgolfière le premier saut en parachute de l'Histoire. Cet aéronaute s'appelle :",["le marquis d'Arlandes.","Jacques Charles.","André-Jacques Garnerin.","Pilatre de Roziers."],2,"Il est aussi l'inventeur du parachute sans armature.","André-Jacques Garnerin réalisa en 1797 le premier saut en parachute depuis un ballon, au-dessus du parc Monceau à Paris.","","BIA 2017 · 5.3 ✓");
Q("P","En 1871, Paris est assiégé par les prussiens. Toutefois, Léon Gambetta ministre du gouvernement provisoire parvient à s'évader grâce à :",["un dirigeable.","un avion.","un parachute ascensionnel.","un ballon à gaz."],3,"Pendant le siège de Paris, les ballons servaient de moyen de communication.","Pendant le siège de Paris en 1870-1871, Gambetta quitta la ville en ballon à gaz (« l'Armand-Barbès »), comme de nombreux messages et passagers.","","BIA 2017 · 5.4 ✓");
Q("P","Le premier dirigeable qui, partant de Saint-Cloud, parvint à contourner la Tour Eiffel en 1901 était piloté par :",["Clément Ader.","Gaston Tissandier.","Alberto Santos Dumont.","Otto Lilenthal."],2,"Ce pionnier brésilien gagna le prix Deutsch de la Meurthe.","Le 19 octobre 1901, Alberto Santos-Dumont, à bord de son dirigeable n° 6, contourna la tour Eiffel au départ de Saint-Cloud et remporta le prix Deutsch de la Meurthe.","","BIA 2017 · 5.5 ✓");
Q("P","Louis Blériot accomplit le premier la traversée en avion de :",["la Manche en 1909.","la Manche en 1927.","l'Atlantique en 1909.","l'Atlantique en 1927."],0,"Le 25 juillet, il décolla des environs de Calais pour rejoindre Douvres.","Le 25 juillet 1909, Louis Blériot réussit la première traversée de la Manche en avion, sur son Blériot XI, en environ 37 minutes.","frise1","BIA 2017 · 5.6 ✓");
Q("P","Les premières compétitions aériennes avant la première guerre mondiale ont été soutenues par de grands donateurs comme :",["Michelin.","Dassault.","Chanel.","Lacoste."],0,"Cette entreprise est liée aux pneumatiques.","Avant 1914, l'industriel Michelin finança des prix et des coupes d'aviation pour encourager le développement de l'aéronautique.","","BIA 2017 · 5.7 ✓");
Q("P","Durant la première guerre mondiale, des ballons captifs furent utilisés pour observer les armées adverses. On les appelait familièrement :",["flûtes.","cigares.","saucisses.","hannetons."],2,"Leur forme allongée leur a valu un surnom culinaire.","Les ballons d'observation captifs allongés utilisés pendant la Première Guerre mondiale étaient surnommés « saucisses ».","","BIA 2017 · 5.8 ✓");
Q("P","En 1916, Marcel Dassault (qui s'appelait Marcel Bloch à l'époque) a conçu :",["un train d'atterrissage.","un profil d'aile.","une hélice.","un pilote automatique."],2,"Il l'a conçu avec Henry Potez pour équiper les avions de combat.","En 1916, Marcel Bloch et Henry Potez conçurent l'hélice « Éclair », utilisée sur de nombreux avions de la Première Guerre mondiale.","","BIA 2017 · 5.9 ✓");
Q("P","En 1921, Adrienne Bolland fut la première aviatrice à traverser :",["la Cordillère des Andes.","les Alpes.","la Méditerranée entre le continent et la Corse.","le continent antarctique."],0,"Elle partit de Mendoza, en Argentine.","En 1921, Adrienne Bolland franchit la cordillère des Andes à bord d'un Caudron G.3, entre l'Argentine et le Chili.","cartetraversees","BIA 2017 · 5.10 ✓");
Q("P","En 1930, un pilote de l'Aéropostale s'écrase dans les Andes. Après 5 jours et 4 nuits, il finit par retrouver la civilisation. À un ami il confie : \"Ce que j'ai fait, je te le jure, aucune bête ne l'aurait fait !\". Il s'appelait :",["Jean Mermoz.","Pierre-Georges Latécoère.","Antoine de Saint-Exupery.","Pierre Guillaumet."],3,"Il fut le pilote qui marcha dans la neige pendant plusieurs jours.","En juin 1930, Henri Guillaumet s'écrasa dans les Andes et marcha cinq jours avant d'être secouru ; la phrase est citée par Saint-Exupéry dans « Terre des hommes ».","","BIA 2017 · 5.11 ✓");
Q("P","Dans les années 1930, les allemands deviennent les leaders mondiaux dans la construction des planeurs. Ce succès est dû en grande partie :",["à une absence totale d'approvisionnement en carburant.","à leur industrie du balsa.","à l'interdiction qui leur est imposée de constituer une aviation militaire motorisée après la guerre 14-18.","aux polymères qu'ils utilisent pour obtenir des surfaces de voilures très lisses."],2,"Le traité de Versailles est à l'origine de cette orientation.","Le traité de Versailles interdit à l'Allemagne une aviation militaire motorisée ; elle développa donc le vol à voile, ce qui lui donna une avance dans la construction des planeurs.","","BIA 2017 · 5.12 ✓");
Q("P","En 1936, disparaît Jean-Mermoz à bord de son Latecoere 300 lors d'une traversée de l'Atlantique Dakar-Natal en équipage. L'avion s'appelait :",["l'Oiseau blanc.","le Spirit of Saint Louis.","la Croix du sud.","l'Eole."],2,"Le nom de l'avion évoque une constellation de l'hémisphère sud.","Le Latécoère 300 de Mermoz s'appelait « Croix-du-Sud ». Il disparut dans l'Atlantique sud le 7 décembre 1936.","","BIA 2017 · 5.13 ✓");
Q("P","Maryse Bastié fut la première aviatrice à traverser l'Atlantique sud de Dakar à Natal en :",["1925.","1936.","1945.","1950."],1,"Cet exploit date de la même année que la disparition de Mermoz.","Maryse Bastié réalisa en 1936 la première traversée de l'Atlantique sud en solitaire pour une femme, de Dakar à Natal.","cartetraversees","BIA 2017 · 5.14 ✓");
Q("P","En 1944, la Luftwaffe met en service un avion construit par Messerschmitt dont la particularité est d'être :",["entièrement en matériaux de synthèse.","à voilure variable.","à voilure tournante.","à réaction."],3,"Il s'agit du Me 262.","Le Messerschmitt Me 262, mis en service en 1944, fut le premier avion de chasse à réaction opérationnel.","","BIA 2017 · 5.15 ✓");
Q("Q","Au lendemain de la Seconde Guerre mondiale, les américains recrutent l'un des meilleurs spécialistes allemands en techniques aérospatiales. Il s'agit de :",["Junkers.","Messerchmitt.","Stuka.","Von Braun."],3,"Il est le père des V2 puis de la fusée Saturn V.","Wernher von Braun, concepteur des V2, fut recruté par les États-Unis après la guerre et dirigea ensuite le développement de la fusée Saturn V.","","BIA 2017 · 5.16 ✓");
Q("Q","L'équipage de la mission spatiale Apollo 13 menée en 1970 par les Etats Unis pour explorer la lune a été :",["victime d'une grave avarie le mettant en péril.","le premier à s'être posé sur la lune.","le dernier à s'être posé sur la lune.","victime d'un accident au sol."],0,"« Houston, nous avons un problème. »","En avril 1970, une explosion d'un réservoir d'oxygène dans le module de service d'Apollo 13 obligea l'équipage à renoncer à alunir et à revenir sur Terre en situation critique.","","BIA 2017 · 5.17 ✓");
Q("R","Le développement d'Airbus s'est bâti sur une coopération franco-allemande à partir du :",["milieu des années 70.","milieu des années 80.","début des années 90.","début des années 2000."],0,"Le programme A300 a démarré à la fin des années 60.","Le consortium Airbus est né en 1970 d'une coopération franco-allemande (rejointe ensuite par d'autres pays), dont l'A300 est entré en service au milieu des années 70.","","BIA 2017 · 5.18 ✓");
Q("Q","L'objectif de la sonde Rosetta, lancée en 2004 et parvenue à destination 10 ans plus tard, était :",["d'observer les éruptions solaires.","de poser un atterrisseur sur une comète pour analyser sa composition.","de vérifier les conditions d'un voyage vers Mars.","de transporter des témoignages pour d'éventuelles civilisations extra-terrestres."],1,"Il s'agit de la comète Tchourioumov-Guérassimenko et de l'atterrisseur Philae.","La sonde européenne Rosetta (ESA), lancée en 2004, a atteint la comète 67P/Tchourioumov-Guérassimenko en 2014 et a déposé l'atterrisseur Philae pour étudier sa composition.","","BIA 2017 · 5.19 ✓");
Q("R","En 2009, Airbus inaugure le premier vol commercial du plus grand avion civil au monde. Cet avion s'appelle :",["A400M.","A380.","Triple 7.","BELUGA."],1,"C'est un avion à double pont.","L'Airbus A380, avion de ligne à deux ponts, est le plus grand avion civil de transport de passagers.","","BIA 2017 · 5.20 ✓");
Q("S","En anglais, la gouverne de profondeur est appelée :",["flaps.","wing.","elevator.","rudder."],2,"Elle commande le mouvement de tangage.","La gouverne de profondeur se dit « elevator ». Les « flaps » sont les volets, « wing » l'aile et « rudder » la gouverne de direction.","","BIA 2017 · Anglais 1 ✓");
Q("S","En décrivant un aéronef, l'expression \" tailwheel airplane \" est employée pour signifier qu'il s'agit d'un avion :",["à train rentrant.","avec moteur de queue.","à train classique.","tricycle."],2,"« Tailwheel » signifie littéralement « roue de queue ».","Un « tailwheel airplane » est un avion à train classique, avec une roue de queue plutôt qu'une roue avant.","","BIA 2017 · Anglais 2 ✓");

Q("S","When I pull the stick of an airplane backwards :",["the left aileron moves up.","the left flap moves down.","the flaps and airbrakes move down.","the elevator moves up."],3,"Tirer sur le manche fait cabrer l'avion.","En tirant le manche, la gouverne de profondeur (elevator) se lève et l'avion se cabre.","","BIA 2017 · Anglais 4 ✓");
Q("S","À la radio l'indication « number one, clear to land, runway one one » émise par le contrôleur signifie :",["numéro 1 autorisé à l'atterrissage sur la piste 11.","autorisé à l'atterrissage piste 1 ou 11.","autorisé à l'atterrissage piste 11, vous dégagerez par la sortie n°1.","autorisé au décollage piste 1 ou piste 11."],0,"« Number one » indique l'ordre dans la séquence d'atterrissage.","« Number one » signifie premier dans la séquence, « clear to land » autorisé à atterrir et « runway one one » piste 11.","","BIA 2017 · Anglais 5 ✓");

Q("S","On an airplane, the movement of the nose up or down is :",["rolling.","pitching.","banking.","yawing."],1,"Ce mouvement a lieu autour de l'axe transversal.","Le mouvement du nez vers le haut ou vers le bas est le tangage, « pitching » en anglais. Le roulis est « rolling » et le lacet « yawing ».","","BIA 2017 · Anglais 8 ✓");

Q("S","An auxiliary power unit is :",["a turbine engine that provides mechanical power for the accessory drive gear box.","a ram air turbine that delivers mechanical power for accessories gearbox.","an electric battery used in case of emergency.","a ram air turbine used in case of emergency."],0,"Un APU est un petit moteur, pas une éolienne de secours ni une batterie.","Un groupe auxiliaire de puissance (APU) est un petit turbomoteur qui fournit de la puissance aux équipements de l'avion, notamment au sol. L'éolienne de secours est la RAT, un équipement distinct.","","BIA 2017 · Anglais 10 ✓");

Q("S","« trailing edge » signifie :",["Bord d'attaque.","Bord de fuite.","Dérive.","Lisse."],1,"« Trailing » désigne ce qui traîne derrière.","Le « trailing edge » est le bord de fuite de l'aile, sa partie arrière.","","BIA 2017 · Anglais 13 ✓");

Q("S","Les « strobe lights » sont :",["les feux de brouillard.","les feux d'atterrissage.","les feux de navigation.","les feux à éclat."],3,"Ces feux émettent de brefs flashs blancs.","Les « strobe lights » sont des feux à éclats très brefs et puissants, qui rendent l'aéronef plus visible.","","BIA 2017 · Anglais 17 ✓");
Q("S","La « True Air Speed », ou TAS, représente :",["la vitesse au sol d'un avion.","la vitesse propre d'un avion.","la vitesse d'un avion par rapport aux nuages.","la vitesse de croisière d'un avion."],1,"Elle est mesurée par rapport à la masse d'air et non par rapport au sol.","La TAS (True Air Speed) est la vitesse propre de l'avion, c'est-à-dire sa vitesse par rapport à la masse d'air dans laquelle il évolue.","","BIA 2017 · Anglais 18 ✓");
Q("S","La « Ground Speed », ou GS, représente :",["la vitesse propre d'un aéronef.","la vitesse d'un aéronef par rapport aux nuages.","la vitesse de croisière d'un aéronef.","la vitesse sol d'un aéronef en vol."],3,"« Ground » signifie « sol ».","La GS (Ground Speed) est la vitesse sol : la vitesse de l'aéronef par rapport au sol, qui tient compte du vent.","","BIA 2017 · Anglais 19 ✓");
Q("S","En Anglais un hydravion se nomme :",["seaplane.","hydroplane.","floatting craft.","seacraft."],0,"Le mot associe « mer » et « avion ».","Un hydravion se dit « seaplane » en anglais.","","BIA 2017 · Anglais 20 ✓");
Q("F","L'atmosphère est composée majoritairement :",["de dioxyde de carbone (CO2)","de dioxygène (O2)","de diazote (N2)","d'argon (Ar)"],2,"Pense au gaz le plus abondant dans l'air que l'on respire.","L'air sec contient environ 78 % de diazote (N2) et 21 % de dioxygène. Les autres gaz (argon, CO2…) sont présents en faibles proportions.","","BIA 2018 · 1.1 ✓");
Q("F","La couche de l'atmosphère où se concentre la très grande majorité des phénomènes météorologiques est la :",["stratosphère","troposphère","mésosphère","thermosphère"],1,"C'est la couche la plus basse de l'atmosphère.","Les nuages, les précipitations et le vent se développent dans la troposphère, qui s'étend du sol à la tropopause (environ 11 km en latitudes moyennes).","atmo","BIA 2018 · 1.2 ✓");
Q("F","A la latitude de Paris, l'altitude et la température moyennes de la tropopause (atmosphère standard) sont :",["7 km d'altitude et -45°C","11 km d'altitude et -56°C","17 km d'altitude et -45°C","11 km d'altitude et -80°C"],1,"Part de +15 °C au sol et applique le gradient standard jusqu'à la tropopause.","En atmosphère standard, la tropopause se situe à environ 11 km (36 000 ft) où la température est d'environ -56,5 °C, puis elle reste constante dans la basse stratosphère.","atmo","BIA 2018 · 1.3 ✓");
Q("G","Le moyen le plus courant de mesure de la vitesse et de la direction du vent en altitude est :",["la girouette","la manche à air","l'anémomètre","le ballon sonde"],3,"Il faut un instrument qui monte en altitude.","Le vent en altitude est mesuré par des ballons-sondes suivis par radar ou GPS. La girouette, la manche à air et l'anémomètre mesurent le vent au sol.","","BIA 2018 · 1.4 ✓");
Q("I","L'unité utilisée pour exprimer la vitesse du vent dans les messages et cartes météorologiques destinés à l'aéronautique (dossiers de vol) est :",["le nœud","le kilomètre par heure","le mètre par seconde","le pied par minute"],0,"C'est l'unité de vitesse commune à l'aviation et à la marine.","En aéronautique, la vitesse du vent est exprimée en nœuds (kt) dans les METAR, TAF et cartes. 1 kt vaut 1 mille nautique par heure.","","BIA 2018 · 1.5 ✓");
Q("F","Le phénomène de transformation de l'eau de l'état liquide à l'état gazeux est la :",["sublimation","condensation","vaporisation","fusion"],2,"Le passage s'effectue du liquide vers la vapeur.","La vaporisation (évaporation) est le passage de l'état liquide à l'état gazeux. La condensation est le passage inverse.","","BIA 2018 · 1.6 ✓");
Q("F","La Terre reçoit l'énergie solaire émise par :",["rayonnement","conduction","convection","advection"],0,"Entre le Soleil et la Terre il y a du vide.","Le Soleil transmet son énergie à la Terre par rayonnement, seul mode de transfert possible dans le vide spatial.","","BIA 2018 · 1.7 ✓");
Q("F","Le phénomène de convection est le plus intense :",["l'hiver, pendant l'après-midi","l'hiver, pendant la nuit et tôt le matin","l'été, pendant l'après-midi","l'été, pendant la nuit et tôt le matin"],2,"La convection est alimentée par le réchauffement du sol.","La convection thermique est la plus forte quand le sol est le plus chauffé, soit en été en milieu et fin d'après-midi.","","BIA 2018 · 1.8 ✓");
Q("F","Une vaste région où la pression est inférieure à 1015 hPa, et dont la pression minimale est située au centre s'appelle :",["une dorsale","une dépression","un thalweg","un anticyclone"],1,"Le centre est un minimum de pression.","Une dépression est une zone de basses pressions fermée, avec un minimum de pression en son centre. Un anticyclone est un maximum de pression.","isobares","BIA 2018 · 1.9 ✓");
Q("G","Le mouvement relatif de deux masses d'air autour d'un front froid est :",["l'air froid contourne l'air chaud par les côtés","l'air chaud repousse et soulève l'air froid","l'air froid repousse et soulève l'air chaud","l'air chaud repousse l'air froid et passe par-dessus"],2,"Dans un front froid, c'est la masse d'air la plus dense qui avance.","Au passage d'un front froid, l'air froid, plus dense, avance en forme de coin, repousse l'air chaud et le soulève brutalement.","frontfroid","BIA 2018 · 1.11 ✓");
Q("H","Les cirrus, les cirrostratus, les altostratus et les stratus sont tous :",["des nuages que l'on trouve dans l'étage supérieur de l'atmosphère","constitués exclusivement de glace","des nuages cumuliformes","des nuages stables"],3,"Regarde la forme (stratiformes) et le type d'air dans lequel ils se forment.","Ces nuages sont des nuages stratiformes, qui se forment dans un air stable. Ils appartiennent à des étages différents et ne sont pas tous glacés.","","BIA 2018 · 1.12 ✓");
Q("H","L'ordre de grandeur de l'extension verticale des cumulonimbus est :",["100 mètres","1000 mètres","10 000 mètres","100 kilomètres"],2,"Ces nuages peuvent atteindre la tropopause.","Le cumulonimbus a une très grande extension verticale, de la base basse jusqu'à la tropopause, soit de l'ordre de 10 000 m ou plus.","cumulonimbus","BIA 2018 · 1.15 ✓");
Q("G","La circulation du vent autour des centres de pression s'opère de souffle des :",["hautes pressions vers les basses pressions (perpendiculaire aux isobares)","basses pressions vers les hautes pressions (perpendiculaire aux isobares)","basses pressions vers les hautes pressions, dévié vers la gauche dans l'hémisphère nord par la force de Coriolis (tangent aux isobares)","hautes pressions vers les basses pressions, dévié vers la droite dans l'hémisphère nord par la force de Coriolis (tangent aux isobares)"],3,"Le vent va d'un type de centre vers l'autre et la rotation terrestre le dévie.","Le vent souffle des hautes vers les basses pressions. Dans l'hémisphère nord, la force de Coriolis le dévie vers la droite, ce qui le rend quasiment parallèle aux isobares en altitude.","coriolis","BIA 2018 · 1.16 ✓");
Q("G","La Tramontane est :",["un vent qui souffle du secteur nord-ouest, entre les Pyrénées et le Massif Central","l'assèchement de la masse d'air sous le vent d'un massif montagneux","un vent qui souffle du nord vers le sud dans la vallée du Rhône","une onde générée par la déviation d'un vent fort soufflant perpendiculairement à une chaîne montagneuse"],0,"C'est un vent régional du Languedoc-Roussillon.","La Tramontane est un vent froid et sec de nord-ouest, canalisé entre les Pyrénées et le Massif Central. Le vent de la vallée du Rhône est le mistral.","ventsreg","BIA 2018 · 1.17 ✓");
Q("G","La brise de mer :",["s'établit parallèlement aux côtes","s'établit en milieu de matinée et cesse en fin d'après-midi","a une intensité qui ne peut pas dépasser les 5 kt","pénètre sur le continent sur une étendue de quelques dizaines de mètres à quelques centaines de mètres"],1,"Elle dépend du réchauffement de la terre par le soleil dans la journée.","La brise de mer souffle de la mer vers la terre. Elle apparaît en milieu de matinée quand la terre se réchauffe et cesse en fin d'après-midi.","brisemer","BIA 2018 · 1.18 ✓");
Q("H","Le type de nuage qui peut indiquer la présence de turbulences sévères est :",["l'altocumulus lenticularis (lenticulaires)","le stratus","le cirrus","l'altostratus"],0,"Ce nuage a une forme de lentille et se forme près des reliefs.","Les altocumulus lenticulaires signalent des ondes de relief (ondes orographiques) et des rotors, associés à de fortes turbulences.","onde","BIA 2018 · 1.19 ✓");
Q("H","Pour un aéronef en vol, le seul phénomène pouvant être la cause de tous ces dangers (réduction de visibilité, cisaillement de vent, dégâts à la structure, altération du profil aérodynamique, givrage) est :",["l'onde","la turbulence","les précipitations","le brouillard"],2,"Un seul phénomène peut réduire la visibilité, givrer l'aile et endommager la structure.","Les précipitations (pluie, neige, grêle, pluie verglaçante) réduisent la visibilité, peuvent givrer la cellule, altérer le profil, endommager la structure et accompagner un cisaillement.","","BIA 2018 · 1.20 ✓");
Q("A","La vitesse de l'écoulement autour d'une aile :",["augmente sur l'extrados et diminue sur l'intrados.","diminue sur l'extrados et diminue sur l'intrados.","diminue sur l'extrados et augmente sur l'intrados.","augmente sur l'extrados et augmente sur l'intrados."],0,"Compare l'écoulement sur les deux faces de l'aile.","L'air accélère sur l'extrados et ralentit sur l'intrados, ce qui crée une dépression sur le dessus et une surpression dessous.","vitesseprofil","BIA 2018 · 2.1 ✓");
Q("A","Au sein d'un écoulement fluide autour d'une aile, lorsque la vitesse de cet écoulement augmente, la pression statique :",["augmente.","diminue.","est constante quelle que soit la variation de vitesse.","n'augmente que si la température augmente."],1,"Pense à la conservation de l'énergie dans un fluide (Bernoulli).","D'après la relation de Bernoulli, la somme pression statique plus pression dynamique est constante : si la vitesse augmente, la pression statique diminue.","venturi","BIA 2018 · 2.2 ✓");
Q("A","L'origine de la sustentation résulte de l'apparition :",["d'une surpression à l'extrados et d'une dépression à l'intrados.","d'une surpression à l'intrados et d'une dépression à l'extrados.","d'une dépression à l'extrados et à l'intrados.","d'une surpression à l'extrados et à l'intrados."],1,"La résultante doit être dirigée vers le haut.","La sustentation vient d'une dépression sur l'extrados et d'une surpression sur l'intrados : la résultante est dirigée vers le haut.","pression","BIA 2018 · 2.3 ✓");
Q("A","La portance est :",["la force générée par le moteur.","toujours égale et de direction opposée au poids de l'avion.","la composante de la force aérodynamique qui est perpendiculaire à la direction vent relatif.","la composante de la force aérodynamique qui est parallèle à la direction du vent relatif."],2,"La force aérodynamique se décompose en deux composantes.","La force aérodynamique se décompose en portance, perpendiculaire au vent relatif, et en traînée, parallèle au vent relatif.","forces","BIA 2018 · 2.4 ✓");
Q("A","L'angle d'incidence d'un profil est l'angle formé entre :",["la corde du profil et l'horizontale.","l'axe longitudinal de l'avion et la direction du vent relatif.","la direction du vent relatif et l'horizontale.","la corde du profil et la direction du vent relatif."],3,"Deux éléments liés au profil et à l'écoulement.","L'incidence est l'angle entre la corde du profil et la direction du vent relatif. Elle diffère de l'assiette, mesurée par rapport à l'horizontale.","incidence","BIA 2018 · 2.5 ✓");
Q("A","A vitesse constante, si on augmente l'incidence du profil :",["la portance et la traînée augmentent.","la traînée diminue et la portance augmente.","la portance diminue.","la portance augmente et la traînée diminue."],0,"Observe l'évolution des coefficients Cz et Cx avec l'incidence.","Tant que l'on reste avant le décrochage, les coefficients de portance et de traînée augmentent avec l'incidence, donc les deux forces augmentent.","courbe","BIA 2018 · 2.6 ✓");
Q("B","Un planeur vole en air calme à 144 km.h-1, son variomètre indique 0.8 m.s-1, sa finesse est de :",["50.","180.","10.","0.02."],0,"Convertis d'abord la vitesse en m/s.","144 km/h = 40 m/s. La finesse est le rapport vitesse horizontale sur vitesse verticale : 40 / 0,8 = 50.","finesse","BIA 2018 · 2.7 ✓");
Q("B","La vitesse de décrochage d'un avion augmente quand :",["la quantité de carburant dans les réservoirs diminue.","le facteur de charge diminue.","la masse de l'avion diminue.","le facteur de charge augmente."],3,"La vitesse de décrochage dépend du poids apparent.","La vitesse de décrochage croît avec la racine carrée du facteur de charge (et de la masse). Un virage serré ou une ressource l'augmente.","","BIA 2018 · 2.8 ✓");
Q("B","Lors d'une ressource, le facteur de charge :",["augmente.","diminue et la vitesse de décrochage augmente.","reste constant.","diminue ainsi que la vitesse de décrochage."],0,"Une ressource est une trajectoire courbe vers le haut.","Pendant une ressource, la portance doit dépasser le poids : le facteur de charge devient supérieur à 1 et augmente.","facteurcharge","BIA 2018 · 2.9 ✓");
Q("A","L'allongement d'une aile est :",["le rapport envergure sur corde moyenne.","le rapport corde moyenne sur envergure.","fonction de l'épaisseur du profil.","faible sur les planeurs."],0,"C'est un rapport entre deux longueurs de l'aile.","L'allongement est le rapport de l'envergure à la corde moyenne. Il est élevé sur les planeurs, ce qui réduit la traînée induite.","allongementdef","BIA 2018 · 2.10 ✓");
Q("A","La sortie des volets de bord de fuite provoque :",["l'augmentation du coefficient de portance et du coefficient de traînée.","l'augmentation du coefficient de portance et la diminution du coefficient de traînée.","la diminution du coefficient de portance et la diminution du coefficient de traînée.","la diminution du coefficient de portance et l'augmentation du coefficient de traînée."],0,"Les volets servent à voler lentement mais ont un coût.","Les volets augmentent la courbure du profil : ils accroissent le coefficient de portance mais aussi celui de traînée.","volets","BIA 2018 · 2.11 ✓");
Q("C","La position du centre de gravité d'un avion a un effet important sur la stabilité et la maniabilité de l'avion, un centrage arrière rend l'avion :",["peu maniable mais stable autour de l'axe de tangage.","instable autour de l'axe de lacet.","instable autour de l'axe de roulis.","maniable mais moins stable autour de l'axe de tangage."],3,"Plus le centre de gravité est reculé, plus le bras de levier de stabilisation diminue.","Un centrage arrière réduit la stabilité longitudinale (tangage) et augmente la maniabilité de l'avion.","centragecg","BIA 2018 · 2.12 ✓");
Q("D","Le volume de l'enveloppe d'une montgolfière est de 10 000 m3, la masse volumique de l'air extérieur est de 1.225 kg.m-3 et la masse volumique de l'air chaud de 1.100 kg.m-3. La masse totale maximale de la montgolfière est de :",["1250 kg.","12250 kg.","11000 kg.","1100 kg."],0,"La force ascensionnelle vient de la différence de masse volumique.","La masse maximale soulevée est V x (masse volumique extérieure - masse volumique intérieure) = 10 000 x 0,125 = 1250 kg.","cubes","BIA 2018 · 2.13 ✓");
Q("B","Pendant un vol en montée rectiligne à vitesse constante :",["la portance équilibre le poids.","la portance est supérieure au poids.","la portance est inférieure au poids.","le facteur de charge est supérieur à 1."],2,"Dans la montée, une partie du poids est équilibrée par la traction.","En montée stabilisée, la portance équilibre seulement la composante du poids perpendiculaire à la trajectoire, soit P x cos(pente) : elle est inférieure au poids.","montee","BIA 2018 · 2.14 ✓");
Q("L","Un ULM pendulaire est piloté :",["en roulis et en tangage, par traction sur les suspentes.","en roulis seulement, par déplacement du centre de gravité.","en tangage seulement, par déplacement du centre de gravité.","en roulis et en tangage, par déplacement du centre de gravité."],3,"Il n'y a pas de gouvernes classiques sur ce type d'ULM.","Le pendulaire se pilote à la barre : le pilote déplace son poids (donc le centre de gravité) par rapport à l'aile pour agir en roulis et en tangage.","pilotagecg","BIA 2018 · 2.15 ✓");
Q("B","En virage en palier le facteur de charge augmente avec :",["l'altitude.","l'inclinaison.","la masse de l'avion.","la vitesse."],1,"En virage en palier, le facteur de charge vaut 1 / cos de l'angle.","En virage stabilisé en palier, le facteur de charge est égal à 1/cos(inclinaison) : il augmente avec l'inclinaison.","virage","BIA 2018 · 2.16 ✓");
Q("B","En montée, un avion subit un vent arrière qui aura pour conséquence :",["une augmentation du taux de montée.","une diminution de la pente sol.","une augmentation de la pente sol.","une réduction du temps de montée."],1,"Le vent arrière augmente la vitesse par rapport au sol sans changer la vitesse verticale.","Le vent arrière augmente la vitesse sol alors que le taux de montée reste identique : la distance parcourue au sol augmente, donc la pente sol diminue.","ventmontee","BIA 2018 · 2.17 ✓");
Q("C","Le but principal des spoilers est de diminuer :",["la traînée.","la vitesse d'atterrissage.","la portance de l'aile.","la portance et la traînée."],2,"Ce sont des plaques qui perturbent l'écoulement sur l'extrados.","Les spoilers détruisent une partie de la portance de l'aile (et augmentent la traînée), ce qui aide à descendre ou à freiner après l'atterrissage.","aerofreins","BIA 2018 · 2.18 ✓");
Q("L","Sur un hélicoptère, le vrillage d'une pale a pour but de tendre à :",["augmenter la portance de la pale.","uniformiser la portance sur toute la longueur de la pale.","diminuer la traînée.","déplacer le centre de gravité de la pale."],1,"La vitesse de l'air n'est pas la même à l'emplanture et au bout de pale.","Le bout de pale va plus vite que le pied de pale. Le vrillage diminue l'incidence vers l'extrémité pour répartir la portance de façon plus uniforme.","vrillage","BIA 2018 · 2.19 ✓");
Q("E","La base de lancement spatial de Kourou est située proche de l'équateur pour profiter :",["d'une plus grande vitesse de rotation de la Terre.","d'un climat tempéré.","d'une pression atmosphérique faible.","d'un espace aérien réservé à cet usage."],0,"La rotation de la Terre aide à atteindre l'orbite.","À l'équateur, la vitesse linéaire due à la rotation de la Terre est maximale (environ 460 m/s), ce qui économise du carburant lors du lancement vers l'est.","kourou","BIA 2018 · 2.20 ✓");
Q("J","L'hélice à pas variable :",["s'utilise avec grand pas au décollage et petit pas en croisière.","diminue la vitesse de décrochage lorsque le moteur est réduit.","ne peut s'utiliser que sur des avions multimoteurs.","permet de raccourcir la distance de décollage."],3,"Le pas s'adapte à chaque phase de vol.","L'hélice à pas variable utilise un petit pas au décollage (meilleure traction) et un grand pas en croisière, ce qui raccourcit la distance de décollage.","petitgrandpas","BIA 2018 · 3.3 ✓");

Q("J","Un saumon d'aile est :",["la jonction entre l'aile et le fuselage.","une pièce en forme de poisson qui sert à équilibrer l'aileron.","l'extrémité de l'aile appelée aussi bord marginal.","une pièce renforcée de l'aile qui sert de marche pied."],2,"Il se situe à l'opposé de l'emplanture.","Le saumon est l'extrémité de l'aile, aussi appelée bord marginal. La jonction avec le fuselage est l'emplanture.","aileparties","BIA 2018 · 3.9 ✓");

Q("C","Quand le pilote agit sur le manche (ou le volant) à gauche :",["la gouverne de direction se braque à gauche.","l'aileron gauche se lève.","la gouverne de profondeur se braque vers le haut.","l'aileron gauche s'abaisse."],1,"Pour pencher à gauche, l'aile gauche doit perdre de la portance.","Manche à gauche : l'aileron gauche se lève et l'aileron droit s'abaisse, ce qui fait rouler l'avion à gauche.","ailerons","BIA 2018 · 3.15 ✓");

Q("J","Durant un cycle de fonctionnement d'un moteur à pistons, le seul temps qui produit de l'énergie mécanique utile pour la propulsion est :",["l'admission.","l'explosion-détente.","l'échappement.","la compression."],1,"C'est le temps moteur du cycle à quatre temps.","Dans le cycle à quatre temps, seule la combustion-détente fournit de l'énergie. Les autres temps en consomment.","quatretemps","BIA 2018 · 3.17 ✓");

Q("K","L'arc jaune indiqué sur un anémomètre indique :",["la vitesse à ne jamais dépasser.","la plage de vitesse à ne pas utiliser en atmosphère turbulente.","la plage de vitesse où l'utilisation des volets est possible.","la vitesse maximale avec le train d'atterrissage sorti."],1,"C'est une plage de précaution, entre l'arc vert et la ligne rouge.","L'arc jaune signale les vitesses à n'utiliser qu'en air calme. La ligne rouge est la VNE, l'arc blanc concerne les volets.","anemo","BIA 2018 · 3.20 ✓");
Q("M","Votre instructeur vous indique que la déclinaison magnétique est de 1° ouest, pour obtenir votre route magnétique vous devez :",["soustraire cette déclinaison à la valeur de la route vraie.","additionner cette déclinaison à la valeur de la route vraie.","ignorer cette indication car la route vraie est toujours identique à la route magnétique.","multiplier cette valeur par le facteur d'échelle de la carte."],0,"Rappelle-toi la règle : déclinaison Ouest, ...","Quand la déclinaison est ouest, Rm = Rv + D. Quand elle est est, Rm = Rv - D (« Ouest, on ajoute »).","declin","BIA 2018 · 4.3 ✓");
Q("N","Les prévisions météorologiques indiquent également une visibilité horizontale de 7000 m et une couverture nuageuse faible à partir de 12000 ft. Pour votre vol prévu à l'altitude de 2000 ft, cela implique que :",["les conditions de vol à vue ne sont pas suffisantes, le vol doit être reporté.","les conditions de vols correspondent au vol aux instruments.","les conditions de vol à vue ne sont pas suffisantes mais vous tentez quand même le vol.","les conditions de vol à vue sont respectées."],3,"Compare la visibilité et la distance aux nuages avec les minima VFR en basse altitude.","En espace de classe G sous 3000 ft, le vol à vue exige au moins 5 km de visibilité en dehors des nuages. Avec 7 km et des nuages très hauts, les conditions VFR sont respectées.","","BIA 2018 · 4.5 ✓");

Q("N","Au décollage de Péronne, votre instructeur vous demande d'être vigilant vis à vis des aéromodéles évoluant à proximité de l'aérodrome. En France, la fédération qui gère les aéromodéles est la :",["FFAM","FFA","FFVV","FFVL"],0,"L'acronyme contient « aéromodélisme ».","La FFAM est la Fédération Française d'AéroModélisme. La FFA concerne l'aviation légère, la FFVV le vol à voile et la FFVL le vol libre.","","BIA 2018 · 4.10 ✓");
Q("M","Après avoir pris le cap à destination d'Amiens, votre instructeur vous parle du cheminement, cette méthode consiste à :",["suivre uniquement les autoroutes.","suivre les indications du GPS.","suivre le chemin communiqué par le contrôle aérien.","suivre des repères sol caractéristiques."],3,"C'est une méthode de navigation à vue.","Le cheminement consiste à naviguer en suivant des repères visibles au sol (routes, rivières, voies ferrées, villes) identifiés sur la carte.","cheminement","BIA 2018 · 4.11 ✓");
Q("N","A mi-chemin, vous apercevez une montgolfière devant vous, légèrement sur votre gauche et à la même altitude, sa trajectoire converge avec la vôtre :",["la priorité à droite impose pour la montgolfière de changer son altitude de vol.","vous utilisez votre phare d'atterrissage pour prévenir la montgolfière de votre arrivée.","la montgolfière est prioritaire et vous devez modifier votre trajectoire pour l'éviter.","vous êtes réglementairement prioritaire et vous maintenez votre trajectoire."],2,"Les aéronefs les moins manœuvrants sont prioritaires.","Les règles de priorité donnent la priorité aux aéronefs les moins manœuvrants : ballons, puis planeurs, avant les avions motorisés.","priorites","BIA 2018 · 4.12 ✓");
Q("O","En vol, si la météo devait se dégrader fortement devant vous, votre instructeur pourrait vous conseiller de :",["faire demi-tour.","maintenir votre trajectoire en espérant que cette dégradation n'est que passagère.","descendre rapidement pour voir le sol.","maintenir votre trajectoire en découvrant les bases du vol aux instruments."],0,"Prends la décision la plus prudente.","En vol à vue, face à une dégradation, il faut prendre la décision tôt : faire demi-tour ou se dérouter, surtout sans qualification aux instruments.","","BIA 2018 · 4.13 ✓");

Q("N","Avant d'intégrer le tour de piste, vous effectuez un survol de l'aérodrome pour observer la manche à air qui indique :",["le numéro de la piste en service.","le sens et la vitesse du vent.","le sens d'atterrissage, dos au vent.","la température de l'air."],1,"La manche à air est un indicateur météo.","La manche à air indique la direction d'où vient le vent et, par son inclinaison, son intensité approximative. On atterrit face au vent.","manchea","BIA 2018 · 4.17 ✓");

Q("C","Pour orienter l'avion autour de l'axe de tangage, il faut un déplacement :",["de la gouverne de profondeur, commandée par le palonnier.","de la gouverne de profondeur, commandée par le manche.","des ailerons, commandés par le manche.","des ailerons, commandés par le palonnier."],1,"Associe chaque axe à sa gouverne et à sa commande.","Le tangage est contrôlé par la gouverne de profondeur, commandée par le manche (avant/arrière). Les ailerons gèrent le roulis et la direction le lacet.","profondeur","BIA 2019 · 2.5 ✓");
Q("B","La distance de roulage nécessaire au décollage diminue lorsque :",["l'altitude augmente.","la température augmente.","la composante de vent arrière augmente.","la température diminue."],3,"Réfléchis à la densité de l'air nécessaire pour porter l'avion.","Un air froid est plus dense, donc l'hélice et les ailes sont plus efficaces et la distance de décollage diminue. L'altitude, la chaleur et le vent arrière l'allongent.","","BIA 2019 · 2.6 ✓");

Q("A","La force de portance d'une aile est toujours perpendiculaire à :",["la direction du vent relatif.","l'horizontale.","la corde du profil.","l'axe longitudinal de l'appareil."],0,"La portance se définit par rapport à l'écoulement de l'air.","Par définition, la portance est la composante de la force aérodynamique perpendiculaire au vent relatif. La traînée en est la composante parallèle.","forces","BIA 2019 · 2.8 ✓");

Q("B","Lorsqu'un aéronef est centré avant :",["sa stabilité augmente.","sa maniabilité augmente.","sa maniabilité et sa stabilité ne sont pas modifiées.","sa stabilité diminue."],0,"Un centre de gravité avancé éloigne le CG du foyer.","Un centrage avant augmente la stabilité longitudinale mais réduit la maniabilité. Un centrage arrière fait l'inverse.","centragecg","BIA 2019 · 2.10 ✓");
Q("A","En phase de décollage, le pilote sort les volets hypersustentateurs, l'effet sera :",["d'augmenter la distance de décollage.","d'augmenter la portance.","d'augmenter la vitesse.","de diminuer la portance."],1,"Le rôle d'un hypersustentateur est inscrit dans son nom.","Les volets augmentent la cambrure et la surface du profil, donc le coefficient de portance. Cela permet de décoller à plus faible vitesse et sur une distance plus courte.","volets","BIA 2019 · 2.11 ✓");
Q("B","Un avion vole initialement à vitesse et altitude constantes. Sans agir sur le manche, le pilote augmente la puissance à l'aide de la manette des gaz. Cette action entraîne :",["uniquement une augmentation de vitesse.","une augmentation d'altitude.","une diminution d'altitude.","une augmentation de vitesse ou bien d'altitude, cela dépend du vent."],1,"Que devient l'excédent de poussée si l'assiette reste la même ?","Avec le même réglage de profondeur, la vitesse tend à rester voisine de la vitesse de trim. L'excédent de puissance se traduit donc par une montée : l'altitude augmente.","","BIA 2019 · 2.13 ✓");
Q("B","La finesse maximale permet de :",["rester en l'air le plus longtemps possible.","voler le plus vite possible.","parcourir la plus grande distance possible.","décoller le plus court possible."],2,"La finesse est le rapport entre la distance parcourue et la hauteur perdue.","La finesse est le rapport portance sur traînée. À finesse maximale, la distance parcourue en plané est la plus grande.","finesse","BIA 2019 · 2.14 ✓");
Q("B","Le facteur ayant une influence sur la position du centre de gravité d'un aéronef est :",["la vitesse.","l'inclinaison.","la trajectoire.","le niveau de carburant dans les réservoirs."],3,"Le centre de gravité dépend de la répartition des masses.","La position du centre de gravité dépend de la répartition des masses à bord (charge, passagers, bagages, carburant). La consommation de carburant la modifie.","centragecg","BIA 2019 · 2.15 ✓");
Q("B","Lors d'un virage à 60° d'inclinaison, à altitude constante, le poids apparent est :",["égal au poids réel.","égal à 2 fois le poids réel.","égal à 1,15 fois le poids réel.","inférieur au poids réel."],1,"Le facteur de charge vaut 1 divisé par le cosinus de l'inclinaison.","En virage stabilisé à altitude constante, le facteur de charge est 1/cos φ. Pour 60°, cos 60° = 0,5, donc le poids apparent vaut 2 fois le poids réel.","virage","BIA 2019 · 2.16 ✓");
Q("A","La traînée induite est une conséquence de :",["l'interaction du fuselage et de l'aile.","la rotation de l'hélice.","la différente de pression entre l'intrados et l'extrados.","l'usage d'un train fixe."],2,"Elle est liée à la production même de la portance.","La traînée induite provient de la différence de pression entre intrados et extrados, qui crée des tourbillons marginaux en bout d'aile.","allonge","BIA 2019 · 2.17 ✓");
Q("E","Pour un satellite, l'orbite géostationnaire permet :",["de scanner le plus de surface possible du globe.","de rester au-dessus d'un point donné de la surface du globe.","d'effectuer plusieurs révolutions de la Terre en 24 heures.","d'entrer dans l'atmosphère."],1,"Pense à la période de révolution du satellite par rapport à la rotation de la Terre.","Un satellite géostationnaire, à environ 36 000 km d'altitude dans le plan équatorial, tourne à la même vitesse angulaire que la Terre. Il reste donc au-dessus du même point.","orbites","BIA 2019 · 2.19 ✓");
Q("E","L'assistance gravitationnelle :",["permet le retour du lanceur sur Terre.","est une ligne téléphonique entre l'ISS et la Terre en cas de besoin d'assistance.","est utilisée comme « moteur » afin d'accélérer les sondes lors de leurs voyages interstellaires.","est un propulseur."],2,"Une sonde utilise l'attraction d'un astre sans consommer d'ergols.","En passant près d'une planète, une sonde emprunte une partie de son énergie orbitale, ce qui modifie sa vitesse et sa trajectoire sans carburant.","assistancegrav","BIA 2019 · 2.20 ✓");
Q("E","Un satellite qui tourne autour de la Terre exactement en 24 heures, placé à une altitude de 36000 km et qui reste toujours au-dessus du même lieu s'appelle :",["un satellite espion.","un satellite GPS.","un satellite quantique.","un satellite géostationnaire."],3,"Les indices sont la période de 24 h et l'immobilité apparente.","Un satellite géostationnaire est placé à environ 36 000 km dans le plan équatorial. Sa période égale celle de la rotation terrestre, il paraît donc fixe au-dessus d'un point.","orbites","BIA 2019 · 3.1 ✓");
Q("D","La soupape qui permet l'évacuation de l'air chaud pour faire descendre un ballon est placée :",["sur la première couronne.","sur la deuxième couronne.","à la base de l'enveloppe.","au sommet de l'enveloppe."],3,"L'air chaud monte : où faut-il ouvrir pour le laisser sortir ?","La soupape (parachute) se trouve au sommet de l'enveloppe. Le pilote l'ouvre pour évacuer l'air chaud et faire descendre le ballon.","montg","BIA 2019 · 3.2 ✓");

Q("J","La chambre de combustion d'un turboréacteur est située :",["entre l'entrée d'air et le compresseur.","entre la turbine et la tuyère.","entre le compresseur et la turbine.","dans le canal d'éjection."],2,"Suis le trajet de l'air : il est comprimé avant d'être chauffé.","Dans un turboréacteur, l'air est comprimé, puis le carburant y est brûlé dans la chambre de combustion, avant la détente dans la turbine puis la tuyère.","turbo","BIA 2019 · 3.6 ✓");
Q("J","Lors de la visite prévol, la purge des réservoirs a pour but :",["de vidanger le carburant.","d'enlever les bulles d'air présentes dans le circuit carburant.","d'éliminer les impuretés piégées dans les filtres.","de contrôler d'éventuelles traces d'eau présentes dans le réservoir."],3,"L'eau est plus dense que l'essence et se dépose au point bas.","La purge aux points bas des réservoirs permet de recueillir un échantillon de carburant. On y vérifie l'absence d'eau, dangereuse pour le moteur.","","BIA 2019 · 3.7 ✓");

Q("J","Un train classique est constitué de :",["un train principal et une roulette de queue.","un train principal et une roulette de nez.","un train monotrace et deux balancines.","un diabolo avant et deux roulettes arrière."],0,"Distingue le train classique du train tricycle.","Un train classique comporte deux roues principales à l'avant du centre de gravité et une roulette de queue. Le train tricycle a une roulette de nez.","tricycle","BIA 2019 · 3.12 ✓");
Q("J","Pour un avion en bois et toile moderne :",["seules les ailes sont en bois recouvert de toile.","les longerons d'aile sont en bois et les nervures en alliage d'aluminium.","toute la structure est en bois recouvert de toile.","le fuselage est en bois entoilé et l'aile en alliage métallique."],2,"L'expression désigne un mode de construction complet.","Un avion en bois et toile a une structure entièrement en bois (fuselage et ailes) recouverte de toile.","","BIA 2019 · 3.13 ✓");
Q("C","Pour effectuer une rotation autour de l'axe de roulis, le pilote doit :",["modifier la profondeur à l'aide du compensateur.","déplacer le manche en avant ou en arrière.","déplacer le manche à gauche ou à droite.","actionner le palonnier."],2,"Le roulis est commandé par les ailerons.","Le roulis est obtenu par le braquage différentiel des ailerons, commandés par le déplacement latéral du manche.","ailerons","BIA 2019 · 3.14 ✓");
Q("L","En aéromodélisme, un avion d'apprentissage « deux axes » est pilotable sur les axes de :",["roulis et lacet.","roulis uniquement.","tangage et roulis.","tangage et lacet."],3,"Un modèle d'apprentissage utilise la profondeur et un autre axe.","Le modèle deux axes est piloté sur le tangage (profondeur) et le roulis (ailerons), selon le corrigé officiel.","axes","BIA 2019 · 3.16 ✓");
Q("J","Le grand pas d'une hélice à pas variable est utilisé pour :",["le décollage.","l'atterrissage.","le décollage et l'atterrissage.","le vol de croisière."],3,"Le grand pas est l'équivalent de la vitesse élevée sur une voiture.","Le petit pas convient au décollage et à la montée, le grand pas à la croisière à grande vitesse.","petitgrandpas","BIA 2019 · 3.17 ✓");

Q("K","La VNE que l'on peut lire sur l'anémomètre correspond à :",["la vitesse minimale avec un cran de volet.","la vitesse à ne jamais dépasser.","la vitesse maximale de sortie du train rentrant.","la vitesse d'utilisation avec les volets sortis."],1,"L'arc rouge de l'anémomètre est associé à cette vitesse.","La VNE (Velocity Never Exceed) est la vitesse à ne jamais dépasser. Elle est repérée par un trait rouge sur l'anémomètre.","anemo","BIA 2019 · 3.20 ✓");
Q("N","La hauteur minimale de survol d'une agglomération ne dépassant pas 1200m de largeur moyenne en monomoteur est de :",["500 m.","1500 m.","300 m.","150 m."],0,"Un monomoteur doit rester plus haut qu'un multimoteur pour pouvoir planer hors de la ville.","Pour un monomoteur, la hauteur minimale de survol d'une agglomération de moins de 1200 m de large est de 500 m. Elle est de 1500 m pour une agglomération plus grande.","","BIA 2019 · 4.1 ✓");

Q("M","Sur une carte au 1/250 000éme, une distance mesurée de 10 cm correspond à :",["2,5 km.","50 km.","25 km.","5 km."],2,"Multiplie par 250 000 puis convertis les centimètres en kilomètres.","10 cm × 250 000 = 2 500 000 cm = 25 km.","echelle","BIA 2019 · 4.3 ✓");
Q("M","Un aéronef faisant route vers le sud, a une vitesse propre de 140 km/h. Il subit un vent d'est de 50 km/h, il doit suivre approximativement un cap au :",["160°","180°","190°","200°"],0,"Un vent d'est vient de l'est et pousse l'avion vers l'ouest : de quel côté faut-il corriger ?","Le vent d'est pousse l'avion vers l'ouest. Il faut donc afficher un cap à l'est du sud. L'angle de dérive vaut environ arcsin(50/140), soit 21°, donc un cap voisin de 160°.","capcourse","BIA 2019 · 4.4 ✓");
Q("N","Le numéro d'une piste dont l'orientation magnétique est de 126° est :",["12.","13.","126.","130."],1,"Le numéro est l'orientation en dizaines de degrés, arrondie.","Le numéro de piste est l'orientation magnétique arrondie à la dizaine la plus proche, divisée par 10 : 126° donne 130°, donc la piste 13.","numeropiste","BIA 2019 · 4.5 ✓");

Q("N","Un aéronef doit dépasser un autre aéronef par :",["la droite et il n'est pas prioritaire.","la gauche et il n'est pas prioritaire.","la droite et il est prioritaire.","la gauche et il est prioritaire."],0,"Un aéronef qui en dépasse un autre doit lui céder le passage.","Un aéronef qui en rattrape un autre le dépasse par la droite. Il doit laisser la priorité à celui qu'il dépasse.","priorites","BIA 2019 · 4.7 ✓");
Q("N","Sur un aérodrome en auto information, la première phase d'intégration d'un circuit d'aérodrome est :",["la vent arrière.","l'étape de base.","la finale.","la courte finale."],0,"L'intégration se fait à un endroit précis du circuit, pas en finale.","En auto-information, on s'intègre dans le circuit en vent arrière, après avoir observé le trafic et annoncé sa position.","circuit","BIA 2019 · 4.8 ✓");

Q("G","Si un observateur se place face au vent dans l'hémisphère nord, la dépression et l'anticyclone se situent de la manière suivante :",["anticyclone sur sa droite, dépression sur sa gauche.","anticyclone face à lui, dépression derrière lui.","anticyclone sur sa gauche, dépression sur sa droite.","anticyclone derrière lui, dépression face à lui."],2,"Rappelle-toi la loi de Buys-Ballot : dos au vent, où est la dépression ?","Dans l'hémisphère nord, dos au vent, les basses pressions sont à gauche. En se plaçant face au vent, c'est l'inverse : dépression à droite et anticyclone à gauche.","buysballot","BIA 2020 · 1.9 ✓");
