Q("H","La grêle est un type de précipitation qui se forme dans :",["les stratus.","les altostratus.","les cumulonimbus.","les stratocumulus."],2,"Il faut de forts courants ascendants.","La grêle se forme dans les cumulonimbus, nuages d'orage à fort développement vertical, où de puissants courants ascendants font grossir les grêlons.","cumulonimbus","BIA 2020 · 1.14 ✓");

Q("B","En montée rectiligne à vitesse constante :",["le facteur de charge est supérieur à 1.","le facteur de charge est égal à 1.","la portance est supérieure au poids.","la portance est inférieure au poids."],3,"Le facteur de charge ne dépasse 1 qu'en cas de manoeuvre ou de turbulence.","En montée rectiligne uniforme, il n'y a pas d'accélération perpendiculaire à la trajectoire. Le facteur de charge est donc de l'ordre de 1, et non supérieur.","montee","BIA 2020 · 2.6 ✓");
Q("B","En montée, le pilote d'avion affiche la pleine puissance, pour augmenter la vitesse indiquée, le pilote :",["diminue l'assiette en poussant sur le manche.","diminue l'assiette en tirant sur le manche.","augmente l'assiette en poussant sur le manche.","augmente l'assiette en tirant sur le manche."],0,"À puissance constante, plus on cabre, plus la vitesse chute.","Pour accélérer à puissance constante, on baisse le nez en poussant le manche. L'assiette diminue et la vitesse augmente.","assietteincidencepente","BIA 2020 · 2.7 ✓");
Q("B","En vol en palier, en cas de diminution de vitesse, pour maintenir une altitude constante, le pilote doit :",["faire varier l'assiette à cabrer.","faire varier l'assiette à piquer.","ne rien faire.","adopter une incidence supérieure à l'assiette."],0,"La portance dépend de la vitesse et de l'incidence.","Quand la vitesse diminue, il faut augmenter l'incidence pour conserver la même portance, donc cabrer l'avion.","assietteincidencepente","BIA 2020 · 2.8 ✓");
Q("C","La position du centre de gravité d'un avion a un effet important sur la stabilité et la maniabilité de l'avion, un centrage avant rend l'avion :",["maniable mais moins stable autour de l'axe de tangage.","maniable et stable autour de l'axe de tangage.","peu maniable et moins stable autour de l'axe de tangage.","peu maniable mais stable autour de l'axe de tangage."],3,"Plus le centre de gravité est loin en avant, plus l'avion est « lourd » du nez.","Un centrage avant augmente la stabilité en tangage mais réduit la maniabilité. Un centrage arrière fait l'inverse.","centragecg","BIA 2020 · 2.9 ✓");
Q("A","Pour un avion léger, le décrochage se produit :",["toujours à la même vitesse.","toujours à la même incidence.","quand la masse de l'aéronef diminue.","quand le facteur de charge diminue."],1,"Une seule de ces grandeurs est liée à l'angle d'attaque.","Le décrochage se produit à l'incidence critique, quelles que soient la masse ou la vitesse. Seule la vitesse de décrochage varie.","courbe","BIA 2020 · 2.10 ✓");
Q("B","En descente rectiligne uniforme sans moteur :",["la portance et le poids sont directement opposés.","la traînée et le poids sont directement opposés.","la composante du poids parallèle à la trajectoire s'oppose à la traînée pour l'équilibrer.","la composante du poids perpendiculaire à la trajectoire s'oppose à la traînée pour l'équilibrer."],2,"Décompose le poids selon la trajectoire et perpendiculairement.","En vol plané stabilisé, la composante du poids le long de la trajectoire équilibre la traînée, et la portance équilibre la composante perpendiculaire.","plane","BIA 2020 · 2.13 ✓");
Q("C","Le lacet inverse est dû à :",["une portance plus importante de la demi aile située à l'intérieur du virage.","une traînée plus importante de la demi aile située à l'intérieur du virage.","une traînée plus importante du côté de l'aileron levé que du côté de l'aileron abaissé.","une traînée plus importante du côté de l'aileron abaissé que du côté de l'aileron levé."],3,"Compare la traînée de la demi-aile qui monte et de celle qui descend.","L'aileron abaissé accroît la portance et la traînée induite de sa demi-aile. L'avion tend à lacer du côté opposé au virage voulu : c'est le lacet inverse.","lacetinverse","BIA 2020 · 2.14 ✓");
Q("B","La finesse d'un aéronef peut s'exprimer par le rapport :",["coefficient de traînée sur coefficient de portance.","vitesse verticale sur vitesse horizontale.","la distance parcourue en vol plané sur la hauteur perdue.","la hauteur perdue sur la distance parcourue en vol plané."],2,"Une grande finesse permet d'aller loin en perdant peu de hauteur.","La finesse est le rapport portance sur traînée, soit la distance parcourue en vol plané divisée par la hauteur perdue.","finesse","BIA 2020 · 2.15 ✓");
Q("B","La vitesse de finesse maximum d'un planeur :",["reste constante quand charge alaire augmente (ballastage).","augmente quand la charge alaire augmente.","augmente quand la charge alaire diminue.","diminue quand la portance augmente."],1,"Plus le planeur est lourd, plus il doit aller vite pour rester à la même incidence.","La finesse maximale est atteinte à une incidence donnée. Si la charge alaire augmente (ballast), la vitesse correspondante augmente, sans changer la finesse.","","BIA 2020 · 2.16 ✓");
Q("A","En finale, le braquage des volets de courbure a pour conséquence :",["une augmentation de la portance et une diminution de la traînée.","une augmentation de la portance et une augmentation de la traînée.","une diminution de la portance et une augmentation de la traînée.","une diminution de la portance et une diminution de la traînée."],1,"Les volets permettent de voler plus lentement, mais à quel prix ?","Les volets de courbure augmentent la courbure du profil : la portance maximale et la traînée augmentent. On peut ainsi voler plus lentement et descendre plus pentu.","volets","BIA 2020 · 2.17 ✓");
Q("C","Le virage d'un ULM pendulaire est commandé :",["par déplacement du centre de gravité du chariot.","par traction sur les suspentes.","par action sur le manche.","par action sur le palonnier."],0,"Le chariot est suspendu sous l'aile.","Sur un ULM pendulaire, le pilote pilote en déplaçant le chariot par rapport à l'aile, ce qui déplace le centre de gravité et incline l'ensemble.","pendulaire","BIA 2020 · 2.18 ✓");
Q("D","Le déplacement horizontal d'une montgolfière se fait :",["au gré des vents.","grâce à la différence de température entre l'intérieur et l'extérieur de l'enveloppe.","grâce à la poussée d'Archimède.","en agissant sur la soupape qui bouche le sommet de l'enveloppe."],0,"Une montgolfière n'a pas de propulsion.","La montgolfière n'a pas de moteur : le pilote ne contrôle que l'altitude, et le déplacement horizontal est dû au vent.","vents","BIA 2020 · 2.19 ✓");
Q("L","Sur un hélicoptère à assiette nulle, la commande appelée levier de pas collectif permet de modifier l'incidence des pales du rotor, elle permet ainsi :",["de contrôler les mouvements autour de l'axe de lacet.","de contrôler les mouvements autour de l'axe de tangage.","de modifier la portance pour le faire avancer ou reculer.","de modifier la portance pour le faire monter ou descendre."],3,"Le pas collectif modifie toutes les pales en même temps.","Le pas collectif change simultanément l'incidence de toutes les pales, donc la portance totale du rotor : l'hélicoptère monte ou descend.","pas","BIA 2020 · 2.20 ✓");
Q("J","Un avion possède des réservoirs de carburant en bout d'ailes. Lorsqu'il est au sol, le remplissage de ces réservoirs a pour conséquence :",["une traction de l'intrados et de l'extrados.","une compression de l'extrados et une traction de l'intrados.","une compression de l'intrados et de l'extrados.","une traction de l'extrados et une compression de l'intrados."],3,"Imagine l'aile comme une poutre encastrée à l'emplanture, chargée à son extrémité.","Au sol, l'aile est soutenue à l'emplanture et le poids des réservoirs la fait fléchir vers le bas. La face supérieure (extrados) est en traction et la face inférieure (intrados) en compression.","flexionaile","BIA 2020 · 3.4 ✓");
Q("J","Durant un cycle de fonctionnement d'un moteur à pistons (4 temps), le seul temps qui produit de l'énergie mécanique utile pour la propulsion est :",["l'admission.","la compression.","l'échappement.","la combustion-détente."],3,"Quel temps repousse le piston grâce à la pression des gaz brûlés ?","Seul le temps de combustion-détente est moteur : les gaz chauds repoussent le piston. Les autres temps consomment de l'énergie.","quatretemps","BIA 2020 · 3.6 ✓");
Q("C","En avion, l'action qui permet une rotation autour de l'axe de tangage est :",["un déplacement en avant ou en arrière du manche.","un déplacement latéral du manche.","une poussée à gauche ou à droite sur les palonniers.","un déplacement latéral du manche et simultanément une poussée des palonniers."],0,"Le tangage correspond au mouvement « nez haut, nez bas ».","Le manche agit sur la gouverne de profondeur : tiré ou poussé, il commande la rotation autour de l'axe de tangage.","profondeur","BIA 2020 · 3.9 ✓");
Q("K","L'anémomètre est un instrument qui mesure :",["la pression totale uniquement grâce à la sonde Pitot.","la pression statique uniquement grâce au capteur de pression présent sur le fuselage.","la pression dynamique à partir des pressions totale et statique.","la vitesse verticale de l'avion."],2,"L'anémomètre utilise les deux prises de pression.","L'anémomètre compare la pression totale (sonde Pitot) et la pression statique. Leur différence est la pression dynamique, image de la vitesse.","pitot","BIA 2020 · 3.16 ✓");
Q("J","Dans un turbopropulseur l'air suit le trajet suivant :",["échappement, turbine, chambre de combustion, compresseur.","compresseur, chambre de combustion, turbine, échappement.","turbine, compresseur, chambre de combustion, échappement.","compresseur, échappement, chambre de combustion, turbine."],1,"L'air est d'abord comprimé, puis chauffé, puis détendu.","Dans un turbopropulseur, l'air traverse le compresseur, la chambre de combustion, puis la turbine, avant l'échappement. La turbine entraîne le compresseur et l'hélice.","turbopropu","BIA 2020 · 3.18 ✓");
Q("L","Un autogire :",["est un petit hélicoptère.","est un drone.","peut décoller verticalement et effectuer un vol stationnaire.","est équipé d'une hélice entraînée par le moteur et d'un rotor entraîné par le vent relatif."],3,"Dans un autogire, le rotor tourne sans être entraîné par le moteur.","L'autogire est propulsé par une hélice, et son rotor, non motorisé, tourne en autorotation sous l'effet du vent relatif. Il ne peut pas faire de vol stationnaire.","autogire","BIA 2020 · 3.19 ✓");
Q("L","Le rotor anticouple de l'hélicoptère permet de contrôler :",["la rotation autour de l'axe de lacet.","la rotation autour de l'axe de tangage.","la rotation autour de l'axe de roulis.","la vitesse ascensionnelle."],0,"Il compense la réaction au couple du rotor principal.","Le rotor anticouple compense le couple du rotor principal et, via les palonniers, permet de contrôler la rotation autour de l'axe de lacet.","helico","BIA 2020 · 3.20 ✓");
Q("M","A votre arrivée à NICE-Côte d'Azur, le responsable « communication » de l'aéroport vous indique que cette plateforme dispose de deux pistes désignées 22L et 22R, vous comprenez que la piste 22L est :",["la piste utilisée pour les avions lents, la 22R celle utilisée pour les avions rapides.","réservée aux avions légers et la 22R est renforcée pour les avions lourds.","est à la droite de la piste 22R.","est à gauche de la piste 22R."],3,"La lettre indique la position de la piste dans le sens de l'atterrissage.","Les lettres L (left) et R (right) distinguent des pistes parallèles de même orientation. 22L est la piste de gauche, vue dans le sens d'utilisation.","numeropiste","BIA 2020 · 4.1 ✓");
Q("M","Une piste dont l'orientation magnétique est 043 sera numérotée",["43.","45.","04.","05."],2,"On arrondit à la dizaine la plus proche, puis on garde deux chiffres.","Le numéro de piste est l'orientation magnétique arrondie à la dizaine, divisée par 10. 043° est arrondi à 040°, d'où la piste 04.","numeropiste","BIA 2020 · 4.2 ✓");
Q("M","Sur la carte VAC, vous pouvez identifier les coordonnées en latitude et longitude de l'aéroport, la latitude de 43° 39' et 55'' N est relevée par rapport :",["au méridien de Greenwich.","à l'équateur.","au pôle Nord.","au tropique du Cancer."],1,"Longitude et latitude n'ont pas la même origine.","La latitude est l'angle mesuré depuis l'équateur, vers le nord ou vers le sud. La longitude est mesurée depuis le méridien de Greenwich.","latlon","BIA 2020 · 4.5 ✓");
Q("R","Le code OACI de l'aéroport de Nice-Côte d'Azur est indiqué sur la carte VAC (doc. N°1), il s'agit de LFMN. L'OACI est un organisme chargé d'établir le cadre réglementaire de la sécurité de l'aviation civile :",["uniquement au niveau de la France.","sous la responsabilité du ministère des transports.","au niveau mondial.","en Europe uniquement."],2,"Le « I » de OACI signifie « internationale ».","L'Organisation de l'aviation civile internationale (OACI) est une agence de l'ONU. Elle établit des normes et pratiques recommandées applicables dans le monde entier.","","BIA 2020 · 4.6 ✓");
Q("O","Après la visite de la tour de contrôle, on vous équipe d'un gilet jaune pour vous permettre de vous rendre sur les parkings, vous assistez au chargement des bagages dans un A319, le pilote vient à votre rencontre, il vient de terminer sa visite pré-vol,",["normal, nous sommes le lundi et cette visite doit s'effectuer tous les lundis.","comme pour tout aéronef, petit ou grand, cette visite est obligatoire avant chaque vol.","pour les avions de ligne, cette visite peut également être réalisée par les stewards.","cette visite n'est pas systématique mais le pilote a voulu vous faire plaisir en la réalisant devant votre classe."],1,"Pense à la fréquence de la visite pré-vol.","La visite pré-vol est une inspection obligatoire avant chaque vol, quel que soit le type d'aéronef. Elle relève du pilote commandant de bord.","","BIA 2020 · 4.7 ✓");
Q("M","Le pilote vous explique ensuite que son vol est à destination de l'aéroport de LESQUIN, soit une distance mesurée de 83 cm sur une carte aéronautique au 1/1 000 000, la distance réelle entre NICE et LESQUIN est donc de :",["83 km.","83 Nm.","830 km.","830 Nm."],2,"À l'échelle 1/1 000 000, 1 cm représente un nombre rond de kilomètres.","À l'échelle 1/1 000 000, 1 cm sur la carte correspond à 1 000 000 cm, soit 10 km, donc 83 cm représentent 830 km.","echelle","BIA 2020 · 4.8 ✓");
Q("N","Votre vol VFR vous amène à traverser une TMA de classe D :",["c'est une zone non contrôlée.","c'est une zone contrôlée qui nécessite une clairance.","c'est une zone contrôlée qui ne nécessite jamais de clairance.","c'est une zone interdite au vol VFR."],1,"Une TMA est un espace contrôlé ; les VFR y sont admis en classe D sous condition.","En classe D, les vols VFR sont admis mais doivent contacter le contrôle et obtenir une clairance avant d'y entrer.","espaces","BIA 2020 · 4.9 ✓");
Q("M","La route géographique ou route vraie sur la première branches est de 330°, la déclinaison magnétique est de 2°E, votre route magnétique est de :",["330°.","328°.","332°.","32°."],1,"Route vraie = route magnétique + déclinaison (Est positive).","Rv = Rm + D avec D positive à l'est. Rm = 330° - 2° = 328°.","declin","BIA 2020 · 4.10 ✓");
Q("M","Sur la branche suivante, vous devez suivre une route magnétique au 350°, votre avion a une vitesse propre de 120 kt, le vent vient du 020° pour 20kt. Pour rester sur votre route, vous devez suivre un cap magnétique de :",["330°.","345°.","350°.","355°."],3,"Le vent vient de la droite de la route : de quel côté faut-il corriger ?","Le vent vient de 30° à droite de la route, la dérive est d'environ 5°. Il faut corriger face au vent, donc vers la droite : cap ≈ 350° + 5° = 355°.","capcourse","BIA 2020 · 4.11 ✓");
Q("N","Des nuages vous obligent à descendre à 3000 ft QNH, le relief sur votre route est de 2700 ft,",["vous continuez, votre altitude est suffisante pour passer.","vous montez dans les nuages le temps de passer le relief en toute sécurité.","vous contournez pour respecter une hauteur de survol de 1000 ft minimum imposé par la réglementation.","vous contournez pour respecter une hauteur de survol de 500 ft minimum imposé par la réglementation."],3,"Calcule la hauteur au-dessus du relief et compare-la au minimum réglementaire.","La hauteur au-dessus du relief est de 3000 - 2700 = 300 ft, inférieure aux 500 ft minimum en VFR hors agglomération. Il faut contourner ou rester sous les nuages à distance.","hauteurs","BIA 2020 · 4.12 ✓");
Q("K","Le transpondeur qui équipe votre avion permet :",["d'identifier et de suivre un vol à l'aide d'un radar au sol.","d'effectuer un vol sans visibilité.","la pratique du VFR en haute altitude.","de recevoir des informations météo en vol (VOLMET)."],0,"Il répond aux interrogations du radar secondaire.","Le transpondeur répond au radar secondaire en émettant un code et, selon le mode, l'altitude. Le contrôle identifie et suit ainsi l'avion.","","BIA 2020 · 4.13 ✓");
Q("O","L'augmentation d'altitude peut entraîner un risque d'hypoxie, c'est :",["une absorption d'oxygène pure en trop grande quantité entraînant des malaises.","un manque de pression de l'oxygène absorbé entraînant des altérations de la mémoire, du jugement et de l'attention.","un manque de sucre dans le sang entraînant des malaises.","une baisse de tension."],1,"Quand l'altitude augmente, la pression de l'air diminue.","L'hypoxie est un manque d'oxygène pour l'organisme : à haute altitude, la pression partielle d'oxygène baisse et les fonctions mentales sont altérées.","hypoxie","BIA 2020 · 4.14 ✓");
Q("N","En arrivant au sud de Lyon vous constatez qu'il y a sur votre route une zone notée P18, c'est une zone :",["dangereuse.","interdite.","réglementée.","sans objet pour les vols VFR."],1,"Observe la lettre qui précède le numéro de zone.","Sur les cartes aéronautiques, P désigne une zone interdite, R une zone réglementée et D une zone dangereuse.","","BIA 2020 · 4.15 ✓");
Q("M","Vous décidez de terminer votre navigation en cheminement, c'est une méthode qui consiste à suivre :",["des repères caractéristiques au sol.","les chemins.","les indications du GPS.","la direction indiquée par le VOR."],0,"C'est la navigation à vue.","La navigation en cheminement consiste à se guider sur des repères visibles au sol (routes, rivières, voies ferrées, villes), repérés sur la carte.","cheminement","BIA 2020 · 4.16 ✓");
Q("M","Votre aéronef vole à la vitesse de 120 kt, vous êtes à 12 Nm du terrain d'arrivée. Vous estimez votre arrivée dans :",["30 minutes.","11 minutes.","6 minutes.","4 minutes."],2,"120 kt, c'est 2 Nm par minute.","À 120 kt, l'avion parcourt 2 Nm par minute. 12 Nm demandent donc 12/2 = 6 minutes.","","BIA 2020 · 4.17 ✓");
Q("N","Le vol VFR est :",["un vol effectué dans des conditions de vol à vue.","un vol effectué dans des conditions de vol aux instruments.","un vol de type commercial.","un vol limité aux tours de piste."],0,"VFR signifie Visual Flight Rules.","Le vol VFR (Visual Flight Rules, règles de vol à vue) se pratique avec des repères visuels extérieurs, dans des conditions météo minimales.","","BIA 2020 · 4.19 ✓");
Q("M","Sur une carte au 1/500 000, une distance mesurée de 10 cm correspond à une distance réelle de :",["50 km.","5 km.","15 km.","150 km."],0,"Multiplie la distance mesurée par le dénominateur de l'échelle.","10 cm × 500 000 = 5 000 000 cm, soit 50 km.","echelle","BIA 2020 · 4.20 ✓");
Q("P","En 1910, Henri Fabre est le premier à décoller à bord d'un :",["bimoteur.","hydravion.","planeur.","autogire."],1,"Il a décollé de l'étang de Berre.","Le 28 mars 1910, Henri Fabre décolle de l'étang de Berre avec le « Canard », le premier hydravion.","","BIA 2020 · 5.6 ✓");
Q("P","Il y a 100 ans, en 1920, toute jeune brevetée, René Caudron l'engage et en fait la première femme pilote d'essai. Elle passe à la postérité pour avoir vaincu la Cordillière des Andes un an plus tard. Elle s'appelait :",["Hélène Boucher","Maryse Hilsz","Adrienne Bolland","Jacqueline Auriol"],2,"Elle a traversé les Andes en 1921 sur un Caudron.","Adrienne Bolland, pilote d'essai chez Caudron, est la première femme à traverser la cordillère des Andes, en avril 1921.","cartetraversees","BIA 2020 · 5.7 ✓");
Q("P","En 1907, Paul Cornu décolle avec un engin de son invention, est-ce un :",["autogire.","dirigeable.","hélicoptère.","hydroptère."],2,"Cet engin se soulève grâce à des rotors.","En novembre 1907, Paul Cornu réalise à Lisieux le premier décollage libre d'un hélicoptère avec un pilote à bord.","","BIA 2020 · 5.8 ✓");
Q("P","Le meilleur avion de chasse de la Première Guerre mondiale fut le :",["Caudron G3.","Spitfire.","Spad 13.","Blériot XI."],2,"Un seul de ces avions est un chasseur de 1914-1918.","Le Spad XIII est l'un des meilleurs chasseurs de la Première Guerre mondiale. Le Spitfire date de la Seconde Guerre mondiale.","","BIA 2020 · 5.9 ✓");
Q("P","L'autogire a été inventé par un jeune ingénieur, c'était :",["Louis Bréguet.","Juan de la Cierva.","Ernst Heinkel.","Serge Dassault."],1,"Cet ingénieur espagnol a fait voler le premier autogire en 1923.","Juan de la Cierva, ingénieur espagnol, a inventé l'autogire, dont le premier vol réussi date de 1923.","autogire","BIA 2020 · 5.10 ✓");
Q("P","Un peu avant la Première Guerre mondiale, l'ingénieur Raoul Badin se rend célèbre par une innovation concernant :",["un instrument de bord destiné à mesurer la vitesse de l'aéronef par rapport à l'air dans lequel il évolue.","le tir à travers l'hélice sans heurter les pales.","la disposition en étoile des cylindres d'un moteur.","le siège éjectable."],0,"Son nom a longtemps désigné un instrument de bord.","Raoul Badin a conçu un anémomètre à tube de Pitot et Venturi, qui indique la vitesse de l'avion par rapport à l'air. On l'a longtemps appelé « badin ».","pitot","BIA 2020 · 5.11 ✓");
Q("P","Le pilote de chasse qui détient le plus grand nombre de victoires confirmées en 1914-1918 s'appelle :",["Pierre Clostermann.","René Fonck.","Georges Guynemer.","Manfred von Richtoffen."],3,"Le plus grand total, tous camps confondus, est de 80 victoires.","Manfred von Richthofen, le « Baron rouge », compte 80 victoires aériennes confirmées. René Fonck, 75 victoires, est le meilleur as allié.","","BIA 2020 · 5.12 ✓");
Q("P","Le constructeur français impliqué dans la création de l'Aéropostale pour établir une ligne aérienne entre la France et l'Amérique du sud s'appelait :",["Louis Blériot.","Marcel Dassault.","Pierre-Georges Latécoère.","Claude Dornier."],2,"Cet industriel toulousain a lancé une ligne Toulouse-Casablanca en 1919.","Pierre-Georges Latécoère a créé la ligne Toulouse-Casablanca en 1919, puis la compagnie qui deviendra l'Aéropostale et desservira l'Amérique du Sud.","","BIA 2020 · 5.13 ✓");
Q("P","Dans les années 1930 en France, un plan d'eau a servi de base aux hydravions pour les traversées de l'Atlantique, devenant ainsi un aéroport international, c'est :",["le lac de Biscarosse.","le lac du Bourget.","l'étang de Berre.","l'étang de Thau."],0,"Cet étang est proche de Marseille.","L'étang de Berre, à Marignane, est devenu une base d'hydravions internationale dans les années 1930, notamment pour les liaisons transatlantiques.","","BIA 2020 · 5.14 ✓");
Q("P","L'Aéropostale fut à l'origine de la création d'une grande compagnie aérienne en 1933, elle s'appelait :",["Air Inter.","Air France.","Air Atlantique.","Air Littoral."],1,"C'est aujourd'hui la compagnie nationale française.","Air France est créée en 1933 par la fusion de plusieurs compagnies, dont l'Aéropostale.","","BIA 2020 · 5.15 ✓");
Q("P","Amelia Earhart, pilote américaine, reste célèbre pour avoir été la première femme seule aux commandes de son avion à :",["franchir la Cordillère des Andes.","traverser la mer Méditerranée.","survoler le Pôle Nord.","traverser l'océan Atlantique."],3,"Elle a rejoint l'Irlande depuis Terre-Neuve en 1932.","En mai 1932, Amelia Earhart devient la première femme à traverser l'Atlantique en solitaire.","","BIA 2020 · 5.16 ✓");
Q("P","Entre les deux guerres mondiales, le régime nazi fait voler sur tous les continents un aéronef à des fins de propagande. Il s'agit d'un :",["chasseur Messerschmitt bf-109.","dirigeable type Zeppelin.","ballon de 25000 m3 gonflé à l'hélium.","avion sans pilote appelé V1."],1,"Pense à un aéronef de très grande taille, très visible.","Le dirigeable de type Zeppelin (Graf Zeppelin, Hindenburg) a été utilisé par le régime nazi comme outil de propagande lors de vols à travers le monde.","","BIA 2020 · 5.17 ✓");
Q("P","Lors de la Seconde Guerre mondiale, un chasseur à réaction est pour la première fois engagé en combat aérien. Il s'agit du :",["Junker Ju 88","Focke-Wulf FW-190.","Messerschmitt Me-262.","Dornier Do 335."],2,"Un seul de ces avions est à réaction.","Le Messerschmitt Me 262 est le premier chasseur à réaction engagé au combat, en 1944. Les autres avions cités sont à hélice.","","BIA 2020 · 5.18 ✓");
Q("Q","À l'issue de la Seconde Guerre mondiale, les Américains ont employé des ingénieurs allemands ayant conçu le missile balistique V2 afin de mener à bien leur programme spatial. C'est le cas de :",["Wernher von Braun.","Willy Messerschmitt.","Helmut Gröttrup.","Robert Lusser."],0,"Il a ensuite dirigé le développement de la fusée Saturn V.","Wernher von Braun, concepteur du V2, a rejoint les États-Unis après la guerre. Il a ensuite dirigé le développement des fusées Saturn pour le programme Apollo.","","BIA 2020 · 5.19 ✓");
Q("Q","Le premier homme qui effectua une orbite complète dans l'espace en 1961 fut :",["l'américain Neil Armstrong (programme Apollo).","l'américain Alan Shepard (programme Mercury).","le Soviétique Youri Gagarine (programme Vostok).","l'américain John Glenn (programme Mercury)."],2,"Le premier homme dans l'espace a volé le 12 avril 1961.","Le 12 avril 1961, Youri Gagarine accomplit une orbite autour de la Terre à bord de Vostok 1. Shepard n'a fait qu'un vol suborbital, et Glenn n'a orbité qu'en 1962.","","BIA 2020 · 5.20 ✓");

Q("S","Le terme « constant speed propeller » signifie :",["une autorisation donnée par le contrôle aérien d'effectuer une montée à vitesse constante.","un turboréacteur à vitesse de rotation fixe.","une hélice à vitesse constante.","un dispositif permettant de conserver une même vitesse de vol en palier horizontal, en montée ou en descente."],2,"Propeller est le mot pour hélice.","Une hélice à vitesse constante est une hélice dont le pas varie pour maintenir un régime de rotation constant.","","BIA 2020 · Anglais 12 ✓");

Q("I","Dans un message aéronautique, le groupe de température indique +12°C sous abri, et +4°C de point de rosée. On peut dire que :",["la masse d'air est à 100% d'humidité","la température maximale sera de +12°C et la minimale de +4°C","la masse d'air serait saturée pour une température sous-abri de +4°C","la masse d'air serait saturée pour une température sous-abri de +8°C"],2,"Le point de rosée est la température à laquelle l'air devient saturé.","Le point de rosée est la température à laquelle la masse d'air, en se refroidissant, devient saturée (100 % d'humidité). Ici la saturation serait atteinte à +4 °C.","rosee","BIA 2021 · 1.6 ✓");
Q("F","Une information sur une carte stipule l'ISO 0°C au FL80. Vous devez voler au FL60. En considérant le gradient standard, quelle est la bonne affirmation :",["le vol se fera en conditions à +4°C","le vol se fera en conditions à -4°C","le vol se fera en conditions à -2°C","le vol se fera en conditions à +2°C"],0,"Compte l'écart d'altitude entre le FL80 et le FL60, puis applique le gradient.","La température diminue d'environ 2 °C par 1000 ft en atmosphère standard. Le FL60 est 2000 ft sous l'isotherme 0 °C : il y fait donc environ +4 °C.","isoft","BIA 2021 · 1.7 ✓");
Q("F","Concernant la pression atmosphérique :",["elle est à l'origine du vent dans l'Atmosphère Standard Internationale","elle varie plus rapidement en altitude que proche de la surface","la valeur est de 1013 hPa partout sur la planète","elle diminue rapidement avec l'altitude dans les basses couches de l'atmosphère"],3,"Pense à la variation de pression avec l'altitude : environ 1 hPa tous les 8 m près du sol.","La pression diminue avec l'altitude, et plus vite dans les basses couches (environ 1 hPa pour 8 m près du sol) car l'air y est plus dense.","pressalt","BIA 2021 · 1.8 ✓");
Q("K","Un altimètre :",["affiche la vitesse d'un aéronef","affiche la vitesse ascensionnelle d'un aéronef","est un baromètre qui transforme la pression en altitude","indique la hauteur par rapport à Paris"],2,"Quelle grandeur physique l'altimètre mesure-t-il réellement ?","L'altimètre est un baromètre gradué en altitude : il mesure la pression statique et la convertit en altitude selon la loi de l'atmosphère standard.","altimetrecapsule","BIA 2021 · 1.9 ✓");
Q("G","Pour un anticyclone dans l'hémisphère Sud, les vents s'organisent autour de lui de telle sorte :",["qu'ils tournent en sens inverse des aiguilles d'une montre","qu'ils soufflent de façon concentrique vers le centre de l'anticyclone","qu'ils tournent dans le sens des aiguilles d'une montre","qu'ils se dirigent vers le pôle Sud"],0,"La force de Coriolis change de sens d'un hémisphère à l'autre.","Dans l'hémisphère Nord, le vent tourne dans le sens horaire autour d'un anticyclone. Dans l'hémisphère Sud, la déviation de Coriolis est inversée : il tourne en sens inverse des aiguilles d'une montre.","","BIA 2021 · 1.10 ✓");
Q("G","Une traîne :",["est la partie sous le vent d'un cumulonimbus","correspond à une précipitation qui n'atteint pas le sol","est le nom donné aux perturbations qui avancent lentement","est une zone de bonne visibilité entrecoupée d'averses à l'arrière d'un front froid"],3,"Où se situe-t-elle par rapport au passage du front froid ?","La traîne est la zone d'air froid et instable située derrière un front froid : ciel alternant éclaircies et averses, avec une bonne visibilité.","depcoupe","BIA 2021 · 1.11 ✓");
Q("H","Lorsque des cumulus sont annoncés, cela indique au pilote que :",["des orages sont systématiquement à prévoir","des précipitations continues sont probables","la masse d'air est instable","la surface frontale est proche"],2,"Les cumulus sont des nuages à développement vertical.","Les cumulus se forment par convection dans une masse d'air instable. Ils ne sont pas systématiquement orageux et ne donnent pas de précipitations continues.","thermique","BIA 2021 · 1.13 ✓");
Q("H","Des nuages lenticulaires dans le ciel sont le signe :",["d'une forte instabilité","de brouillard la nuit suivante","d'une masse d'air assez sèche","d'un vent fort perpendiculaire à un relief"],3,"Ces nuages se forment dans les ondes qui naissent derrière un obstacle.","Les nuages lenticulaires (altocumulus lenticularis) marquent des ondes de relief : ils apparaissent quand un vent fort souffle perpendiculairement à une chaîne de montagnes.","onde","BIA 2021 · 1.14 ✓");
Q("H","Parmi ces listes de nuages, quelle est celle qui ne contient que des nuages instables :",["cumulus, cirrostratus, stratocumulus","altostratus, cirrostratus, cumulonimbus","stratus, altocumulus, cirrus","altocumulus, cumulonimbus, cirrocumulus"],3,"Les nuages instables sont de type cumuliforme ; élimine les listes qui contiennent un nuage en nappe.","Les stratus, cirrostratus et altostratus sont des nuages stables en nappe. Seule la dernière liste ne contient que des nuages cumuliformes, associés à l'instabilité.","","BIA 2021 · 1.15 ✓");
Q("H","La formation la plus commune du brouillard est due :",["au réchauffement nocturne de la masse d'air et sa condensation","au rayonnement nocturne du sol et à la condensation de la vapeur d'eau","à la marée barométrique qui détend l'atmosphère","à la convection de fin de nuit qui déclenche une condensation adiabatique"],1,"Que se passe-t-il pour le sol et l'air proche du sol par nuit claire ?","Le brouillard de rayonnement est le plus fréquent : par nuit claire, le sol se refroidit, refroidit l'air à son contact, et la vapeur d'eau se condense.","","BIA 2021 · 1.16 ✓");
Q("G","Lorsque le vent est fort au sol :",["il y a peu de turbulences dans les basses couches de l'atmosphère","le ciel va systématiquement se dégager","il est nul en altitude","des turbulences dues aux imperfections du sol et aux obstacles se développent en basses couches"],3,"Que fait le sol rugueux à l'écoulement de l'air ?","Un vent fort rencontrant les irrégularités du sol et les obstacles génère de la turbulence mécanique dans les basses couches.","turbumeca","BIA 2021 · 1.17 ✓");
Q("G","Des mouvements aléatoires de petite échelle qui perturbent un flux d'air bien établi sont appelés :",["des cyclones","du cisaillement et de la turbulence","des ascendances","des mouvements laminaires"],1,"Le contraire d'un écoulement laminaire et ordonné.","La turbulence est constituée de mouvements désordonnés de petite échelle qui perturbent l'écoulement. Un écoulement laminaire est au contraire ordonné.","","BIA 2021 · 1.18 ✓");
Q("H","Dans l'atmosphère, parmi les propositions ci-dessous, quelle est la plus faible température à laquelle on peut encore trouver de l'eau à l'état liquide :",["-10°C","0°C","10°C","100°C"],0,"Pense à la surfusion.","Dans les nuages, l'eau peut rester liquide en dessous de 0 °C (surfusion), jusqu'à environ -40 °C. Parmi les propositions, -10 °C est la plus basse.","","BIA 2021 · 1.19 ✓");
Q("H","La cellule d'un avion peut givrer :",["en vol mais pas au sol","dans les nuages uniquement","dans les nuages, et hors nuages","dans un nuage composé exclusivement de cristaux de glace"],2,"Pense à la pluie en surfusion et aux conditions au sol par temps froid.","Le givrage de cellule peut survenir dans les nuages (gouttelettes en surfusion) mais aussi hors nuage (pluie en surfusion, givre au sol). Les cristaux de glace seuls ne givrent pas la cellule.","","BIA 2021 · 1.20 ✓");
Q("A","L'incidence est :",["l'angle entre l'horizontale et l'axe de l'avion.","la distance maximale entre le bord d'attaque et le bord de fuite.","la distance entre deux nervures d'aile.","l'angle entre le vent relatif et la corde de l'aile."],3,"Ne la confonds pas avec l'assiette : l'incidence fait intervenir le vent relatif.","L'incidence est l'angle entre la corde du profil et la direction du vent relatif. L'angle entre l'horizontale et l'axe de l'avion est l'assiette.","incidence","BIA 2021 · 2.1 ✓");
Q("B","Pour calculer la distance de décollage d'un avion, il faut prendre en compte :",["la masse de l'avion uniquement.","la température, l'altitude de l'aéroport, la masse de l'avion.","l'altitude de l'aéroport uniquement.","aucun de ces éléments."],1,"Plusieurs facteurs influencent la densité de l'air et l'accélération.","La distance de décollage augmente avec la masse, l'altitude et la température (air moins dense, donc moins de portance et de poussée). Il faut tenir compte de tous ces éléments.","","BIA 2021 · 2.2 ✓");
Q("A","Le braquage des volets hypersustentateurs de bord de fuite :",["augmente les coefficients Cz de portance et Cx de traînée.","augmente le coefficient Cz de portance et diminue le coefficient Cx de traînée.","diminue le coefficient Cz de portance et augmente le coefficient Cx de traînée.","diminue les coefficients Cz de portance et Cx de traînée."],0,"Les volets servent à voler lentement, mais ont un prix.","Les volets de bord de fuite augmentent la cambrure du profil : le Cz augmente, ce qui permet de voler plus lentement, mais le Cx augmente aussi.","volets","BIA 2021 · 2.4 ✓");
Q("A","La traînée induite d'une aile:",["diminue quand la portance augmente.","est une conséquence des différences de pression entre l'intrados et l'extrados.","augmente avec l'allongement.","est la conséquence de moucherons collés sur le bord d'attaque."],1,"Elle est liée aux tourbillons marginaux en bout d'aile.","La traînée induite est due à la différence de pression entre intrados et extrados, qui crée des tourbillons marginaux. Elle augmente avec la portance et diminue quand l'allongement augmente.","allonge","BIA 2021 · 2.5 ✓");
Q("C","La variation de l'assiette s'effectue autour de l'axe de :",["roulis.","tangage.","lacet.","piste."],1,"L'assiette est l'angle du nez de l'avion par rapport à l'horizon.","Modifier l'assiette (cabrer ou piquer) revient à tourner autour de l'axe de tangage, qui est l'axe transversal de l'avion.","axes","BIA 2021 · 2.6 ✓");
Q("B","Parmi les éléments suivants, celui qui a une influence sur la position du centre de gravité est :",["la trajectoire (palier, montée, descente).","la vitesse.","le niveau de carburant dans les réservoirs.","l'inclinaison."],2,"Le centre de gravité dépend de la répartition des masses à bord.","La position du centre de gravité dépend de la répartition des masses : la consommation du carburant, le chargement et les passagers la modifient. La trajectoire, la vitesse et l'inclinaison ne la changent pas.","centragecg","BIA 2021 · 2.7 ✓");
Q("C","Pour tourner selon l'axe de tangage, je dois :",["actionner le manche vers l'avant ou vers l'arrière.","actionner le manche vers la gauche ou vers la droite.","utiliser les palonniers.","changer le pas d'hélice."],0,"Quelle gouverne commande le tangage ?","Le mouvement avant-arrière du manche actionne la gouverne de profondeur, qui commande le tangage. Le manche latéral commande le roulis et le palonnier le lacet.","profondeur","BIA 2021 · 2.8 ✓");
Q("A","Le décrochage pour un profil d'aile précis arrive :",["toujours à la même vitesse.","toujours à la même incidence.","toujours à la même pente.","toujours à la même assiette."],1,"Quelle grandeur est liée au détachement des filets d'air sur l'extrados ?","Le décrochage est dû au décollement de l'écoulement et se produit à une incidence critique propre au profil, quelle que soit la vitesse.","courbe","BIA 2021 · 2.9 ✓");
Q("B","Un avion en virage subit 2 g. Quel est son angle d'inclinaison ?",["40°.","50°.","60°.","80°."],2,"En virage stabilisé en palier, le facteur de charge vaut 1/cos(inclinaison).","En virage stabilisé en palier, n = 1/cos φ. Pour n = 2, cos φ = 0,5 donc φ = 60°.","virage","BIA 2021 · 2.10 ✓");
Q("C","Pour réaliser une mise en virage, on incline l'appareil en roulis. Il apparaît alors une rotation en lacet dans le sens opposé au sens du virage désiré. Ceci est dû:",["au lacet induit.","au lacet inverse.","au roulis inverse.","au roulis induit."],1,"Le phénomène produit un lacet qui s'oppose au virage.","Le lacet inverse est la rotation en lacet opposée au virage, causée par la différence de traînée entre les deux ailerons : l'aile qui monte a plus de traînée.","lacetinverse","BIA 2021 · 2.11 ✓");
Q("B","En descente rectiligne uniforme sans traction :",["la portance et le poids sont directement opposés.","la traînée et le poids sont directement opposés.","la composante du poids parallèle à la trajectoire s'oppose à la traînée pour l'équilibrer.","la composante du poids perpendiculaire à la trajectoire s'oppose à la traînée pour l'équilibrer."],2,"Décompose le poids selon la trajectoire et perpendiculairement à elle.","En vol plané rectiligne uniforme, la composante du poids le long de la trajectoire équilibre la traînée, et la portance équilibre la composante perpendiculaire.","plane","BIA 2021 · 2.13 ✓");
Q("A","Pour réduire la trainée induite, on peut :",["diminuer l'allongement.","ajouter des becs de bord d'attaque.","ajouter des aérofreins.","ajouter des winglets."],3,"Il faut limiter les tourbillons marginaux en bout d'aile.","Les winglets limitent les tourbillons marginaux et réduisent la traînée induite. Diminuer l'allongement l'augmenterait.","winglet","BIA 2021 · 2.14 ✓");
Q("B","Un parachutiste en chute libre",["ira de plus en plus vite quelle que soit sa position pendant toute la durée de la chute libre.","atteindra une vitesse limite très tôt s'il est en position verticale.","atteindra une vitesse limite très tôt s'il est en position horizontale (à plat ventre).","verra sa vitesse augmenter puis diminuer quelle que soit sa position."],2,"La vitesse limite est atteinte quand la traînée équilibre le poids.","La traînée croît avec la vitesse et la surface exposée. À plat ventre, elle est plus grande : elle équilibre le poids plus tôt, à une vitesse limite plus faible.","","BIA 2021 · 2.15 ✓");
Q("D","Une montgolfière se maintient à altitude constante. On peut alors affirmer que :",["son poids est supérieur à sa poussée d'Archimède.","son poids est égal à sa poussée d'Archimède.","son poids est inférieur à sa poussée d'Archimède.","la force de trainée est égale au poids."],1,"À altitude constante, les forces verticales s'équilibrent.","Un ballon qui se maintient à altitude constante est en équilibre vertical : son poids est égal à la poussée d'Archimède.","archi","BIA 2021 · 2.16 ✓");
Q("A","Le profil d'une aile est lisse lorsque :",["le bec et les volets sont rentrés.","le bec est rentré et les volets sont sortis.","le bec est sorti et les volets sont rentrés.","le bec et les volets sont sortis."],0,"Un profil lisse n'a aucun dispositif hypersustentateur déployé.","Le profil est lisse quand les dispositifs hypersustentateurs (becs et volets) sont rentrés : la configuration de croisière.","hypersustentateurs","BIA 2021 · 2.17 ✓");
Q("A","On multiplie par 3 la vitesse de l'écoulement et on divise par 9 la surface d'une aile. La portance est :",["multipliée par 9.","multipliée par 3.","inchangée.","multipliée par 81."],2,"La portance est proportionnelle à S × V².","La portance est proportionnelle à la surface et au carré de la vitesse. Ici : 3² = 9 et la surface est divisée par 9, donc la portance est inchangée.","vitesse2","BIA 2021 · 2.18 ✓");
Q("B","En air calme, quelle est la distance horizontale qu'il est possible de parcourir avec une finesse de 30 si la hauteur est de 3 km :",["90 m.","90 000 m.","900 m.","90 000 km."],1,"La finesse est le rapport entre la distance parcourue et la hauteur perdue.","La distance est égale à la finesse multipliée par la hauteur : 30 × 3 km = 90 km, soit 90 000 m.","finesse","BIA 2021 · 2.19 ✓");
Q("A","Certains avions sont équipés d'aérofreins qui ont pour but de modifier les coefficients Cx (trainée) et Cz (portance). Préciser leurs effets :",["augmenter le Cx et le Cz.","diminuer le Cx et le Cz.","augmenter le Cx et diminuer le Cz.","diminuer le Cx et augmenter le Cz."],2,"Un aérofrein sert à freiner l'avion et à augmenter sa vitesse de chute.","Les aérofreins augmentent fortement la traînée (Cx) et perturbent l'écoulement sur l'extrados, ce qui diminue la portance (Cz).","aerofreins","BIA 2021 · 2.20 ✓");
Q("K","Parmi les instruments de bord suivants, lequel fonctionne en utilisant la variation de pression statique ?",["l'altimètre.","l'horizon artificiel.","le conservateur de cap.","le compas."],0,"Les autres instruments sont gyroscopiques ou magnétiques.","L'altimètre mesure la pression statique. L'horizon artificiel et le conservateur de cap sont gyroscopiques, et le compas est magnétique.","altimetrecapsule","BIA 2021 · 3.12 ✓");
Q("K","Le Badin mesure :",["l'altitude.","le cap.","la vitesse.","la pression atmosphérique."],2,"Le Badin est l'ancien nom de l'anémomètre.","Le Badin est l'indicateur de vitesse air (anémomètre) : il mesure la différence entre la pression totale et la pression statique.","pitot","BIA 2021 · 3.13 ✓");
Q("C","Lorsque le pilote incline le manche de gauche à droite, l'avion pivote autour de son axe de :",["roulis.","tangage.","lacet.","portance."],0,"Le mouvement latéral du manche agit sur les ailerons.","Le mouvement latéral du manche commande les ailerons et fait tourner l'avion autour de l'axe longitudinal, c'est-à-dire en roulis.","axes","BIA 2021 · 3.14 ✓");
Q("C","Lorsque le pilote incline le manche à droite :",["les ailerons se lèvent.","les ailerons de baissent.","l'aileron droit se lève et l'aileron gauche se baisse.","l'aileron gauche se lève et l'aileron droit se baisse."],2,"Pour rouler à droite, l'aile droite doit perdre de la portance.","Manche à droite : l'aileron droit se lève (moins de portance à droite) et l'aileron gauche se baisse (plus de portance à gauche), ce qui fait rouler l'avion à droite.","ailerons","BIA 2021 · 3.15 ✓");
Q("J","Les réservoirs de carburant situés en bout d'aile provoquent sur la structure de l'aile d'un avion au sol des contraintes :",["de torsion.","de flexion.","nulles.","de contraction."],1,"Au sol, le poids du carburant tire le bout d'aile vers le bas.","Au sol, l'aile ne porte pas l'avion mais subit le poids du carburant en bout d'aile : elle est fléchie vers le bas, ce qui crée des contraintes de flexion.","flexionaile","BIA 2021 · 3.16 ✓");
Q("N","Lorsqu'un numéro de piste est entouré sur une carte VAC, il s'agit :",["de la piste à utiliser en cas de vent nul ou faible.","du point bas d'une piste en pente.","du point haut d'une piste en pente.","de prévenir d'un obstacle en entrée de piste."],0,"Il s'agit d'une indication de préférence d'utilisation.","Sur une carte VAC, le QFU entouré désigne la piste préférentielle, à utiliser par vent nul ou faible.","","BIA 2021 · 4.1 ✓");
Q("N","Un tour de piste à main gauche signifie :",["que l'avion doit se poser sur la partie gauche de la piste.","que le pilote doit piloter avec la main gauche pour des raisons de sécurité.","que le pilote effectue le dernier virage avec la piste à sa gauche.","que la manche à air est à gauche de la piste."],2,"Les virages du circuit se font tous du même côté.","Dans un circuit à main gauche, tous les virages sont à gauche : la piste reste donc à gauche du pilote lors du virage final.","circuit","BIA 2021 · 4.2 ✓");
Q("K","Pour afficher leur altitude par rapport au niveau moyen de la mer, les pilotes doivent afficher sur leur altimètre un calage :",["QNH.","QFE.","AMSL.","1013."],0,"Un calage donne l'altitude par rapport au niveau de la mer, un autre la hauteur par rapport à l'aérodrome.","Le calage QNH est la pression ramenée au niveau de la mer en atmosphère standard : l'altimètre indique alors l'altitude par rapport au niveau moyen de la mer. Le QFE donne la hauteur au-dessus de l'aérodrome.","calages","BIA 2021 · 4.5 ✓");

Q("G","Un front occlus est représenté sur les cartes météorologiques par :",["une ligne avec des demi-cercles accolés à elle.","une ligne avec des triangles accolés à elle.","une ligne avec une alternance de demi-cercles et de triangles.","une ligne avec des dessins de nuages accolés."],2,"Le symbole d'une occlusion réunit ceux des deux fronts qui l'ont formée.","Une occlusion résulte de la réunion d'un front froid (triangles) et d'un front chaud (demi-cercles). Elle est donc tracée avec une alternance de demi-cercles et de triangles.","occlusion","BIA 2022 · 1.1 ✓");

Q("B","L'avion ayant eu une tendance à piquer rapidement, on décide d'ajouter un peu de poids à l'arrière en scotchant une pièce le plus en arrière possible. Cela a pour effet",["d'avancer son centre de gravité, rendant son équilibre autour de l'axe de tangage moins stable.","de reculer son centre de gravité, rendant son équilibre autour de l'axe de tangage moins stable.","d'avancer son centre de gravité, rendant son équilibre autour de l'axe de tangage plus stable.","de reculer son centre de gravité, rendant son équilibre autour de l'axe de tangage plus stable."],1,"Ajouter une masse à l'arrière déplace le centre de gravité vers l'arrière ; que devient alors sa distance au foyer ?","Une masse placée à l'arrière recule le centre de gravité. Il se rapproche du foyer, ce qui réduit la marge statique et donc la stabilité en tangage.","centragecg","BIA 2022 · 2.3 ✓");

Q("A","Pour réduire la traînée induite d'une aile, on peut :",["augmenter l'allongement de l'aile.","diminuer l'allongement de l'aile.","augmenter la corde et diminuer l'envergure.","supprimer les winglets."],0,"Les tourbillons marginaux sont moins pénalisants sur une aile longue et fine.","La traînée induite diminue quand l'allongement (envergure par rapport à la corde) augmente. Les winglets la réduisent aussi.","allonge","BIA 2022 · 2.10 ✓");
Q("A","Le tube Prandtl est réalisé avec 2 sondes, pour déterminer les pressions, dynamiques et statiques :",["le tube extérieur s'ouvre perpendiculairement à l'écoulement du fluide et informe de la pression totale.","le tube intérieur s'ouvre parallèlement à l'écoulement du fluide, et est ouvert en son bout et informe de la pression statique.","le tube extérieur s'ouvre perpendiculairement à l'écoulement du fluide et informe de la pression statique.","le tube intérieur s'ouvre parallèlement à l'écoulement du fluide, et est ouvert en son bout et informe de la pression dynamique."],2,"Les prises latérales ne sont pas face au vent relatif.","Dans un tube de Prandtl, le tube central, face à l'écoulement, mesure la pression totale. Les orifices latéraux, perpendiculaires à l'écoulement, mesurent la pression statique.","pitot","BIA 2022 · 2.12 ✓");
Q("B","Une hélice à pas variable réglée sur petit pas au décollage permet de :",["diminuer la distance de décollage et la pente de montée.","augmenter la distance de décollage et diminuer la pente de montée.","diminuer la distance de décollage et augmenter la pente de montée.","augmenter la distance de décollage et la pente de montée."],2,"Le petit pas est efficace à basse vitesse.","Le petit pas donne la meilleure traction à basse vitesse : la distance de décollage diminue et la pente de montée augmente.","helice","BIA 2022 · 2.13 ✓");
Q("B","Trop de poids sur l'arrière de votre avion :",["augmente la stabilité et la manœuvrabilité.","diminue la stabilité et la manœuvrabilité.","augmente la stabilité et diminue la manœuvrabilité.","diminue la stabilité et augmente la manœuvrabilité."],3,"Un centrage trop arrière rapproche le centre de gravité du foyer.","Un centrage arrière diminue la stabilité de l'avion et le rend plus sensible aux commandes, donc plus manœuvrable. Il devient dangereux s'il dépasse la limite arrière.","centragecg","BIA 2022 · 2.14 ✓");
Q("B","Le fuselage de l'avion est générateur de :",["traînée de forme et traînée de frottements.","traînée de frottements uniquement.","traînée induite uniquement.","traînée de forme uniquement."],0,"Le fuselage subit à la fois l'écoulement le long de sa surface et son obstacle à l'écoulement.","Le fuselage génère de la traînée de frottement (air le long de la surface) et de la traînée de forme (liée à sa géométrie). La traînée induite est liée à la portance de l'aile.","traineeformes","BIA 2022 · 2.15 ✓");
Q("B","En virage symétrique en palier, le facteur de charge :",["augmente si la vitesse augmente.","augmente si l'inclinaison augmente.","diminue si la vitesse augmente.","diminue si l'inclinaison augmente."],1,"En palier, le facteur de charge ne dépend que d'un angle.","En virage symétrique en palier, le facteur de charge vaut 1/cos(inclinaison) : il augmente avec l'inclinaison, quelle que soit la vitesse.","virage","BIA 2022 · 2.16 ✓");
Q("B","Si la vitesse diminue, pour rester en palier, on doit :",["augmenter l'incidence.","diminuer l'incidence.","sortir le train d'atterrissage.","se mettre en virage."],0,"La portance doit rester égale au poids.","La portance dépend de la vitesse et de l'incidence : si la vitesse diminue, il faut augmenter l'incidence pour conserver la même portance.","","BIA 2022 · 2.17 ✓");
Q("B","Pendant un virage en palier à vitesse constante, le pilote doit :",["augmenter l'incidence et la puissance.","diminuer l'incidence et la puissance.","augmenter l'incidence et diminuer la puissance.","diminuer l'incidence et augmenter la puissance."],0,"En virage, la portance doit augmenter, et la traînée aussi.","En virage, la portance totale doit augmenter pour compenser l'inclinaison : on augmente l'incidence. La traînée croît, donc il faut aussi augmenter la puissance pour garder la vitesse.","virage","BIA 2022 · 2.18 ✓");
Q("B","La marge statique est :",["la distance entre le centre de gravité et le foyer de l'avion.","la quantité d'électricité statique qu'un avion peut supporter.","la place que l'avion en stationnement occupe sur le parking.","la bande située sur la gauche des pages du manuel de vol."],0,"Elle mesure l'éloignement de deux points caractéristiques liés à la stabilité longitudinale.","La marge statique est la distance entre le centre de gravité et le foyer. Plus le centre de gravité est en avant du foyer, plus l'avion est stable en tangage.","centragecg","BIA 2022 · 2.19 ✓");
Q("A","La sortie des volets Fowler :",["augmente la surface de l'aile et la vitesse de décrochage.","diminue la surface de l'aile et la vitesse de décrochage.","diminue la surface de l'aile et augmente la vitesse de décrochage.","augmente la surface de l'aile et diminue la vitesse de décrochage."],3,"Ces volets coulissent vers l'arrière en plus de s'abaisser.","Les volets Fowler coulissent vers l'arrière et vers le bas : ils augmentent la surface et la courbure de l'aile, donc la portance, ce qui diminue la vitesse de décrochage.","hypersustentateurs","BIA 2022 · 2.20 ✓");
Q("L","Combien existe-t-il de classe d'ULM ?",["2.","4.","6.","8."],2,"Les types vont du paramoteur à l'aérostat.","Il existe six classes d'ULM : paramoteur, pendulaire, multiaxes, autogire, hélicoptère et aérostat.","","BIA 2022 · 3.1 ✓");
Q("L","Le train d'atterrissage d'un planeur est :",["toujours fixe pour des raisons de sécurité.","rétractable sur certains modèles de planeurs.","toujours rétractable pour améliorer la finesse.","rétractable automatiquement lorsqu'il ne touche plus le sol."],1,"Les affirmations avec « toujours » sont rarement exactes.","Les planeurs de performance ont souvent un train rétractable manuellement pour améliorer la finesse, mais d'autres modèles ont un train fixe.","","BIA 2022 · 3.2 ✓");
Q("L","Parmi les différentes classes d'ULM, le paramoteur est un ULM de la classe :",["1.","2.","3.","4."],0,"C'est la première classe de la liste.","Les ULM sont classés en 6 classes. Le paramoteur est de la classe 1.","","BIA 2022 · 3.3 ✓");
Q("J","L'action du réchauffage du carburateur se traduit par :",["une augmentation de la puissance.","une diminution de la puissance.","une réduction du débit carburant.","une réduction de la pression essence."],1,"L'air chaud est moins dense que l'air froid.","Le réchauffage envoie de l'air chaud, moins dense, vers le carburateur : le mélange est moins riche en oxygène, donc la puissance diminue légèrement. Il sert à fondre le givre.","carbu","BIA 2022 · 3.4 ✓");
Q("C","Le pilote d'un avion braque le manche (ou le volant) à droite :",["la gouverne de direction se braque à droite.","la gouverne de direction se braque à gauche.","l'aileron droit s'abaisse.","l'aileron droit se lève."],3,"Pour rouler à droite, l'aile droite doit perdre de la portance.","Manche à droite : l'aileron droit se lève et l'aileron gauche s'abaisse. L'avion s'incline à droite. La direction est commandée par le palonnier.","ailerons","BIA 2022 · 3.5 ✓");
Q("J","Vous volez avec un avion équipé d'une hélice « petit pas » c'est-à-dire à faible calage. Vous vous attendez à :",["de bonnes performances au décollage sans conséquence sur les performances en croisière.","de bonnes performances en croisière au détriment des performances au décollage.","de bonnes performances au décollage au détriment des performances en croisière.","de mauvaises performances au décollage ainsi qu'en croisière."],2,"Un pas ne peut pas être optimal à toutes les vitesses.","Une hélice à petit pas est efficace à basse vitesse (décollage, montée) mais moins en croisière, où un grand pas est préférable.","petitgrandpas","BIA 2022 · 3.6 ✓");
Q("K","L'instrument qui vous permet de détecter une glissade est :",["le conservateur de cap.","la bille.","l'horizon artificiel.","le variomètre."],1,"C'est l'instrument du vol symétrique.","La bille de l'indicateur de virage montre si le vol est symétrique : en glissade elle est déportée vers l'intérieur du virage.","billeglissade","BIA 2022 · 3.7 ✓");
Q("K","Quel instrument utilise la PT (Pression Totale) ?",["horizon artificiel.","variomètre.","altimètre.","anémomètre."],3,"Un seul instrument compare pression totale et pression statique.","L'anémomètre mesure la différence entre la pression totale (prise Pitot) et la pression statique. L'altimètre et le variomètre n'utilisent que la pression statique.","pitot","BIA 2022 · 3.8 ✓");
Q("E","Quel nouveau prochain rôle peut-on espérer des satellites ?",["télécommunication.","GPS.","nettoyage de l'espace.","météorologie."],2,"Il s'agit d'un rôle qui n'existe pas encore couramment.","Les télécommunications, la navigation et la météorologie sont déjà des usages courants. Le nettoyage de l'espace (retrait des débris) est un rôle en développement.","","BIA 2022 · 3.10 ✓");
Q("A","Comment se nomme la partie de l'aile qui assure la jonction avec le fuselage et son profilage aérodynamique ?",["l'emplanture et le Karman.","l'envergure et le Karman.","l'emplanture et le saumon.","l'envergure et le saumon."],0,"L'emplanture est le côté fuselage de l'aile, le saumon est le côté opposé.","L'emplanture est la partie de l'aile fixée au fuselage et le karman est le carénage qui assure le raccord aérodynamique. Le saumon est l'extrémité de l'aile.","partiesaile","BIA 2022 · 3.11 ✓");
Q("J","Sur un turbopropulseur :",["le moteur à piston est suralimenté par un turbocompresseur.","il n'y a aucune partie mobile contrairement au turboréacteur.","la quasi-totalité de l'énergie de la turbine est utilisée pour entrainer l'hélice.","le moteur à piston entraîne une hélice placée à l'arrière de l'avion."],2,"Un turbopropulseur est une turbine à gaz qui entraîne une hélice.","Dans un turbopropulseur, la turbine à gaz récupère presque toute l'énergie des gaz pour entraîner l'hélice par l'intermédiaire d'un réducteur. La poussée des gaz d'échappement est faible.","turbopropu","BIA 2022 · 3.13 ✓");
Q("J","En vol en palier, l'aile est soumise à de la flexion qui engendre sur le longeron :",["de la compression sur l'extrados et sur l'intrados.","de la compression sur l'extrados et de la traction sur l'intrados.","de la traction sur l'extrados et sur l'intrados.","de la traction sur l'extrados et de la compression sur l'intrados."],1,"En vol, l'aile se courbe vers le haut.","En vol, la portance fléchit l'aile vers le haut : l'extrados est comprimé et l'intrados est tendu.","flexionaile","BIA 2022 · 3.14 ✓");
Q("L","Jean Delemontez disait \"Ce qui n'existe pas, ne pèse rien, ne coûte rien, et ne tombe jamais en panne ! » Mais pour un ULM biplace de classe 3, quelle est la nouvelle limite autorisée sans équipement additionnel ?",["masse maxi 330 kg.","il n'y a pas de limite.","masse maxi 500kg.","tout dépend des matériaux utilisés."],2,"La réponse est une masse maximale, plus élevée que celle d'un monoplace.","La réglementation ULM fixe des masses maximales au décollage selon la classe et le nombre de places. Pour un biplace de classe 3, la valeur retenue ici est de 500 kg.","","BIA 2022 · 3.18 ✓");
Q("J","La plupart des moteurs d'avion sont équipés d'un système de double allumage qui a pour but :",["d'améliorer la combustion et d'augmenter la sécurité en vol.","de réguler la consommation électrique.","de réduire la consommation de carburant.","de diminuer l'usure des bougies."],0,"Deux circuits indépendants servent à la fois la combustion et la fiabilité.","Le double allumage (deux magnétos, deux bougies par cylindre) améliore la combustion et assure la redondance en cas de panne d'un circuit.","","BIA 2022 · 3.19 ✓");
Q("J","Sur un moteur à pistons, la bielle est un élément qui :",["permet la fixation du moteur à l'avion.","assure l'entraînement de l'arbre à cames par l'intermédiaire du vilebrequin.","commande l'ouverture et la fermeture des soupapes.","relie le piston au vilebrequin."],3,"Elle transforme un mouvement linéaire en mouvement de rotation.","La bielle relie le piston au vilebrequin et transforme le mouvement alternatif du piston en mouvement de rotation.","moteurpiston","BIA 2022 · 3.20 ✓");
Q("M","Dans l'encart indiquant les fréquences radio sur une carte VAC, A/A signifie :",["qu'il faudra dire « alpha, alpha » au début de chaque message radio.","que les militaires ont installé des missiles air/air sur l'aérodrome.","annonce automatique. C'est la fréquence donnant des informations sur l'aérodrome.","que les messages sont en auto-information air/air."],3,"Il s'agit d'une fréquence qui diffuse des informations, sans dialogue.","Sur une carte VAC, la mention A/A indique une fréquence d'annonce automatique donnant des informations sur l'aérodrome.","","BIA 2022 · 4.1 ✓");
Q("N","Les numéros pour désigner les pistes sont :",["choisis par le maire de la ville où est implanté l'aérodrome.","choisis par l'aviation civile en fonction des aérodromes alentours.","les dizaines arrondies de l'orientation géographique de la piste.","la longueur de la piste pour le chiffre le plus au nord, la largeur de la piste pour celui au sud."],2,"Le numéro est lié à l'orientation de la piste.","Le numéro de piste correspond à son orientation en dizaines de degrés, arrondie. Une piste orientée à 230° est ainsi la piste 23.","numeropiste","BIA 2022 · 4.2 ✓");
Q("M","L'indication sur le VOR dépend :",["de la position de l'avion, mais pas de son cap.","de la position et du cap de l'avion.","du cap et mais pas de la position de l'avion.","ni du cap, ni de la position de l'avion."],0,"Le VOR donne un radial, c'est-à-dire une direction depuis la station.","Le VOR indique le radial sur lequel se trouve l'avion par rapport à la station. Cette indication dépend de sa position, pas de son cap.","vor","BIA 2022 · 4.3 ✓");
Q("N","La formation FOX ALPHATANGO proposée par la DGAC est une formation à distance à effectuer pour le télépilotage de drones à partir de :",["0 g.","1500 g.","200 g.","800 g."],3,"Cette formation concerne les drones de loisir au-delà d'un certain seuil de masse.","La formation FOX AlphaTango de la DGAC est exigée pour les télépilotes de drones de loisir de 800 g et plus.","","BIA 2022 · 4.4 ✓");
Q("N","En France métropolitaine, en un lieu déterminé, la nuit aéronautique commence :",["30 minutes après le coucher du soleil et se termine 30 minutes après le lever du soleil.","30 minutes après le coucher du soleil et se termine 30 minutes avant le lever du soleil.","30 minutes avant le coucher du soleil et se termine 30 minutes après le lever du soleil.","30 minutes avant le coucher du soleil et se termine 30 minutes avant le lever du soleil."],1,"La nuit aéronautique est plus courte que la nuit astronomique ; elle commence après le coucher.","En France, la nuit aéronautique commence 30 minutes après le coucher du soleil et se termine 30 minutes avant son lever.","","BIA 2022 · 4.5 ✓");
Q("N","Pour voler en France, les avions certifiés doivent obligatoirement posséder :",["la licence de station d'aéronefs (LSA).","l'habilitation de radiotéléphonie en langue française.","la facture d'achat de l'avion.","les certificats de navigabilité (CEN) et d'examen de navigabilité (CEDN)."],3,"Il s'agit de documents attestant l'aptitude de l'appareil à voler.","Un aéronef certifié doit détenir ses documents de navigabilité (certificat de navigabilité et certificat d'examen de navigabilité) en plus de son immatriculation.","","BIA 2022 · 4.6 ✓");
Q("N","En vol de nuit, vous apercevez un avion qui s'éloigne de vous, quel est l'ordre de la couleur des feux de gauche à droite ?",["blanc, vert.","vert, rouge.","rouge, blanc.","rouge, blanc, vert."],3,"Tu vois l'avion par l'arrière : le feu de gauche de l'avion est à ta gauche.","Un avion porte un feu rouge sur l'aile gauche, un feu vert sur l'aile droite et un feu blanc à l'arrière. Vu de l'arrière, l'ordre est rouge, blanc, vert.","feuxnav","BIA 2022 · 4.7 ✓");
Q("N","Le temps universel (UTC) en France :",["présente toujours le même écart avec l'heure légale.","est supérieur de 2h en été et 1h en hiver à l'heure légale.","est inférieur de 1h en été et 2h en hiver à l'heure légale.","est inférieur de 2h en été et 1h en hiver à l'heure légale."],3,"L'heure légale française est en avance sur l'UTC, de plus en été.","L'heure légale française est UTC+1 en hiver et UTC+2 en été : l'UTC est donc inférieur de 1 h à l'heure légale en hiver et de 2 h en été.","","BIA 2022 · 4.8 ✓");
Q("N","Deux aéronefs dont les routes convergent doivent :",["s'éviter par en dessous.","s'éviter en changeant d'altitude.","s'éviter par la droite.","s'éviter par la gauche."],2,"Comme sur la route, chacun se dégage dans le même sens.","Lorsque deux aéronefs ont des routes convergentes, chacun s'écarte vers sa droite. L'aéronef qui a l'autre à sa droite doit céder le passage.","priorites","BIA 2022 · 4.9 ✓");
Q("O","L'hyperventilation provoque :",["une trop forte concentration d'oxygène dans le sang et peut amener à une perte de conscience.","une trop faible concentration d'oxygène dans le sang et peut amener à une perte de conscience.","une trop forte concentration de gaz carbonique dans le sang et peut amener à une perte de conscience.","une trop forte concentration d'oxygène dans le sang et est sans risque de perte de conscience."],0,"Respirer trop vite déséquilibre les gaz du sang ; un seul choix reconnaît le risque de malaise.","L'hyperventilation (respiration trop rapide) déséquilibre les gaz du sang et peut provoquer vertiges, fourmillements puis perte de conscience. Dans le corrigé, elle est associée à un excès d'oxygène dans le sang.","","BIA 2022 · 4.17 ✓");
Q("N","La piste d'un aéroport est identifiée par le numéro 23 R. Quel est le numéro inscrit à l'autre bout de la piste ?",["23 L.","05 R.","05 L.","23 R."],2,"L'autre extrémité a une orientation opposée (180° d'écart) ; la droite devient la gauche.","L'autre seuil est orienté à 180° : 230° - 180° = 050°, soit 05. Une piste droite vue dans un sens devient gauche dans l'autre : 05 L.","numeropiste","BIA 2022 · 4.18 ✓");

Q("H","Les cumulonimbus sont des nuages :",["stables et inoffensifs.","instables et dangereux qui peuvent provoquer des dégâts considérables à un aéronef.","qui sont la conséquence d'un vent fort en altitude.","en forme de cheveux d'anges, très haut dans le ciel."],1,"Pense à l'instabilité et à l'ampleur verticale de ce nuage d'orage.","Le cumulonimbus est un nuage instable à fort développement vertical. Il peut provoquer turbulences, givrage, grêle et cisaillement dangereux pour un aéronef.","cumulonimbus","BIA 2023 · 1.2 ✓");
Q("H","Concernant les précipitations relatives aux nuages, trouvez l'affirmation exacte :",["Les cumulonimbus et les nuages convectifs produisent de la bruine.","Les nimbostratus produisent des averses et de la grêle.","Les stratus, altostratus et cirrostratus produisent de la neige.","Les nimbostratus produisent plutôt une pluie fine ou de la neige et les cumulonimbus des averses et de la grêle."],3,"Distingue précipitations continues (nuages stratiformes) et averses (nuages convectifs).","Les nimbostratus donnent des précipitations continues (pluie fine ou neige), tandis que les cumulonimbus donnent des averses, parfois de grêle.","","BIA 2023 · 1.3 ✓");
Q("F","Le point de rosée est défini comme :",["l'emplacement de l'aéroport où les données météorologiques sont mesurées.","la température qui permet l'évaporation de la rosée.","la température à partir de laquelle la masse d'air considérée arrive à saturation (à pression constante).","l'heure à laquelle la rosée va commencer à se déposer."],2,"C'est une température liée à la saturation de l'air en vapeur d'eau.","Le point de rosée est la température à laquelle l'air, refroidi à pression constante, devient saturé en vapeur d'eau et la condensation commence.","rosee","BIA 2023 · 1.5 ✓");
Q("G","Lors du passage d'une perturbation, depuis le sol, un observateur verra dans l'ordre :",["Air froid antérieur - Front chaud - Secteur chaud - Front froid - Traine","Front chaud - Secteur chaud - Front froid - Traine - Air froid antérieur","Secteur chaud - Front froid - Traine - Air froid antérieur - Front chaud","Traine - Air froid antérieur - Front chaud - Secteur chaud - Front froid"],0,"Le front chaud précède le front froid, avec le secteur chaud entre les deux.","Dans une perturbation, l'observateur voit d'abord l'air froid antérieur, puis le front chaud, le secteur chaud, le front froid et enfin la traîne.","depcoupe","BIA 2023 · 1.6 ✓");

Q("F","Quelle est la composition moyenne de l'atmosphère en volume :",["78 % d'oxygène, 21 % d'oxyde de carbone et 1 % d'autres éléments.","78 % d'oxyde de carbone, 21 % d'oxygène et 1 % d'autres éléments.","78 % d'oxygène, 21 % d'azote et 1 % d'autres éléments.","78 % d'azote, 21 % d'oxygène et 1 % d'autres éléments."],3,"Le gaz le plus abondant n'est pas celui que nous respirons.","L'air sec contient en volume environ 78 % d'azote, 21 % d'oxygène et 1 % d'autres gaz (argon, CO2...).","","BIA 2023 · 1.11 ✓");
