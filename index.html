Q("G","La brise de vallée descendante s'établit :",["en milieu de matinée.","en début de soirée.","lorsqu'un vent dominant souffle perpendiculairement au relief.","lorsqu'une inversion de température est présente dans la masse d'air."],1,"L'air des versants se refroidit lorsque le soleil se couche.","La brise descendante (brise de montagne) s'établit en début de soirée, quand les versants se refroidissent et que l'air froid, plus dense, descend vers la vallée.","brisepente","BIA 2023 · 1.18 ✓");
Q("H","Quel est le nuage qui a « une tête d'enclume » :",["l'altocumulus.","le stratonimbus.","le cumulonimbus.","le cirus."],2,"Son sommet s'étale au contact de la tropopause.","Le cumulonimbus, à fort développement vertical, présente à son sommet une extension en forme d'enclume.","cumulonimbus","BIA 2023 · 1.19 ✓");
Q("H","Pour un aéronef en vol, le seul nuage pouvant être la cause de tous ces dangers (réduction de visibilité, cisaillement de vent, dégâts à la structure, altération du profil aérodynamique, givrage, vents ascendants très forts, grêle) est :",["le nimbostratus.","le stratus.","le cumulonimbus.","le cirrocumulus."],2,"Il s'agit du nuage d'orage.","Le cumulonimbus cumule turbulences, cisaillement, givrage, grêle et forts courants ascendants : c'est le nuage le plus dangereux pour un aéronef.","cumulonimbus","BIA 2023 · 1.20 ✓");
Q("A","Quel est l'inconvénient majeur d'un triplan de type Albatros (l'avion du « Baron Rouge » von Richthofen au cours de la Première Guerre mondiale) ?",["L'aile triple pesait trop lourd pour la motorisation.","Le supplément de portance était négligeable.","Le système de commandes était trop complexe.","La trainée induite était très importante."],3,"Superposer des ailes crée des interférences et une résistance supplémentaire.","Les ailes superposées génèrent une forte traînée, notamment induite, qui limite la vitesse et le rendement du triplan.","","BIA 2023 · 2.1 ✓");
Q("E","En observant du sol le lancement d'une fusée de Cap Kennedy (Floride), on constate que la trajectoire s'incurve vers l'Est. Pourquoi ?",["C'est une illusion d'optique due à la température des gaz des moteurs fusées.","On bénéficie ainsi de la vitesse de rotation de la Terre d'Ouest en Est pour atteindre la vitesse de mise en orbite.","C'est imposé par la réglementation de l'aviation civile américaine pour éviter les couloirs aériens.","On préserve ainsi la couche d'ozone au-dessus des États-Unis."],1,"Pense au sens de rotation de la Terre.","La Terre tourne d'ouest en est. Lancer vers l'est ajoute la vitesse de rotation du sol (environ 400 m/s en Floride) à celle de la fusée, ce qui économise du carburant.","kourou","BIA 2023 · 2.2 ✓");
Q("A","Le décrochage d'un avion se produit toujours à la même :",["incidence.","inclinaison.","vitesse.","assiette."],0,"C'est l'angle entre la corde de l'aile et le vent relatif qui est en cause.","Le décrochage se produit lorsque l'incidence dépasse l'incidence critique, qui est une valeur propre au profil. La vitesse de décrochage, elle, varie avec la masse et le facteur de charge.","courbe","BIA 2023 · 2.3 ✓");
Q("E","Dans le cas d'un satellite géostationnaire, l'orbite est :",["circulaire dans le plan de l'équateur.","elliptique dans un plan perpendiculaire à celui du plan de l'équateur.","elliptique avec la Lune comme l'un des foyers.","circulaire sous un plan à 45° par rapport au plan de l'équateur."],0,"Pour paraître immobile, le satellite doit tourner avec la Terre.","Un satellite géostationnaire est sur une orbite circulaire dans le plan équatorial, à environ 36 000 km d'altitude, avec une période égale à celle de la rotation de la Terre.","orbites","BIA 2023 · 2.4 ✓");
Q("D","Sous son ballon à air chaud, l'aérostier (le pilote) après son décollage, constate au GPS qu'à 200 m, le vent est du Nord pour 10 kt. Il l'annonce par radio à son coéquipier au sol pour venir le récupérer. Puis, ils perdent le contact radio. Après un vol prévu de 90 min, où ce dernier va-t-il le chercher ?",["Au Nord de l'aire de décollage à 15 km.","Au Sud à environ 30 km.","À l'Ouest pour 30 km.","Au Sud-Ouest à 20 km à cause de la rotation de la terre."],1,"Un vent du Nord pousse le ballon dans la direction opposée à son origine ; calcule la distance parcourue en 1 h 30.","Un ballon dérive avec le vent. Un vent du Nord l'emporte vers le Sud. À 10 kt pendant 1,5 h, il parcourt 15 NM, soit environ 28 km.","vents","BIA 2023 · 2.5 ✓");
Q("B","Pour un aéronef en vol en palier stabilisé (vol horizontal à vitesse constante), quelle proposition est correcte ?",["La portance est légèrement inférieure au poids.","La portance équilibre la trainée.","La portance et la traction sont identiques.","La portance équilibre le poids."],3,"En vol stabilisé, les forces opposées se compensent deux à deux.","En palier stabilisé, la portance équilibre le poids et la traction équilibre la traînée.","forces4","BIA 2023 · 2.8 ✓");
Q("A","À propos du vent relatif, quelle est l'affirmation correcte ?",["Sa direction est indépendante de la trajectoire de l'avion.","Il dépend du relief et est plus fort en zone montagneuse.","Il est parallèle et de sens opposé à la trajectoire de l'avion.","Il dépend de l'altitude de vol et de la température extérieure."],2,"C'est l'écoulement de l'air vu depuis l'avion.","Le vent relatif est dû au déplacement de l'avion dans l'air : il est parallèle à la trajectoire et de sens opposé.","ventrel","BIA 2023 · 2.9 ✓");
Q("A","La différence de vitesse d'écoulement de l'air entre l'extrados et l'intrados de l'aile a pour effet :",["d'engendrer une différence de pression entre intrados et extrados qui contribue à créer la portance.","d'augmenter la pression au bord de fuite.","de ralentir l'avion.","est un phénomène parasite que l'on cherche à réduire."],0,"Pense à la relation entre vitesse et pression dans un écoulement.","L'air accéléré sur l'extrados y est à plus basse pression que sur l'intrados. Cette différence de pression contribue à la portance.","pression","BIA 2023 · 2.10 ✓");
Q("B","Que peut-on dire à propos de la position du centre de gravité de l'avion, elle :",["ne dépend que de la forme de l'avion.","a un effet très important sur la stabilité et la manœuvrabilité de l'avion en vol.","se déplace par rapport à l'avion en fonction de l'incidence.","est l'endroit où s'applique la résultante aérodynamique."],1,"Le chargement de l'avion modifie cette position.","La position du centre de gravité, qui dépend du chargement, influence fortement la stabilité et la manœuvrabilité de l'avion.","centragecg","BIA 2023 · 2.11 ✓");
Q("B","En vol, le facteur de charge d'un avion :",["ne dépend que du poids de l'équipage et des bagages embarqués dans l'avion.","augmente la vitesse de décrochage quand le facteur de charge augmente.","est supérieur à 1 quand l'avion est en montée.","est le rapport entre la masse et la surface des ailes de l'avion."],1,"Le facteur de charge est le rapport entre la portance et le poids.","Quand le facteur de charge augmente (virage, ressource), la vitesse de décrochage augmente proportionnellement à sa racine carrée.","","BIA 2023 · 2.12 ✓");
Q("B","Lors d'un virage en palier symétrique, et par rapport au vol horizontal en palier :",["le facteur de charge ne varie pas.","le facteur de charge est proportionnel à la vitesse de l'avion.","le facteur de charge est proportionnel à la masse de l'avion.","le facteur de charge ne dépend que de l'inclinaison de l'avion."],3,"En virage stabilisé en palier, une seule grandeur géométrique intervient.","En virage symétrique en palier, le facteur de charge vaut 1/cos(inclinaison) : il ne dépend que de l'inclinaison.","virage","BIA 2023 · 2.13 ✓");
Q("A","La fonction principale des winglets en bouts d'ailes est :",["d'augmenter la traînée.","de diminuer la vitesse.","de diminuer la portance.","de diminuer la traînée induite."],3,"Ils limitent les tourbillons marginaux.","Les winglets réduisent les tourbillons de bout d'aile, donc la traînée induite, ce qui améliore le rendement aérodynamique.","winglet","BIA 2023 · 2.14 ✓");
Q("C","Lorsque vous déplacez le manche d'un avion vers la droite :",["l'aileron droit se lève et l'aileron gauche s'abaisse.","l'aileron droit s'abaisse et l'aileron gauche se lève.","les deux ailerons se lèvent.","les deux ailerons s'abaissent."],0,"L'avion doit s'incliner vers la droite : quelle aile doit perdre de la portance ?","Manche à droite : l'aileron droit se lève (moins de portance) et l'aileron gauche s'abaisse (plus de portance). L'avion s'incline à droite.","ailerons","BIA 2023 · 2.15 ✓");
Q("C","En avion, pour tourner selon l'axe de tangage, je dois :",["actionner le manche vers l'avant ou vers l'arrière.","actionner le manche vers la gauche ou vers la droite.","utiliser le palonnier.","changer le pas d'hélice."],0,"Le tangage est le mouvement qui lève ou baisse le nez.","Le mouvement de tangage est commandé par la gouverne de profondeur, actionnée en poussant ou en tirant le manche.","profondeur","BIA 2023 · 2.16 ✓");
Q("C","La formule « canard » correspond à :",["un avion à ailes multiples.","un avion à empennage en V.","un avion à empennage avant.","un avion en toile qui vole mal."],2,"Le petit plan horizontal est placé devant l'aile principale.","Dans la formule canard, l'empennage horizontal est situé à l'avant de l'avion, devant l'aile principale.","canard","BIA 2023 · 2.17 ✓");
Q("B","Lors d'un vol en palier stabilisé :",["la portance s'oppose à la trainée.","la traction s'oppose à la pesanteur.","la portance s'oppose à la pesanteur.","la traction d'oppose à la portance."],2,"Chaque force est opposée à une force de même direction.","En palier stabilisé, la portance s'oppose à la pesanteur (poids) et la traction s'oppose à la traînée.","forces4","BIA 2023 · 2.18 ✓");
Q("B","Un centrage avant permet :",["de diminuer la stabilité mais augmenter la manœuvrabilité.","de diminuer la stabilité et la manœuvrabilité.","d'augmenter la stabilité mais de diminuer la manœuvrabilité.","d'augmenter la stabilité et la manœuvrabilité."],2,"Un avion stable est plus difficile à faire changer d'attitude.","Un centrage avant augmente la stabilité de l'avion, mais le rend moins maniable. Un centrage arrière a l'effet inverse.","centragecg","BIA 2023 · 2.19 ✓");
Q("B","Un planeur possède une finesse de 40. Il est à une altitude de 2000m et son terrain de destination se trouve à une altitude de 1000m et à 20km de sa position. En volant dans un air calme sans vent à la vitesse de finesse maximale, choisissez la bonne proposition :",["il atteindra le terrain avec une hauteur de 500m.","il n'atteindra pas le terrain.","il atteindra le terrain à une hauteur nulle.","il atteindra le terrain avec une hauteur de 250m."],0,"Compare la hauteur perdue sur 20 km avec la hauteur disponible au-dessus du terrain.","Avec une finesse de 40, le planeur perd 1 m par 40 m parcourus : 20 000 / 40 = 500 m. Il dispose de 1000 m au-dessus du terrain et arrive donc à 500 m de hauteur.","finesse","BIA 2023 · 2.20 ✓");
Q("L","Tout appareil capable de s'élever et de circuler dans l'espace aérien :",["est un aéronef.","subit des forces aérodynamiques.","possède obligatoirement un moteur.","est piloté depuis l'intérieur de son cockpit."],0,"Pense à la définition générale, qui ne suppose ni moteur ni pilote à bord.","Un aéronef est tout appareil capable de s'élever et de circuler dans l'atmosphère. Il peut être sans moteur (planeur, ballon) ou sans pilote à bord (drone).","","BIA 2023 · 3.1 ✓");
Q("L","Quel type d'aéronef utilise le déplacement de son centre de gravité pour changer de trajectoire ?",["avions et planeurs.","paramoteurs et parapentes.","deltaplanes et pendulaires.","hélicoptères et autogires."],2,"Le pilote déplace son corps ou le chariot par rapport à l'aile.","Les deltaplanes et pendulaires se pilotent en déplaçant le poids du pilote (ou du chariot) par rapport à l'aile, donc le centre de gravité.","pilotagecg","BIA 2023 · 3.2 ✓");
Q("L","Le rotor anticouple des hélicoptères est contrôlé par :",["les palonniers.","le levier du pas collectif.","le levier du pas cyclique.","la manette des gaz."],0,"Il agit sur le mouvement de lacet.","Le rotor anticouple compense le couple du rotor principal. Il est commandé par les palonniers, qui permettent de contrôler le lacet.","helico","BIA 2023 · 3.3 ✓");
