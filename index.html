 "Il faut « lutter » contre le vent en pointant le nez vers lui.",
 "Pour compenser la dérive, on affiche un cap qui « remonte » dans le vent. Vent venant de la droite : cap à droite de la route. Vent venant de la gauche : cap à gauche.","capcourse");
Q("M","Sur une carte au 1/500 000, 1 cm représente…",["500 m","5 km","50 km","500 km"],1,
 "1 cm × 500 000 = 500 000 cm.",
 "1/500 000 signifie 1 cm sur la carte = 500 000 cm sur le terrain = 5 km. La carte OACI au 1/500 000 est la carte de base des pilotes VFR en France.","echelle");
Q("M","Un mille nautique (NM) vaut…",["1 km","1852 m","1609 m","1000 m"],1,
 "Il correspond à une minute d'arc de latitude.",
 "1 NM = 1852 m, soit une minute d'arc de méridien terrestre. Avec la vitesse en nœuds (NM par heure), les calculs de navigation sont simples.","unites");
Q("M","La latitude se mesure à partir de…",["l'équateur, de 0° à 90° nord ou sud","Greenwich, de 0° à 180°","du pôle Nord uniquement","de la mer Méditerranée"],0,
 "Les parallèles sont des cercles parallèles à l'équateur.",
 "La latitude est l'angle nord ou sud par rapport à l'équateur (0° à 90°). La longitude est mesurée est ou ouest à partir du méridien de Greenwich (0° à 180°).","latlon");
Q("M","Le méridien d'origine (0° de longitude) passe par…",["Paris","Greenwich","Rome","New York"],1,
 "C'est un quartier de Londres, célèbre pour son observatoire.",
 "Le méridien de Greenwich, près de Londres, est la référence internationale des longitudes depuis 1884. Paris est à environ 2,3° est.","latlon");
Q("M","À 120 kt, quelle distance parcourt-on en 30 minutes (sans vent) ?",["30 NM","60 NM","120 NM","240 NM"],1,
 "120 kt = 120 NM en une heure.",
 "Distance = vitesse × temps. En 30 minutes (0,5 h), 120 kt × 0,5 h = 60 NM.");
Q("M","Il reste 90 NM à parcourir à 120 kt. La durée du trajet est de…",["30 min","45 min","1 h 30","2 h"],1,
 "Temps = distance ÷ vitesse.",
 "90 NM ÷ 120 kt = 0,75 h, soit 45 minutes. Astuce : à 120 kt, on parcourt 2 NM par minute.");
Q("M","Un VOR est…",["un radiophare VHF qui permet de connaître sa direction (radial) par rapport à la station","un radar météo","un instrument de mesure de la vitesse","un feu d'aérodrome"],0,
 "Il émet des signaux dans toutes les directions autour d'une station au sol.",
 "Le VOR émet un signal que l'avion capte : le pilote sait sur quel radial (direction magnétique depuis la station) il se trouve. Deux VOR permettent de se positionner à leur intersection.","vor");
Q("M","Combien de satellites GPS faut-il au minimum pour obtenir une position en trois dimensions et l'heure ?",["1","2","4","24 exactement"],2,
 "Trois inconnues de position, plus une inconnue d'horloge.",
 "Le récepteur mesure sa distance à chaque satellite grâce au temps de propagation du signal. Il faut 4 satellites pour résoudre latitude, longitude, altitude et l'erreur de l'horloge du récepteur.","gps");
Q("M","La navigation à l'estime consiste à…",["calculer sa position à partir du cap, de la vitesse et du temps écoulé","suivre uniquement le GPS","tirer sa position au hasard","suivre un autre avion"],0,
 "Aucun instrument externe n'est nécessaire.",
 "À l'estime, on part d'un point connu, on applique cap, vitesse et durée pour estimer sa position. On la recale ensuite sur des repères au sol (rivières, routes, villes).","capcourse");
Q("M","En navigation à vue, le pilote suit sa progression en comparant…",["la carte et les repères au sol (rivières, routes, villes)","uniquement les étoiles","le journal du matin","la radio de bord"],0,
 "La carte doit correspondre au paysage.",
 "En vol à vue, on prépare une route sur la carte, puis on vérifie régulièrement la position grâce à des repères caractéristiques : rivières, voies ferrées, autoroutes, lacs, villes.");

/* ---------- N. Réglementation ---------- */
Q("N","L'OACI (Organisation de l'aviation civile internationale) a été créée par…",["la convention de Chicago (1944)","le traité de Rome","la convention de Paris (1919)","la NASA"],0,
 "Elle est liée à l'ONU et publie des normes mondiales.",
 "La convention de Chicago (1944) a créé l'OACI, qui fixe les normes internationales : alphabet phonétique, règles de l'air, signalisation. Chaque État les applique via son autorité nationale.");
Q("N","En France, l'autorité de l'aviation civile est…",["la DGAC","la SNCF","la NASA","Météo-France"],0,
 "Direction générale de l'Aviation civile.",
 "La DGAC, rattachée au ministère des Transports, délivre les licences, surveille la sécurité et gère le contrôle aérien en France. Au niveau européen, l'AESA (EASA) harmonise les règles.");
Q("N","Quel âge minimum faut-il pour obtenir la licence de pilote privé d'avion (PPL) ?",["14 ans","16 ans","17 ans","21 ans"],2,
 "On peut commencer à voler avant, mais la licence arrive plus tard.",
 "En Europe, le PPL d'avion s'obtient à 17 ans minimum. Il est possible de s'entraîner et même de voler seul plus jeune (14 ans en planeur, 15 ans en avion en France), avec des conditions strictes.");
Q("N","Une CTR (zone de contrôle) est…",["un espace aérien contrôlé qui entoure un aérodrome et part du sol","un type d'avion","une carte aéronautique","une zone réservée aux ballons"],0,
 "On y est en contact radio avec la tour de contrôle.",
 "La CTR protège les arrivées et départs d'un aérodrome. Elle part du sol et monte jusqu'à un plafond défini. Au-dessus, la TMA (région de contrôle terminale) prend le relais.","espaces");
Q("N","Dans un espace aérien contrôlé, le pilote doit…",["respecter les clairances et instructions du contrôleur","voler sans radio","ignorer les consignes","voler uniquement la nuit"],0,
 "Une clairance est une autorisation donnée par le contrôle.",
 "Dans l'espace contrôlé, le contrôleur donne des clairances pour séparer les aéronefs. Le pilote les exécute et les répète (collationne) à la radio.","espaces");
Q("N","Une zone P (prohibited) est…",["interdite à tout vol","réservée aux planeurs","sans danger","facultative"],0,
 "Par exemple autour de centrales nucléaires ou de sites sensibles.",
 "Zone P : interdite. Zone R : réglementée (conditions d'accès). Zone D : dangereuse (activités dangereuses : tir, parachutage). Elles figurent sur la carte aéronautique.","espaces");
Q("N","Deux avions se rapprochent en sens opposé, face à face. Que font-ils ?",["chacun vire à sa gauche","chacun dévie vers sa droite","l'un monte, l'autre descend au hasard","ils continuent tout droit"],1,
 "La règle ressemble à celle de la route.",
 "Dans un face-à-face, chaque pilote modifie sa route vers la droite pour éviter l'autre. Mémorisation : « à droite toute » pour éviter la collision.","priorites");
Q("N","Deux avions convergent à la même altitude. Qui doit céder le passage ?",["celui qui voit l'autre à sa droite","celui qui voit l'autre à sa gauche","le plus rapide","le plus petit"],0,
 "Comme en voiture : priorité à droite.",
 "Le pilote qui voit l'autre appareil à sa droite lui cède la priorité et le contourne par la droite. Celui qui voit l'autre à gauche est prioritaire, mais reste vigilant.","priorites");
Q("N","Un avion à moteur croise la route d'un planeur en vol. Qui est prioritaire ?",["l'avion à moteur","le planeur","aucun des deux","le plus bas"],1,
 "Le moins manœuvrant a la priorité.",
 "Priorité décroissante : ballon libre, planeur, dirigeable, aéronef remorquant, puis aéronefs motorisés. Plus un aéronef est difficile à manœuvrer, plus il est prioritaire.","priorites");
Q("N","Un avion rattrape un autre devant lui. Il doit le dépasser…",["par la droite","par la gauche","par-dessous","par-dessus, sans règle"],0,
 "Comme pour la règle du face-à-face, on écarte vers cette même direction.",
 "Dans un dépassement, l'aéronef qui rattrape modifie sa route vers la droite, passe l'autre et se dégage largement. Il reste responsable de l'écart de sécurité.","priorites");
Q("N","Dans un circuit d'aérodrome standard, les virages se font…",["à gauche, sauf indication contraire","à droite toujours","uniquement en montée","au hasard"],0,
 "Le commandant de bord est assis à gauche, cela facilite la vision de la piste.",
 "Le circuit standard comprend : montée initiale, vent traversier, vent arrière, base, finale. Les virages se font à gauche, sauf indication contraire (consignes de l'aérodrome).","circuit");
Q("N","En VFR, hors agglomération et hors phases de décollage ou d'atterrissage, la hauteur minimale de survol est de…",["150 m (500 ft)","30 m","1000 m","aucune"],0,
 "C'est la moitié d'un demi-kilomètre environ.",
 "Hors agglomération, un aéronef doit maintenir au moins 500 ft (150 m) au-dessus du sol ou de l'eau, et à 150 m de toute personne, véhicule ou construction.","hauteurs");
Q("N","Au-dessus d'une agglomération, la hauteur minimale de survol est de…",["la même qu'en rase campagne","300 m (1000 ft) au-dessus du plus haut obstacle dans un rayon de 600 m","50 m","il n'y a aucune règle"],1,
 "En cas de panne, il faut pouvoir atteindre un terrain sans danger pour les habitants.",
 "Au-dessus des villes et rassemblements de personnes, la hauteur minimale est de 1000 ft (300 m) au-dessus du plus haut obstacle dans un rayon de 600 m autour de l'aéronef.","hauteurs");
Q("N","Le certificat de navigabilité d'un aéronef atteste…",["qu'il est conforme aux normes de sécurité et apte au vol","que le pilote a son brevet","que l'avion est assuré","que l'avion est neuf"],0,
 "Il concerne la machine, pas le pilote.",
 "Le certificat de navigabilité (délivré avec son maintien en vigueur par un contrôle périodique) prouve que l'avion respecte les normes et est entretenu. Il fait partie des documents de bord, avec l'immatriculation et l'assurance.");
Q("N","Un avion français porte une immatriculation commençant par…",["F-","G-","D-","N-"],0,
 "G = Royaume-Uni, D = Allemagne, N = États-Unis.",
 "L'immatriculation commence par une lettre nationale : F- pour la France (par ex. F-HAMB), D- Allemagne, G- Royaume-Uni, N- États-Unis.");
Q("N","La fréquence internationale de détresse en VHF aéronautique est…",["118.0 MHz","121.5 MHz","130.0 MHz","1013 MHz"],1,
 "Les services d'urgence et les autres avions l'écoutent.",
 "121,5 MHz est la fréquence de détresse. Une balise de détresse (ELT) émet aussi sur 406 MHz. Lorsqu'on est perdu, on peut appeler sur 121,5.","transpondeur");

/* ---------- O. Sécurité et facteurs humains ---------- */
Q("O","Que fait-on pendant la visite prévol ?",["on inspecte l'avion avant le vol : cellule, commandes, niveaux, Pitot…","on remplit uniquement le plan de vol","on ferme les portes à clé","rien d'obligatoire"],0,
 "Mieux vaut trouver un problème au sol qu'en vol.",
 "La visite prévol est une inspection autour de l'avion : état des surfaces et des commandes, niveaux d'huile et de carburant, Pitot, pneus. Elle fait partie de la préparation du vol.");
Q("O","Pourquoi utilise-t-on des check-lists ?",["pour ne rien oublier d'important, même sous stress","pour remplir du temps","uniquement pour les débutants","pour économiser du carburant"],0,
 "Même les pilotes de ligne les utilisent à chaque vol.",
 "La check-list est une liste de contrôle des actions à faire. Elle compense les oublis et la routine. Les équipages professionnels l'utilisent à chaque vol.");
Q("O","Pourquoi le risque d'hypoxie augmente-t-il avec l'altitude ?",["l'air devient plus chaud","la pression partielle d'oxygène diminue","le vent augmente","l'ozone disparaît totalement"],1,
 "La proportion d'oxygène reste 21 %, mais la quantité d'air diminue.",
 "En altitude, la pression de l'air baisse ; il y a moins de molécules d'oxygène à chaque inspiration. Au-delà de 3000 m environ, l'hypoxie (manque d'oxygène) peut apparaître : confusion, euphorie, perte de conscience.","pressalt");
Q("O","Dans les nuages, sans repère visuel, l'oreille interne peut tromper le pilote. Il doit alors…",["se fier à ses sensations","se fier aux instruments, en particulier à l'horizon artificiel","fermer les yeux","couper le moteur"],1,
 "Le corps ne ressent pas bien les virages lents.",
 "Sans horizon visible, l'équilibre peut donner des illusions (on croit voler droit alors qu'on est en virage). Il faut croire les instruments, pas ses sensations.","panneau6");
Q("O","Peut-on piloter après avoir bu de l'alcool ?",["oui, un verre ne change rien","non : même une petite quantité altère les capacités, c'est à proscrire","oui, mais seulement en VFR","oui, si le passager est sobre"],1,
 "L'alcool réduit la vigilance et le jugement, surtout en altitude.",
 "L'alcool altère les réflexes et le jugement, et ses effets augmentent avec l'altitude. La règle de sécurité : aucune consommation avant de voler, avec un délai généralement de plusieurs heures.");
Q("O","Avant de voler, le pilote se demande s'il est en forme (maladie, médicaments, stress, alcool, fatigue, émotions). Pourquoi ?",["pour être apte physiquement et mentalement","pour remplir un formulaire","pour décider de la météo","pour calculer le carburant"],0,
 "Le pilote est la pièce la plus importante de l'avion.",
 "Les facteurs humains sont en cause dans la majorité des accidents. Se poser honnêtement la question « suis-je apte à voler ? » fait partie de la préparation, comme la météo ou l'avion.");
Q("O","Le principe « voir et éviter » signifie…",["que le pilote surveille l'extérieur pour repérer les autres aéronefs et les éviter","qu'il évite de regarder dehors","que le contrôleur voit tous les avions","que les avions ont un radar d'évitement toujours actif"],0,
 "En VFR, c'est la première des protections contre la collision.",
 "En vol à vue, le pilote est responsable de la séparation avec les autres aéronefs : il balaie le ciel du regard, y compris dans la direction de ses virages, en plus de l'écoute radio.");
Q("O","En cas de panne moteur en vol, la première priorité est de…",["piloter l'avion (garder la vitesse de plané), puis choisir un terrain, puis communiquer","appeler la radio immédiatement avant tout","sauter en parachute","changer de cap vers la maison"],0,
 "« Aviate, navigate, communicate ».",
 "Ordre de priorité : 1 piloter (vitesse de meilleure finesse), 2 choisir un terrain, 3 communiquer. Un avion sans moteur plane : le piloter bien permet souvent de se poser en sécurité.","finesse");
Q("O","Le transpondeur…",["répond aux radars secondaires en renvoyant un code et l'altitude de l'avion","est un moteur de secours","règle l'altimètre","mesure la vitesse du vent"],0,
 "Il permet au contrôleur d'identifier l'avion sur son écran.",
 "Le transpondeur reçoit l'interrogation du radar secondaire et répond avec un code à 4 chiffres (squawk) et souvent l'altitude. Le contrôleur identifie ainsi l'appareil.","transpondeur");
Q("O","Quel code transpondeur signale une détresse ?",["7000","7500","7600","7700"],3,
 "Il y a trois codes d'urgence, 75xx, 76xx, 77xx.",
 "7700 : détresse. 7600 : panne radio. 7500 : détournement (intervention illicite). 7000 est le code conventionnel du vol VFR en Europe.","transpondeur");
Q("O","Quel message radio signale une détresse grave et imminente ?",["PAN PAN","MAYDAY","ROGER","WILCO"],1,
 "Il se prononce trois fois.",
 "MAYDAY (de « m'aider ») x3 : danger grave et imminent. PAN PAN x3 : urgence (sécurité menacée mais pas de danger immédiat). Un MAYDAY impose le silence radio aux autres sur la fréquence.","transpondeur");
Q("O","Pourquoi doit-on attendre un peu avant de décoller derrière un gros avion ?",["pour laisser descendre les passagers","à cause des turbulences de sillage (tourbillons marginaux)","pour économiser le carburant","le règlement de la tour l'impose sans raison"],1,
 "L'aile qui porte laisse deux tourbillons derrière elle.",
 "Un gros avion crée deux puissants tourbillons derrière les bouts d'ailes. Ils descendent et dérivent avec le vent. Il faut attendre environ 2 à 3 minutes ou décaler sa trajectoire.","sillage");
Q("O","L'ELT est…",["une balise de détresse qui émet un signal d'alerte localisable","un instrument de vitesse","une carte électronique","un feu de navigation"],0,
 "Elle se déclenche automatiquement lors d'un choc violent.",
 "L'ELT (Emergency Locator Transmitter) émet un signal sur 121,5 et 406 MHz après un accident pour faciliter la localisation par les satellites de recherche et de sauvetage (COSPAS-SARSAT).","transpondeur");

/* ---------- P. Histoire de l'aviation ---------- */
Q("P","En 1890, quel Français fait décoller l'Éole, un engin à moteur plus lourd que l'air (vol d'environ 50 m) ?",["Louis Blériot","Clément Ader","Henri Farman","Gustave Eiffel"],1,
 "Il invente aussi le mot « avion ».",
 "Clément Ader fait décoller l'Éole à vapeur le 9 octobre 1890, sans pouvoir contrôler son vol. Il dépose le terme « avion » pour désigner ses machines.","frise1");
Q("P","Où et quand les frères Wright réalisent-ils le premier vol motorisé, soutenu et contrôlé ?",["à Paris en 1890","à Kitty Hawk (États-Unis), le 17 décembre 1903","à Londres en 1912","à Berlin en 1909"],1,
 "Ils testaient leur machine sur une plage venteuse de Caroline du Nord.",
 "Le 17 décembre 1903, Orville Wright vole 12 secondes sur 36 m avec le Flyer, qui a des commandes de vol et un moteur. Wilbur réalise le plus long vol du jour : 59 secondes.","frise1");
Q("P","Quel aviateur brésilien établit à Paris en 1906 un vol homologué avec le 14-bis ?",["Louis Blériot","Alberto Santos-Dumont","Roland Garros","Henri Farman"],1,
 "Il est aussi célèbre pour ses ballons et ses dirigeables parisiens.",
 "Alberto Santos-Dumont fait décoller son 14-bis à Bagatelle (Paris) le 23 octobre 1906 sur 60 m, devant témoins et commission de l'Aéro-Club de France : premier vol homologué en Europe.","frise1");
Q("P","Quel exploit Louis Blériot réalise-t-il le 25 juillet 1909 ?",["la traversée de la Manche en avion","la traversée de l'Atlantique","le premier vol en ballon","le premier vol dans l'espace"],0,
 "De Calais à Douvres.",
 "Blériot traverse la Manche à bord du Blériot XI en une trentaine de minutes. Ce vol a un énorme retentissement : l'Angleterre n'est plus une île à l'abri des avions.","frise1");
Q("P","Quel pilote français de la Grande Guerre, premier à traverser la Méditerranée en avion (1913), a donné son nom à un stade de tennis ?",["Roland Garros","Jean Mermoz","Georges Guynemer","Louis Blériot"],0,
 "Le tournoi de tennis porte son nom.",
 "Roland Garros traverse la Méditerranée de Fréjus à Bizerte en 1913. Pendant la guerre, il contribue à l'invention du tir à travers l'hélice. Il meurt au combat en 1918.","frise1");
Q("P","En mai 1927, Charles Lindbergh réalise…",["la première traversée de l'Atlantique Nord en solitaire et sans escale, New York–Paris","le premier tour du monde","le premier vol supersonique","le premier vol à réaction"],0,
 "Il vole 33 heures à bord du Spirit of St. Louis.",
 "Les 20 et 21 mai 1927, Lindbergh relie New York au Bourget en 33 h 30. Il gagne le prix Orteig. Son avion s'appelait Spirit of St. Louis.","frise1");
Q("P","Quel auteur du « Petit Prince » était pilote de l'Aéropostale ?",["Jules Verne","Antoine de Saint-Exupéry","Marcel Pagnol","Victor Hugo"],1,
 "Il a écrit « Vol de nuit » et « Terre des hommes ».",
 "L'Aéropostale (Latécoère) reliait Toulouse à l'Amérique du Sud. Saint-Exupéry, Mermoz et Guillaumet y ont été pilotes. Saint-Exupéry disparaît en vol en 1944.","frise1");
Q("P","Quelle aviatrice américaine est la première femme à traverser l'Atlantique en solitaire (1932) ?",["Amelia Earhart","Hélène Boucher","Jacqueline Auriol","Maryse Bastié"],0,
 "Elle disparaît en 1937 lors d'un tour du monde.",
 "Amelia Earhart traverse l'Atlantique en solo en 1932. Elle disparaît au-dessus du Pacifique en 1937 pendant une tentative de tour du monde.");
Q("P","Qui franchit le mur du son en 1947, aux commandes du Bell X-1 ?",["Chuck Yeager","Neil Armstrong","Youri Gagarine","Charles Lindbergh"],0,
 "C'est un pilote d'essai américain.",
 "Le 14 octobre 1947, Chuck Yeager dépasse Mach 1 avec le Bell X-1, largué d'un bombardier. Le « mur du son » désigne les effets de compressibilité autour de la vitesse du son.","frise1");
Q("P","Que signifie voler à Mach 1 ?",["à la vitesse du son","à la vitesse de la lumière","à 1000 km/h exactement","à la moitié de la vitesse du son"],0,
 "La valeur dépend de la température de l'air.",
 "Mach 1 = vitesse du son dans l'air (environ 340 m/s soit 1225 km/h à 15 °C au niveau de la mer ; moins en altitude car l'air y est plus froid). Mach 2 = deux fois cette vitesse.");
Q("P","Concorde, avion de ligne supersonique franco-britannique, volait à environ…",["Mach 0,8","Mach 2","Mach 5","Mach 10"],1,
 "Il traversait l'Atlantique en environ 3 h 30.",
 "Premier vol le 2 mars 1969 à Toulouse, service commercial de 1976 à 2003. Concorde croisait à Mach 2 vers 18 000 m d'altitude.","frise1");
Q("P","Quel est le premier avion à réaction à avoir volé (1939) ?",["le Concorde","le Heinkel He 178","le Spitfire","le Boeing 707"],1,
 "Il est allemand et antérieur à la Seconde Guerre mondiale en Europe.",
 "Le Heinkel He 178 vole le 27 août 1939. Frank Whittle (Royaume-Uni) et Hans von Ohain (Allemagne) ont inventé indépendamment le turboréacteur.");
Q("P","L'Airbus A380, en service depuis 2007, est…",["le plus gros avion de ligne de série, avec deux ponts complets","un avion supersonique","un hélicoptère lourd","un avion de chasse"],0,
 "Il est assemblé à Toulouse.",
 "L'A380 a volé pour la première fois en 2005 et transporte jusqu'à plus de 800 passagers dans une configuration très dense. Sa production s'est arrêtée en 2021.");

/* ---------- Q. Histoire spatiale ---------- */
Q("Q","Quel est le premier satellite artificiel de la Terre, lancé le 4 octobre 1957 ?",["Apollo 11","Spoutnik 1","Hubble","Vostok 1"],1,
 "Il a été lancé par l'Union soviétique.",
 "Spoutnik 1, une sphère métallique d'environ 58 cm, émet un « bip » radio pendant trois semaines. Son lancement ouvre la conquête spatiale et la « course à l'espace ».","frise2");
Q("Q","Quelle chienne est le premier animal à orbiter autour de la Terre (1957) ?",["Laïka","Belka","Félicette","Ham"],0,
 "Elle voyage à bord de Spoutnik 2.",
 "Laïka, chienne errante recueillie à Moscou, voyage à bord de Spoutnik 2 en novembre 1957. Les premiers vols d'animaux ont préparé les vols humains.","frise2");
Q("Q","Qui est le premier homme dans l'espace, le 12 avril 1961 ?",["Neil Armstrong","Youri Gagarine","Alan Shepard","Buzz Aldrin"],1,
 "Il a fait un tour de la Terre à bord de Vostok 1.",
 "Youri Gagarine (URSS) effectue un tour complet de la Terre en 108 minutes à bord de Vostok 1. Alan Shepard, premier Américain dans l'espace, vole 23 jours plus tard (vol suborbital).","frise2");

Q("S","Que signifie « landing gear » ?",["train d'atterrissage","carburant","tour de contrôle","hélice"],0,

var FIGS={},FIG={};
function F(k,body,cap){FIGS[k]={s:'<svg viewBox="0 0 320 180" role="img" aria-label="'+cap.replace(/"/g,"&quot;")+'">'+body+'</svg>',c:cap};}
function ar(x1,y1,x2,y2,c){c=c||"ln";var m={ln:"ai",ac:"aa",mg:"am",gr:"ao"}[c];return '<line class="'+c+'" x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" marker-end="url(#'+m+')"/>';}
function ln(x1,y1,x2,y2,c,d){return '<line class="'+(c||"ln")+'" x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function pa(d,c,m){return '<path class="'+(c||"ln")+'" d="'+d+'"'+(m?' marker-end="url(#'+m+')"':'')+'/>';}
function tx(x,y,s,c,a){return '<text class="'+(c||"tx")+'" x="'+x+'" y="'+y+'"'+(a?' text-anchor="'+a+'"':'')+'>'+s+'</text>';}
function g(t,inner){return '<g transform="'+t+'">'+inner+'</g>';}
function ci(x,y,r,c){return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" class="'+(c||"fl")+'"/>';}
function rc(x,y,w,h,c){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" class="'+(c||"fl")+'"/>';}
function po(d,c){return '<path class="'+(c||"fl")+'" d="'+d+'"/>';}
function el(x,y,rx,ry,c){return '<ellipse cx="'+x+'" cy="'+y+'" rx="'+rx+'" ry="'+ry+'" class="'+(c||"fl")+'"/>';}
var PROF="M-100,0 C-80,-27 0,-33 100,5 C20,9 -50,11 -100,0Z";
function prof(t,c){return g(t,po(PROF,c));}
function plane(t){return g(t,po("M60,2 C60,-8 45,-12 20,-12 L-40,-8 L-68,-26 L-76,-26 L-72,0 L-40,6 L20,10 C45,10 60,8 60,2Z")+po("M-10,-2 L20,-2 L10,6 L-22,6Z")+po("M-62,-4 L-86,-3 L-86,0 L-62,1Z")+ln(62,-16,62,20,"ln"));}
function tplane(t){return g(t,el(0,0,7,50)+po("M-7,-8 L-62,6 L-62,16 L-7,10Z")+po("M7,-8 L62,6 L62,16 L7,10Z")+po("M-4,38 L-24,46 L-24,52 L-4,48Z")+po("M4,38 L24,46 L24,52 L4,48Z"));}
function dot(x,y,r,c){return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" class="'+(c||"dt")+'"/>';}
function dots(x,y,w,h,n,s){var o="",i,a,b;for(i=0;i<n;i++){a=Math.sin((i+1)*12.9898+s)*43758.5453;a=a-Math.floor(a);b=Math.sin((i+1)*78.233+s*3)*12543.1234;b=b-Math.floor(b);o+=dot((x+7+a*(w-14)).toFixed(1),(y+7+b*(h-14)).toFixed(1),2.3,"dp");}return o;}
function rk(cx,base,from,coif){var W=[28,22,16],H=[40,30,24],o="",y=base,i;for(i=from;i<3;i++){o+=rc(cx-W[i]/2,y-H[i],W[i],H[i]);y-=H[i];}
  if(coif)o+=po("M"+(cx-8)+","+y+" Q"+cx+","+(y-26)+" "+(cx+8)+","+y+"Z","fl2");return o;}

/* ===== nouveaux schémas : outils ===== */
function arc(cx,cy,r,a0,a1,c,m){var p=function(a){a=a*Math.PI/180;return [(cx+r*Math.cos(a)).toFixed(1),(cy+r*Math.sin(a)).toFixed(1)];};var s=p(a0),e=p(a1);return pa("M"+s[0]+","+s[1]+" A"+r+","+r+" 0 "+(Math.abs(a1-a0)>180?1:0)+" "+(a1>a0?1:0)+" "+e[0]+","+e[1],c||"ln",m);}
function wedge(cx,cy,r,n){if(n>=8)return ci(cx,cy,r,"ac3");if(n<=0)return "";var a=-Math.PI/2+n*Math.PI/4;return po("M"+cx+","+cy+" L"+cx+","+(cy-r)+" A"+r+","+r+" 0 "+(n>4?1:0)+" 1 "+(cx+r*Math.cos(a)).toFixed(1)+","+(cy+r*Math.sin(a)).toFixed(1)+"Z","ac3");}
function cloud(x,y,s,c){s=s||1;return g("translate("+x+","+y+") scale("+s+")",el(0,0,26,10,c||"fl3")+el(-14,-8,14,10,c||"fl3")+el(6,-14,16,13,c||"fl3")+el(20,-5,12,9,c||"fl3"));}
function col(d,color,w,dash){return '<path d="'+d+'" fill="none" style="stroke:'+color+';stroke-width:'+(w||3)+';stroke-linecap:round"'+(dash?' stroke-dasharray="'+dash+'"':'')+'/>';}

function timeline(items,titre){var n=items.length,x0=40,dx=(320-2*x0)/(n-1),o=ln(14,92,306,92,"tk2"),i,x;
 for(i=0;i<n;i++){x=x0+i*dx;var up=i%2===0;
  o+=dot(x,92,5,i===0||i===n-1?"dm":"dp")+ln(x,92,x,up?64:120,"ln","2 2");
  o+=tx(x,up?58:134,items[i][0],"tmg","middle");
  o+=tx(x,up?46:146,items[i][1],"tx","middle");
  if(items[i][2])o+=tx(x,up?34:158,items[i][2],"tm","middle");}
 return o+(titre?tx(160,176,titre,"tm","middle"):"");}

Q("H","Une rue de nuages est une particularité météorologique que l'on rencontre :",["les jours où il n'y a pas de vent","les jours où il y a du vent","uniquement en montagne","toujours parallèlement aux vallées"],1,"Les nuages s'alignent sous l'effet d'un écoulement.","Les rues de nuages sont des alignements de cumulus orientés dans le sens du vent. Elles se forment les jours où il y a du vent, avec des ascendances thermiques.","","BIA 2015 · 1.2 ✓");
Q("G","Le mistral est un vent qui souffle globalement :",["du nord vers le sud","du sud vers le nord","de l'est vers l'ouest","de l'ouest vers l'est"],0,"Il descend la vallée du Rhône vers la Méditerranée.","Le mistral est un vent froid et violent de secteur nord qui souffle le long de la vallée du Rhône vers la Méditerranée.","ventsreg","BIA 2015 · 1.3 ✓");
Q("G","La brise de mer est la plus forte :",["tôt le matin","en milieu d'après midi","en milieu de nuit","en début de nuit"],1,"Elle dépend de l'écart de température entre terre et mer.","La brise de mer est due au réchauffement de la terre par rapport à la mer. Elle est maximale en milieu d'après-midi, quand cet écart est le plus grand.","brisemer","BIA 2015 · 1.4 ✓");
Q("F","Le point de rosée est défini comme :",["l'emplacement de l'aéroport où les données météorologiques sont mesurées","la température qui permet l'évaporation de la rosée","la température à laquelle il faut refroidir un volume d'air pour qu'il y ait condensation","l'heure à laquelle la rosée va commencer à se déposer"],2,"C'est une température liée à la saturation de l'air.","Le point de rosée est la température à laquelle il faut refroidir une masse d'air, à pression constante, pour qu'elle soit saturée et que la vapeur d'eau se condense.","rosee","BIA 2015 · 1.5 ✓");
Q("F","Un anticyclone est un phénomène météorologique où l'on rencontre généralement :",["du beau temps","des vents pouvant atteindre voir dépasser 180 km/h","des pressions très basses","des nuages épais accompagnés de fortes turbulences"],0,"Pense au mouvement de l'air dans une zone de hautes pressions.","Un anticyclone est une zone de hautes pressions où l'air est subsident, ce qui empêche la formation de nuages épais. Il est généralement associé au beau temps.","","BIA 2015 · 1.6 ✓");
Q("H","Le givre qui se dépose sur un aéronef durant un vol :",["ne survient que si l'aéronef est proche du sol","n'est jamais dangereux, car il se dépose en couches très minces","peut être un phénomène très dangereux","ne survient que si l'aéronef vole à très haute altitude"],2,"Pense à l'effet du dépôt sur les ailes et l'hélice.","Le givrage modifie le profil des ailes, augmente la masse et la traînée et diminue la portance. Il peut devenir très dangereux.","givrage","BIA 2015 · 1.7 ✓");
Q("G","Un avion vole dans l'hémisphère nord à basse altitude. Il se déplace d'une dépression vers un anticyclone. Le pilote constate que le vent :",["vient de la droite","vient de la gauche","augmente régulièrement","vient de l'arrière"],0,"Dans l'hémisphère nord, le vent tourne autour d'une dépression dans le sens inverse des aiguilles d'une montre.","Dans l'hémisphère nord, le vent circule autour d'une dépression dans le sens anti-horaire, la dépression restant à sa gauche. En allant de la dépression vers l'anticyclone, le pilote reçoit donc le vent de sa droite.","anticy","BIA 2015 · 1.8 ✓");
Q("F","En atmosphère standard et en dessous de la tropopause, lorsque l'on s'élève de 1000 ft, la température de l'air :",["augmente de 2 degrés","diminue de 2 degrés","augmente de 6,5 degrés","diminue de 6,5 degrés"],1,"Le gradient standard vaut 6,5 °C par 1000 m.","Dans l'atmosphère standard, la température diminue de 6,5 °C par 1000 m, soit environ 2 °C par 1000 ft, jusqu'à la tropopause.","tempstd","BIA 2015 · 1.9 ✓");
Q("H","Une pluie durable et continue durant plusieurs heures provient du type de nuage suivant :",["cirrocumulus","cirrostratus","altocumulus","nimbostratus"],3,"Le préfixe ou le suffixe « nimbus » indique la pluie.","Le nimbostratus est un nuage épais et étendu, associé aux précipitations continues et durables.","nuages","BIA 2015 · 1.10 ✓");
Q("G","Dans un régime dépressionnaire, on constate que le ciel de traîne :",["suit le front froid","n'existe que l'été","suit le front chaud","précède le front froid"],0,"Le ciel de traîne est la fin de la perturbation.","Le ciel de traîne se situe derrière le front froid. Il est caractérisé par un temps instable avec des averses et des éclaircies.","depcoupe","BIA 2015 · 1.11 ✓");
Q("G","L'effet de foehn est un phénomène météorologique que l'on rencontre :",["en bord de mer","en plaine","en montagne","au dessus d'une forêt"],2,"Il implique le franchissement d'un relief par l'air.","L'effet de foehn se produit quand l'air franchit un relief : il se refroidit et se condense au vent, puis redescend plus chaud et sec sous le vent de la montagne.","foehn","BIA 2015 · 1.12 ✓");
Q("F","La pression atmosphérique est générée par :",["les forces de Coriolis","la rotation de la terre","le poids de l'air qui est au-dessus","la présence d'humidité dans l'air"],2,"Plus on monte, moins il y a d'air au-dessus de soi.","La pression atmosphérique en un point correspond au poids de la colonne d'air située au-dessus de ce point.","","BIA 2015 · 1.13 ✓");
Q("G","Dans un régime dépressionnaire, la masse d'air chaud est associée à :",["un ciel de traîne","des éclaircies","de la pluie","un ciel clair"],2,"Il s'agit du secteur compris entre le front chaud et le front froid.","Dans une dépression, le secteur chaud est situé entre le front chaud et le front froid. Il est généralement nuageux, avec des précipitations ou de la bruine.","depcoupe","BIA 2015 · 1.14 ✓");
Q("H","La formation d'un nuage est associée à :",["un phénomène de condensation de la vapeur d'eau","un phénomène de fusion","un phénomène de surfusion","un phénomène d'évaporation"],0,"Un nuage est fait de gouttelettes ou de cristaux.","Un nuage se forme quand l'air est refroidi jusqu'à saturation : la vapeur d'eau se condense en fines gouttelettes autour de noyaux de condensation.","condens","BIA 2015 · 1.15 ✓");
Q("H","Dans un cumulonimbus, on peut rencontrer des ascendances dont les valeurs maximales peuvent atteindre :",["Mach 1","1 à 3 m/s","150 à 200 m/s","20 à 40 m/s"],3,"Elles sont très fortes, mais restent loin de la vitesse du son.","Les courants ascendants d'un cumulonimbus peuvent atteindre 20 à 40 m/s. Ils sont très dangereux pour un aéronef.","cumulonimbus","BIA 2015 · 1.17 ✓");
Q("H","La grêle est généralement associée à :",["un nimbostratus","un altocumulus lenticulaire","un cumulonimbus","un cirrocumulus"],2,"Il faut un nuage à fort développement vertical.","La grêle se forme dans les cumulonimbus, où de forts courants ascendants font croître les grêlons.","cumulonimbus","BIA 2015 · 1.18 ✓");
Q("H","La situation qui est la plus susceptible de générer du brouillard est :",["un air très sec et une forte pression","une température supérieure au point de rosée et un vent fort","une température égale ou inférieure au point de rosée","une température largement supérieure au point de rosée et un vent faible"],2,"Il faut que l'air soit saturé.","Le brouillard se forme quand la température de l'air rejoint le point de rosée : l'air est saturé et la vapeur se condense près du sol.","rosee","BIA 2015 · 1.19 ✓");
Q("F","Un talweg désigne :",["une zone de plus basse pression atmosphérique que les régions environnantes","une surpression devant une chaîne de montagnes","une zone de ciel clair associée à l'effet de foehn","une zone où l'on trouve des entrées maritimes"],0,"C'est un terme de la carte des pressions.","Un talweg est un axe de basses pressions qui s'étend à partir d'une dépression. Il est associé à une zone de temps perturbé.","isobares","BIA 2015 · 1.20 ✓");
Q("A","Par définition, la portance est la composante de la résultante aérodynamique :",["parallèle à la direction du vent relatif","parallèle à la corde de profil de l'aile","perpendiculaire à la direction du vent relatif","perpendiculaire à la corde de profil de l'aile"],2,"Compare avec la définition de la traînée.","La résultante aérodynamique se décompose en deux : la portance, perpendiculaire au vent relatif, et la traînée, parallèle au vent relatif.","forces","BIA 2015 · 2.3 ✓");
Q("A","On appelle incidence ou angle d'attaque, l'angle formé par :",["la corde de l'aile et l'horizon","la direction du vent relatif et l'horizon","la corde de l'aile et la direction du vent relatif","la corde de l'aile et l'axe longitudinal de l'aéronef"],2,"Deux éléments liés à l'aile et à l'écoulement.","L'incidence est l'angle entre la corde du profil et la direction du vent relatif. Elle est différente de l'assiette, qui se mesure par rapport à l'horizon.","incidence","BIA 2015 · 2.4 ✓");
Q("B","Pour un aéronef en vol en palier stabilisé (vol horizontal stabilisé), quelle proposition est correcte ?",["La portance est légèrement inférieure au poids.","La portance équilibre la trainée.","La portance et la traction sont identiques.","La portance équilibre le poids."],3,"Regarde les forces verticales.","En palier stabilisé, les forces se compensent deux à deux : la portance équilibre le poids et la traction équilibre la traînée.","forces4","BIA 2015 · 2.5 ✓");
Q("B","Le facteur de charge est défini comme le rapport :",["Poids / Traînée","Portance / Traînée","Traînée / Poids","Portance / Poids"],3,"En vol horizontal rectiligne, il vaut 1.","Le facteur de charge est le rapport entre la portance et le poids. Il vaut 1 en palier stabilisé.","facteurcharge","BIA 2015 · 2.6 ✓");
Q("B","Le facteur de charge subi par un aéronef en virage :",["diminue avec l'inclinaison","est toujours égal à 2","ne dépend que du type d'aéronef","augmente avec l'inclinaison"],3,"Pense à la portance supplémentaire nécessaire pour compenser le poids en virage incliné.","En virage en palier, le facteur de charge vaut 1/cos(inclinaison). Il augmente avec l'inclinaison, par exemple 2 à 60°.","virage","BIA 2015 · 2.7 ✓");
Q("B","En vol en palier stabilisé (vol horizontal stabilisé), la force de propulsion (traction hélice ou poussée réacteur) équilibre :",["le poids","la portance","la traînée","la résultante aérodynamique"],2,"Ces deux forces sont horizontales.","En palier stabilisé, la force de propulsion équilibre la traînée, tandis que la portance équilibre le poids.","forces4","BIA 2015 · 2.8 ✓");
Q("B","Pour passer d'un vol rectiligne stabilisé à un virage horizontal stabilisé, il faut :",["diminuer la portance","diminuer la force de propulsion","augmenter la portance","augmenter le poids"],2,"La portance est inclinée en virage.","En virage incliné, seule une partie de la portance reste verticale. Il faut donc augmenter la portance (en tirant sur le manche) pour équilibrer le poids.","virage","BIA 2015 · 2.9 ✓");
Q("A","Le décrochage d'une aile est lié :",["uniquement à la vitesse du vent relatif","à son incidence","à la charge du profil","à la valeur de la traînée"],1,"Un avion peut décrocher à n'importe quelle vitesse.","Le décrochage se produit quand l'incidence dépasse une valeur critique : l'écoulement se décolle de l'extrados et la portance chute.","courbe","BIA 2015 · 2.10 ✓");
Q("A","L'incidence est positive lorsque :",["l'écoulement est parallèle à la corde du profil","l'écoulement attaque le profil du côté de l'extrados","l'écoulement attaque le profil du côté de l'intrados","l'aéronef est en vol dos stabilisé"],2,"Pense au côté du profil que l'air frappe en premier quand le nez est cabré.","L'incidence est positive quand le vent relatif arrive par le dessous du profil, côté intrados. Elle est nulle quand l'écoulement est parallèle à la corde.","incidencepositive","BIA 2015 · 2.11 ✓");
Q("A","Dans un écoulement d'air, lorsque les particules d'air sont animées de la même vitesse et suivent des trajectoires rectilignes et parallèles entre elles, on dit que l'écoulement est :",["tourbillonnant","de couche limite","turbulent","laminaire"],3,"Les filets d'air restent bien ordonnés.","Dans un écoulement laminaire, les filets d'air sont parallèles et ordonnés. Dans un écoulement turbulent, ils se mélangent et forment des tourbillons.","laminaireturb","BIA 2015 · 2.12 ✓");
Q("A","Les dispositifs hypersustentateurs, utilisés par exemple sur les avions de ligne, ont pour but :",["de diminuer la portance à vitesse élevée (par exemple : pour une descente d'urgence)","d'augmenter la vitesse de décrochage pour certaines manœuvres","de diminuer la traînée pour certaines manœuvres","de diminuer la vitesse de décrochage dans certaines phases de vol (par exemple : au décollage et à l'atterrissage)"],3,"Ils servent à voler lentement.","Les volets et becs de bord d'attaque augmentent la portance à basse vitesse. Ils diminuent ainsi la vitesse de décrochage au décollage et à l'atterrissage.","volets","BIA 2015 · 2.15 ✓");
Q("A","Lorsqu'une aile approche l'incidence de décrochage, l'écoulement des filets d'air sur l'extrados devient :",["turbulent au bord d'attaque et laminaire au bord de fuite","tourbillonnaire dès le bord d'attaque, les filets d'air \"décollent\" de la surface de l'aile","laminaire sur tout le profil","laminaire sur les deux premiers tiers de l'aile, turbulent proche du bord de fuite"],1,"L'écoulement ne suit plus la surface.","Près de l'incidence de décrochage, l'écoulement se décolle de l'extrados et devient tourbillonnaire, ce qui fait chuter la portance.","decollement","BIA 2015 · 2.16 ✓");
Q("B","Pour un aéronef en montée rectiligne uniforme, la force de traction de l'hélice est fonction :",["uniquement de la traînée","de la traînée, du poids et de l'angle de montée","uniquement du poids et de la portance","du poids et de l'angle de montée"],1,"Une composante du poids s'oppose à l'avancement en montée.","En montée uniforme, la traction doit équilibrer la traînée et la composante du poids parallèle à la trajectoire, qui dépend de l'angle de montée.","montee","BIA 2015 · 2.17 ✓");
Q("A","Pour une masse d'air donnée et à incidence fixée, si l'on multiplie par 2 la vitesse de l'air par rapport à un profil, la portance sera multipliée par :",["4","2","3","1, la portance ne dépendant pas de la vitesse relative"],0,"La portance dépend du carré de la vitesse.","La portance est proportionnelle au carré de la vitesse (Fz = ½ρSV²Cz). Si la vitesse double, la portance est multipliée par 4.","vitesse2","BIA 2015 · 2.18 ✓");
Q("B","Un planeur dont la finesse maximale est de 40 vole en ligne droite à sa vitesse de finesse maximale dans une masse d'air calme. Pour parcourir 20 km, combien d'altitude va-t-il perdre au minimum ?",["250 m","500 m","1000 m","2000 m"],1,"La finesse est le rapport entre la distance parcourue et la hauteur perdue.","La finesse est égale à la distance parcourue divisée par la hauteur perdue. Hauteur perdue = 20 000 m / 40 = 500 m.","finesse","BIA 2015 · 2.20 ✓");
Q("J","Tout appareil capable de s'élever et de circuler dans l'espace aérien :",["est un aéronef","subit des forces de portance et de traînée","possède obligatoirement un moteur","est piloté depuis l'intérieur de son cockpit"],0,"Pense à la définition générale, qui n'impose ni moteur ni pilote à bord.","Un aéronef est tout appareil capable de s'élever ou de circuler dans l'atmosphère. Il peut être sans moteur (planeur, ballon) ou sans pilote à bord (drone).","","BIA 2015 · 3.1 ✓");
Q("D","Une montgolfière :",["s'élève dans l'air car la masse volumique de l'air chaud est plus faible que celle de l'air froid","perd de l'altitude lorsque la température de l'air situé dans l'enveloppe augmente","fait partie de la catégorie des aérodynes","peut être dirigée à l'aide d'une gouverne de profondeur située sur la nacelle"],0,"Elle vole grâce à la poussée d'Archimède.","L'air chaud de l'enveloppe est moins dense que l'air extérieur : la poussée d'Archimède l'emporte sur le poids et la montgolfière s'élève. C'est un aérostat.","montg","BIA 2015 · 3.2 ✓");
Q("L","Un aéronef qui, en croisière, voit son rotor entraîné par le vent relatif est :",["un convertible","un girodyne","un hélicoptère","un autogire"],3,"Le rotor tourne en autorotation.","Dans un autogire, le rotor n'est pas motorisé en vol : il tourne en autorotation sous l'effet du vent relatif. La propulsion est assurée par une hélice.","autogire","BIA 2015 · 3.3 ✓");

Q("J","Un turbopropulseur :",["est un pulsoréacteur précédé d'un réducteur et d'une hélice","est un statoréacteur précédé d'un réducteur et d'une hélice","est un moteur thermique équipé d'un turbocompresseur","est un turboréacteur précédé d'un réducteur et d'une hélice"],3,"La turbine entraîne une hélice par un réducteur.","Un turbopropulseur est un turboréacteur dont la turbine entraîne une hélice par l'intermédiaire d'un réducteur.","turbopropu","BIA 2015 · 3.5 ✓");
Q("J","Dans un moteur 4 temps, lors de l'explosion (ou combustion) :",["une des soupapes est fermée","les soupapes sont ouvertes","les soupapes sont fermées","l'ouverture ou la fermeture des soupapes n'a pas d'importance"],2,"Les gaz doivent rester enfermés dans le cylindre.","Pendant la combustion-détente, les soupapes d'admission et d'échappement sont fermées afin que la pression pousse le piston.","quatretemps","BIA 2015 · 3.6 ✓");
Q("J","Sur un avion certifié, un moteur à pistons contenant 4 cylindres est pourvu au total de :",["2 bougies d'allumage","4 bougies d'allumage","8 bougies d'allumage","0 bougie d'allumage"],2,"Il y a un double allumage par sécurité.","Les moteurs d'avions certifiés ont un double allumage (deux magnétos) : chaque cylindre a deux bougies, soit 8 bougies pour 4 cylindres.","","BIA 2015 · 3.7 ✓");
Q("E","Un moteur de fusée fonctionne :",["dans l'atmosphère et dans l'espace","uniquement dans l'atmosphère","uniquement dans l'espace","uniquement à une altitude comprise entre 0 et 100 km"],0,"Il emporte son propre comburant.","Un moteur-fusée emporte carburant et comburant. Il n'a pas besoin de l'air extérieur et fonctionne donc aussi bien dans l'atmosphère que dans le vide.","fusee","BIA 2015 · 3.8 ✓");

Q("J","Le petit pas de l'hélice à pas variable est utilisé pour :",["l'atterrissage uniquement","le décollage uniquement","le décollage et l'atterrissage","le vol de croisière"],2,"Il permet une forte traction à faible vitesse.","Le petit pas donne une forte traction à basse vitesse, utile au décollage et à l'atterrissage. Le grand pas est utilisé en croisière.","petitgrandpas","BIA 2015 · 3.10 ✓");

Q("K","Pour indiquer l'altitude, l'altimètre utilise :",["la différence entre la pression totale et la pression dynamique","la pression totale","la pression dynamique","la pression statique"],3,"Il mesure la pression de l'air ambiant.","L'altimètre est un baromètre gradué en altitude qui mesure la pression statique, laquelle diminue avec l'altitude.","altimetrecapsule","BIA 2015 · 3.17 ✓");

Q("J","En phase d'atterrissage, lorsque toutes les roues ont touché la piste, les spoilers :",["servent essentiellement à détruire la portance de l'aile afin de plaquer l'avion au sol pour que les freins de roues soient plus efficaces.","sont une aide au pilotage qui permet à l'avion de conserver son axe durant cette phase de roulage. Ils sortent soit à droite soit à gauche. Cette fonction est utilisée sur piste contaminée (pluie, neige, glace, grêle …).","ne sont utiles que durant le vol.","servent essentiellement à augmenter la traînée de l'aile afin de freiner l'avion sur la piste. C'est le moyen de freinage le plus efficace."],0,"Ils agissent sur l'appui des roues.","Au sol, les spoilers sortis détruisent la portance : le poids repose sur les roues, ce qui rend les freins plus efficaces.","aerofreins","BIA 2015 · 3.20 ✓");

Q("O","Qu'est-ce que l'hypoxie ?",["Le défaut d'oxygénation dû à l'altitude","La présence d'alcool dans l'organisme à faible dose","L'insuffisance respiratoire due aux accélérations et décélérations","La suffocation due au stress du pilote"],0,"Le préfixe « hypo » signifie manque.","L'hypoxie est un manque d'oxygène dans l'organisme. En altitude, la pression partielle d'oxygène diminue, ce qui altère les capacités du pilote.","hypoxie","BIA 2015 · 4.19 ✓");

Q("E","Le rôle d'une sonde spatiale est :",["d'être habitée pour permettre à l'homme d'effectuer des expériences en apesanteur.","d'explorer le système solaire.","d'évoluer en orbite basse pour analyser l'atmosphère terrestre.","d'être satellisée en orbite géostationnaire."],1,"Une sonde n'est pas un satellite terrestre et n'est pas habitée.","Une sonde spatiale est un engin non habité envoyé hors de l'orbite terrestre pour explorer le système solaire (planètes, comètes, astéroïdes).","","BIA 2016 · 3.1 ✓");
Q("L","Le rotor anticouple d'un hélicoptère permet de contrôler :",["la rotation autour de l'axe de tangage.","la rotation autour de l'axe de lacet.","la rotation autour de l'axe de roulis.","la vitesse ascensionnelle."],1,"Il compense le couple qui fait tourner le fuselage dans le sens opposé au rotor principal.","Le rotor anticouple compense le couple de réaction du rotor principal et permet au pilote de contrôler la rotation autour de l'axe de lacet.","helico","BIA 2016 · 3.2 ✓");
Q("J","Dans un moteur à 4 temps, la compression intervient après :",["la combustion.","la détente.","l'admission.","l'échappement."],2,"Il faut d'abord remplir le cylindre avant de comprimer le mélange.","Les quatre temps se succèdent dans l'ordre : admission, compression, combustion-détente, échappement. La compression suit donc l'admission.","quatretemps","BIA 2016 · 3.3 ✓");

Q("J","Le pilote peut utiliser la postcombustion pour :",["augmenter la poussée pendant une durée assez courte.","perdre de la vitesse très rapidement.","effectuer des virages à plat.","atterrir par vent de travers."],0,"Elle consomme beaucoup de carburant.","La postcombustion injecte du carburant dans les gaz d'échappement du turboréacteur pour augmenter fortement la poussée, mais seulement brièvement à cause de sa forte consommation.","","BIA 2016 · 3.5 ✓");
Q("L","Si on la compare aux voilures d'un avion, la voilure des planeurs modernes se caractérise par :",["une petite envergure.","une très grande finesse.","une grande épaisseur du profil.","une très grande rigidité."],1,"Un planeur doit parcourir une grande distance sans moteur.","Les planeurs modernes ont une grande envergure et un profil très fin, ce qui leur donne une très grande finesse.","","BIA 2016 · 3.6 ✓");
Q("J","Les pièces situant dans le sens longitudinal de l'aile et assurant la plus grande partie de la résistance sont :",["les traverses.","les longerons.","les lisses.","les raidisseurs."],1,"Elles courent de l'emplanture au bout de l'aile.","Les longerons sont les pièces longitudinales de l'aile qui reprennent l'essentiel des efforts de flexion ; les nervures donnent la forme du profil.","aileint","BIA 2016 · 3.8 ✓");
Q("J","Les couples :",["ont dans le fuselage le même rôle que les nervures dans les ailes.","sont situés en bout d'aile pour éviter les tourbillons marginaux.","sont les pièces maîtresses du fuselage qui supportent les efforts de flexion.","sont toujours montés par paire pour augmenter leur solidité."],0,"Ils donnent sa forme à la section du fuselage.","Les couples sont des cadres transversaux qui donnent sa forme au fuselage, comme les nervures le font pour l'aile. Les longerons et lisses supportent les efforts longitudinaux.","fuselagecadres","BIA 2016 · 3.9 ✓");
Q("J","Dans un empennage en T :",["la gouverne de direction se situe en haut de l'empennage vertical.","la gouverne de profondeur est actionnée par le palonnier.","la gouverne de direction permet la rotation autour de l'axe de tangage.","la gouverne de profondeur se situe en haut de l'empennage vertical."],3,"Le « T » est formé par le plan horizontal posé sur la dérive.","Dans un empennage en T, le plan horizontal, qui porte la gouverne de profondeur, est fixé en haut de la dérive (empennage vertical).","empennages","BIA 2016 · 3.10 ✓");
Q("L","Le pilotage en vol d'un deltaplane s'effectue à l'aide du :",["trapèze.","manche à balai.","palonnier.","barreau de pilotage."],0,"Le pilote déplace son poids en agissant sur une barre fixée à l'aile.","Le deltaplane se pilote en déplaçant le trapèze (barre de contrôle) pour modifier le centrage, et donc l'assiette et l'inclinaison de l'aile.","pilotagecg","BIA 2016 · 3.11 ✓");
Q("J","Pour un avion au sol à l'arrêt, l'aile subit :",["une flexion vers le bas.","une torsion.","une traction.","une compression."],0,"Au sol, c'est le poids de l'avion qui la sollicite, sans portance.","À l'arrêt au sol, la portance est nulle et l'aile supporte son propre poids ainsi que celui du carburant : elle subit une flexion vers le bas.","flexionaile","BIA 2016 · 3.12 ✓");
Q("C","Sur un aéronef multiaxes la commande permettant d'agir sur l'axe de lacet est :",["le palonnier.","le manche en le déplaçant latéralement.","le manche en le déplaçant d'avant en arrière.","la commande moteur."],0,"Ce sont les pieds qui commandent cet axe.","Le palonnier, actionné aux pieds, commande la gouverne de direction et donc le mouvement autour de l'axe de lacet.","direction","BIA 2016 · 3.13 ✓");
Q("C","Au cours d'un vol, l'action du pilote sur le palonnier :",["agit sur la gouverne de direction.","agit sur la gouverne de profondeur.","n'agit sur aucun élément car le palonnier n'est utilisable qu'au sol.","agit sur la gouverne de gauchissement."],0,"Le palonnier commande la dérive mobile.","Le palonnier commande la gouverne de direction, qui agit sur le lacet. Il sert en vol comme au sol.","direction","BIA 2016 · 3.14 ✓");
Q("C","Sur un ULM multiaxes, si l'aileron droit se lève :",["l'ULM pivote sur l'axe de roulis.","l'ULM pivote sur l'axe de tangage.","l'aileron gauche se lève également.","la gouverne de profondeur s'abaisse."],0,"Les ailerons fonctionnent de façon différentielle.","Les ailerons agissent en sens opposé : quand l'un se lève, l'autre s'abaisse. Ils font pivoter l'appareil autour de l'axe de roulis.","ailerons","BIA 2016 · 3.15 ✓");
Q("A","Lorsque les volets sont en configuration atterrissage :",["la configuration est dite lisse.","les volets sont rentrés.","la courbure de l'aile augmente pour augmenter la portance.","leur braquage est négatif."],2,"Les volets sont sortis pour pouvoir voler lentement.","En configuration atterrissage, les volets sont sortis et braqués vers le bas : la courbure de l'aile augmente, ce qui accroît la portance à basse vitesse.","volets","BIA 2016 · 3.16 ✓");
Q("J","Le fluide d'un circuit hydraulique :",["est de l'eau utilisable sous basse pression et à une température supérieure à 0°C.","est difficilement utilisable sur avion du fait de sa compressibilité.","n'est utilisé qu'au-delà de 0°C pour actionner les freins et les vérins des trains escamotables.","est utilisé sous pression pour actionner des commandes."],3,"Un liquide transmet la pression qu'on lui applique.","Un circuit hydraulique utilise une huile sous pression, peu compressible, pour actionner les commandes de vol, les freins ou les trains d'atterrissage.","","BIA 2016 · 3.17 ✓");
Q("K","La sonde Pitot est un dispositif permettant de mesurer :",["la vitesse.","la température.","la pression statique uniquement.","l'altitude."],0,"Elle mesure la pression d'arrêt de l'écoulement.","La sonde Pitot capte la pression totale ; comparée à la pression statique, elle permet de déterminer la vitesse de l'avion par rapport à l'air.","pitot","BIA 2016 · 3.18 ✓");

Q("N","La hauteur minimale de survol d'un aéronef au-dessus de la campagne est :",["50 m.","150 m.","250 m.","500 m."],1,"Elle correspond à 500 ft.","Hors agglomération et rassemblement de personnes, la hauteur minimale de survol est de 150 m (500 ft) au-dessus du sol ou de l'obstacle.","hauteurs","BIA 2016 · 4.1 ✓");

Q("M","Un aéronef a une vitesse propre de 160 km∙h⁻¹ et subit un vent d'ouest de 50 km∙h⁻¹. Pour faire route au Nord il devra suivre un cap de :",["20°.","270°.","340°.","360°."],2,"Un vent d'ouest pousse l'avion vers l'est : il faut donc corriger du côté opposé.","Le vent d'ouest dérive l'avion vers l'est. Il faut corriger vers l'ouest d'un angle tel que sin(α) = 50/160, soit environ 18°, d'où un cap d'environ 340°.","capcourse","BIA 2016 · 4.4 ✓");
Q("N","Une piste dont l'orientation magnétique est de 84 est numérotée :",["09.","08.","27.","84."],1,"On arrondit à la dizaine de degrés avant de diviser par dix.","Le numéro de piste correspond à l'orientation magnétique arrondie à la dizaine puis divisée par 10 : 84° donne 80°, soit la piste 08.","numeropiste","BIA 2016 · 4.5 ✓");
Q("I","La visibilité associée à une situation météorologique CAVOK est :",["inférieure à 5 km.","supérieure à 5 km.","inférieure à 10 km.","supérieure à 10 km."],3,"CAVOK regroupe de bonnes conditions de visibilité, de nuages et de temps.","CAVOK (Ceiling And Visibility OK) signifie visibilité supérieure ou égale à 10 km, pas de nuage significatif sous 5000 ft et pas de phénomène significatif.","","BIA 2016 · 4.6 ✓");

Q("N","Sur une fréquence radio un aéronef immatriculé F-GTYB s'identifie :",["Fox-Trot-Golf-Tango-Yako-Bravo.","French-Golf-Tango-Yankee-Bravo.","Fox-Golf-Tango-Yankee-Borneo.","Fox-Trot-Golf-Tango-Yankee-Bravo."],3,"Utilise l'alphabet phonétique international.","Dans l'alphabet OACI : F = Fox-trot, G = Golf, T = Tango, Y = Yankee, B = Bravo.","alphabet","BIA 2016 · 4.9 ✓");
Q("N","Une zone identifiée par la lettre « R » correspond à :",["une zone à la pénétration interdite.","une zone à la pénétration restreinte sous certaines conditions.","une zone interdite provisoirement.","une zone dangereuse."],1,"R vient de l'anglais « restricted ».","Une zone R (réglementée) est une zone dont la pénétration est soumise à certaines conditions. P désigne une zone interdite et D une zone dangereuse.","","BIA 2016 · 4.10 ✓");
Q("I","Un NOTAM est :",["une notification qui mentionne l'état ou la modification d'une installation, d'un service, d'une procédure ou l'existence d'un danger.","une zone d'interdiction militaire.","l'ensemble des conditions météorologiques nécessaires au vol VFR.","un manuel de procédures propres à chaque machine."],0,"C'est un message d'information aux navigants (Notice To Airmen).","Un NOTAM est un avis aux navigants qui signale l'état ou la modification d'une installation, d'un service ou d'une procédure, ou l'existence d'un danger.","","BIA 2016 · 4.11 ✓");

Q("N","La réglementation ULM comporte :",["3 classes.","4 classes.","5 classes.","6 classes."],3,"Pense aux paramoteurs, pendulaires, multiaxes, autogires, hélicoptères et aérostats.","La réglementation française distingue 6 classes d'ULM : paramoteur, pendulaire, multiaxes, autogire, hélicoptère et aérostat.","","BIA 2016 · 4.13 ✓");

Q("R","La fédération française qui prend en charge les planeurs est :",["la FFPLUM.","la FFA.","la FFVL.","la FFVV."],3,"Le sigle fait référence au vol à voile.","La Fédération française de vol à voile (FFVV) regroupe les clubs de planeur. La FFPLUM est celle des ULM, la FFA celle des avions et la FFVL celle du vol libre.","","BIA 2016 · 4.16 ✓");

Q("O","Le taux d'alcoolémie maximum autorisé pour piloter doit être inférieur ou égal à :",["0,2 g∙l⁻¹.","0,3 g∙l⁻¹.","0,4 g∙l⁻¹.","0,5 g∙l⁻¹."],0,"Cette limite est plus stricte que celle autorisée pour conduire une voiture.","Le taux d'alcoolémie toléré pour exercer des fonctions de pilote est inférieur à celui de la route : la valeur retenue au BIA est de 0,2 g/l de sang.","","BIA 2016 · 4.18 ✓");
Q("O","L'action prioritaire à entreprendre lors d'une panne moteur au décollage sur un aéronef monomoteur est :",["lancer un appel de détresse à la radio.","tenter de redémarrer le moteur pour faire un circuit basse hauteur.","tenter un demi-tour pour se poser sur la piste.","se poser droit devant avec une altération de cap maximale de 30°."],3,"À basse hauteur, on ne cherche pas à revenir.","En cas de panne moteur au décollage, on garde le contrôle de l'avion et on se pose droit devant, avec au plus une trentaine de degrés d'altération de cap. Le demi-tour à basse hauteur est très dangereux.","pannedeco","BIA 2016 · 4.19 ✓");
Q("O","Pour la sécurité des vols, la qualité qu'il faut avoir en priorité est :",["une bonne connaissance de soi, de ses limites et de sa machine.","une grande habileté de pilotage.","un grand nombre d'heures de pilotage.","une bonne connaissance de la réglementation."],0,"La sécurité repose d'abord sur une bonne évaluation de ses capacités.","Un pilote sûr connaît ses limites et celles de son aéronef, ce qui lui permet de renoncer à un vol quand les conditions ne sont pas favorables.","","BIA 2016 · 4.20 ✓");
