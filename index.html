<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d4e89"><meta name="description" content="Cap BIA : s'entraîner au Brevet d'initiation aéronautique avec des QCM, des indices et des schémas.">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<script src="config.js"></script>
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif;background:#eef2f6}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Cap BIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Concept : carnet d'entraînement façon carte aéronautique — encre bleue, balises magenta, une question à la fois. */
:root{
  --bg:#eef2f6; --surface:#ffffff; --ink:#0f2236; --muted:#566b80; --line:#cfd9e3;
  --accent:#1d4e89; --on-accent:#ffffff; --accent-soft:#e3edf8;
  --mag:#a8185f; --mag-soft:#f8e4ee;
  --ok:#1c7a4a; --ok-soft:#e1f3e9; --bad:#b3261e; --bad-soft:#fbe6e4;
  --display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b1623; --surface:#13243a; --ink:#e7eff8; --muted:#9bb0c6; --line:#27405c;
    --accent:#7fb2ee; --on-accent:#0b1623; --accent-soft:#17304f;
    --mag:#ff8cc0; --mag-soft:#3a1a2e;
    --ok:#5fd394; --ok-soft:#133526; --bad:#ff8f86; --bad-soft:#3d1c1a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1623; --surface:#13243a; --ink:#e7eff8; --muted:#9bb0c6; --line:#27405c;
  --accent:#7fb2ee; --on-accent:#0b1623; --accent-soft:#17304f;
  --mag:#ff8cc0; --mag-soft:#3a1a2e;
  --ok:#5fd394; --ok-soft:#133526; --bad:#ff8f86; --bad-soft:#3d1c1a;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:clamp(16px,calc((100vw - 600px) / 2),5cm);padding-block:20px 56px}
.wrap{max-width:none;margin-inline:0;min-width:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mag);outline-offset:2px}
.eyebrow{font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mag)}
h1{font:700 clamp(34px,10vw,46px)/1 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:6px 0 10px}
h2{font:700 21px/1.3 var(--display);margin:0;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 18px;max-width:60ch}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:18px;max-width:280px}
.field label{font:600 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.total{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.total b{font:700 30px var(--display)}
.total span{color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.secs{display:flex;flex-direction:column;gap:10px;margin:18px 0}
.sec{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;text-align:left;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;cursor:pointer}
@media (hover:hover){.sec:hover{border-color:var(--accent)}}
.badge{width:38px;height:38px;border:2px solid var(--mag);border-radius:50%;display:grid;place-items:center;font:600 16px var(--mono);color:var(--mag);flex:none}
.sec b{display:block;font:700 18px/1.2 var(--display)}
.sec small{display:block;font:500 12px var(--mono);color:var(--muted);margin:2px 0 8px}
.sec .cnt{font:600 14px var(--mono);color:var(--muted);white-space:nowrap}
.btn{min-height:44px;padding:10px 18px;border-radius:8px;border:1.5px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.warn{border-color:var(--bad);color:var(--bad);background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.hist{margin:26px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:15px}
.hist li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:6px}
.hist span{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap}
.note{margin-top:28px;font-size:14px;color:var(--muted);max-width:62ch}
h3.sub{font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 8px}
/* quiz */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.link{background:none;border:0;padding:8px 0;color:var(--accent);font-weight:700;cursor:pointer;min-height:44px}
.meta{font:600 13px var(--mono);color:var(--muted);display:flex;gap:14px}
.timer{color:var(--mag)}
.card{margin-top:18px}
.tag{font:600 12px var(--mono);letter-spacing:.06em;color:var(--mag);margin-bottom:6px}
.choice{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;margin-top:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;cursor:pointer}
@media (hover:hover){.choice:hover{border-color:var(--accent)}}
.choice .L{flex:none;width:26px;height:26px;border:1.5px solid var(--muted);border-radius:50%;display:grid;place-items:center;font:600 13px var(--mono);color:var(--muted)}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice.ok{border-color:var(--ok);background:var(--ok-soft)}
.choice.bad{border-color:var(--bad);background:var(--bad-soft)}
.choice.dim{opacity:.6}
.aids{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.panel{margin-top:12px;padding:12px 14px;border-radius:8px;background:var(--accent-soft);border-left:4px solid var(--accent)}
.panel.hint{background:var(--mag-soft);border-left-color:var(--mag)}
.panel h3{margin:0 0 4px;font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.panel.hint h3{color:var(--mag)}
.panel p{margin:0}
.fb{margin-top:14px;padding:10px 14px;border-radius:8px;font-weight:700}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.next{margin-top:18px}
/* result */
.score{font:700 64px/1 var(--display);margin:8px 0 2px}
.score small{font-size:28px;color:var(--muted)}
.sline{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;margin:8px 0;font-size:15px}
details{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-top:8px;padding:10px 14px}
summary{cursor:pointer;font-weight:600}
details p{margin:8px 0 0}
textarea{width:100%;min-height:150px;font:500 13px/1.5 var(--mono);padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);resize:vertical}

/* suivi */
.tb{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:18px;padding-bottom:12px;position:sticky;top:0;z-index:20;background:var(--bg);padding-top:8px;margin-top:-8px;border-bottom:1px solid var(--line)}
.chip{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 14px 4px 6px;border:1.5px solid var(--line);border-radius:24px;background:var(--surface);cursor:pointer;text-align:left;max-width:100%}
.chip .av{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:700 15px var(--display);flex:none}
.chip b{display:block;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.chip small{display:block;font:500 11px var(--mono);color:var(--muted)}
.tabs{display:flex;gap:4px}
.tab{min-height:44px;padding:8px 14px;border:0;border-bottom:3px solid transparent;background:none;font-weight:700;color:var(--muted);cursor:pointer}
.tab[aria-current="page"]{color:var(--accent);border-bottom-color:var(--mag)}
.pcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;text-align:left;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;cursor:pointer}
.pcard .av{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:700 18px var(--display)}
.pcard b{display:block;overflow-wrap:anywhere}
.pcard small{font:500 12px var(--mono);color:var(--muted)}
.plist{display:flex;flex-direction:column;gap:8px;margin:10px 0 6px}
.prow{display:flex;gap:8px;align-items:stretch}
.prow .pcard{flex:1;min-width:0}
.prow .btn{min-height:0;padding:6px 10px;font-size:13px}
.form{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-top:8px}
.form .field{margin:0}
.pw{display:flex;gap:6px;align-items:stretch}.pw input{flex:1;min-width:0}.eye{min-width:84px;padding:0 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--accent);font:600 13px inherit;cursor:pointer}.acc .field{max-width:360px}.acc-tabs{margin:14px 0 6px}
/* apparence : fonds pastel (le choix de l'élève l'emporte sur le mode clair/sombre du système) */
:root[data-look="rose"]{--bg:#fbe9ef;--surface:#ffffff;--ink:#0f2236;--muted:#5b4a56;--line:#e8c0d0;--accent:#a3264f;--on-accent:#ffffff;--accent-soft:#f6d3e0;--mag:#6b2c8a;--mag-soft:#eadcf3;color-scheme:light}
:root[data-look="orange"]{--bg:#fdecd9;--surface:#ffffff;--ink:#0f2236;--muted:#6a5846;--line:#ecceab;--accent:#964608;--on-accent:#ffffff;--accent-soft:#f9d9b6;--mag:#a8185f;--mag-soft:#f8e4ee;color-scheme:light}
:root[data-look="vert"]{--bg:#e5f4e7;--surface:#ffffff;--ink:#0f2236;--muted:#4b6354;--line:#b5d7bd;--accent:#23693f;--on-accent:#ffffff;--accent-soft:#cbe8d1;--mag:#a8185f;--mag-soft:#f8e4ee;color-scheme:light}
:root[data-look="bleuclair"]{--bg:#e2f0fb;--surface:#ffffff;--ink:#0f2236;--muted:#4a6076;--line:#b4d3ea;--accent:#175d90;--on-accent:#ffffff;--accent-soft:#c9e3f6;--mag:#a8185f;--mag-soft:#f8e4ee;color-scheme:light}
:root[data-look="lavande"]{--bg:#eee8fa;--surface:#ffffff;--ink:#0f2236;--muted:#5a5273;--line:#cdc1e6;--accent:#53389a;--on-accent:#ffffff;--accent-soft:#dcd1f2;--mag:#a8185f;--mag-soft:#f8e4ee;color-scheme:light}
:root[data-look="bleunuit"]{--bg:#1b2b4a;--surface:#26395e;--ink:#eaf1fb;--muted:#b3c4dc;--line:#3f5a8c;--accent:#a9cdf8;--on-accent:#0b1623;--accent-soft:#2f4772;--mag:#ff9cc8;--mag-soft:#4a2a48;--ok:#5fd394;--ok-soft:#133526;--bad:#ff8f86;--bad-soft:#3d1c1a;color-scheme:dark}
.wp{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;color:var(--accent);opacity:.13}
.lookbtn{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:20;width:40px;height:40px;padding:0;display:grid;place-items:center;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--accent);font:600 13px var(--body);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.look-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-bottom:12px}
.look-opt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:600 13px var(--body);cursor:pointer}
.look-opt[aria-checked=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.look-sw{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line)}
.look-chk{display:flex;gap:10px;align-items:flex-start;margin:6px 0 14px;cursor:pointer}
.look-chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
.field select{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.rep-ov{position:fixed;inset:0;z-index:50;background:rgba(5,12,20,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.rep-box{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-top:4px solid var(--mag);border-radius:12px;padding:16px 18px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
.rep-box h3{margin:0 0 8px;font-size:18px;font-weight:800;text-transform:none;letter-spacing:0;color:var(--ink)}
.rep-box p{margin:0 0 10px}
.rep-q{font:600 12px var(--mono);color:var(--mag);letter-spacing:.06em}
.rep-l{display:block;font-weight:700;margin:4px 0}
.rep-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.rep-flag{margin-top:6px}
.link.small{font-weight:600;font-size:13px;color:var(--muted)}
.msg{margin:10px 0 0;font-weight:600;color:var(--mag)}
.delta{padding:10px 14px;border-radius:8px;background:var(--ok-soft);color:var(--ok);font-weight:700;margin:0 0 16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0 4px}
.kpi{padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.kpi b{display:block;font:700 28px/1.1 var(--display)}
.kpi span{font:500 12px var(--mono);color:var(--muted)}
.chartbox{position:relative;margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 6px 4px}
.chartbox svg{display:block;width:100%;height:auto;touch-action:pan-y}
.chartbox .g{stroke:var(--line);stroke-width:1}
.chartbox .ax{fill:var(--muted);font:500 11px var(--mono)}
.chartbox .ln2{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chartbox .pt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chartbox .pe{fill:var(--surface);stroke:var(--mag);stroke-width:2.5}
.chartbox .val{fill:var(--ink);font:700 15px var(--display)}
.chartbox .cr{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.tip{min-height:40px;padding:4px 10px 0;font-size:13px;line-height:1.35;color:var(--muted)}
.cap{font-size:13px;color:var(--muted);margin:6px 0 0}
.dual{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;margin:12px 0}
.dual .b2{display:flex;flex-direction:column;gap:5px}
.dual .r{display:grid;grid-template-columns:minmax(0,1fr) 52px;gap:8px;align-items:center;font:500 12px var(--mono);color:var(--muted)}
.bar.thin{height:8px}
.bar.first i{background:var(--muted)}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:2px 0 6px}
.leg i{display:inline-block;width:12px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle}
.tblwrap{overflow-x:auto;margin-top:10px}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.t th{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
table.t td.c{font-family:var(--mono);text-align:center}
.c0{background:var(--bad-soft);color:var(--bad)} .c1{background:var(--accent-soft)} .c2{background:var(--ok-soft);color:var(--ok)} .cx0{color:var(--muted)}
.codebox{min-height:90px;word-break:break-all}
.sortbtn{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-decoration:underline}

.thhead{display:flex;align-items:baseline;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;margin-top:8px}
.thhead h3.sub{margin:22px 0 0;flex:1;min-width:220px}
.thhead .link{min-height:44px;font-size:14px}
.theme .secs{margin:6px 0 4px}

/* schémas */
.fig{margin:12px 0 0;max-width:460px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 8px 6px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:13px;line-height:1.4;color:var(--muted);margin-top:4px}
.fig svg *{vector-effect:none}
.fig .ln{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.fig .ac{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.fig .mgt{fill:none;stroke:var(--mag);stroke-width:1.1;stroke-linecap:round}
.fig .mg{fill:none;stroke:var(--mag);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.fig .gr{fill:none;stroke:var(--ok);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.fig .tk{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round}
.fig .tk2{fill:none;stroke:var(--ink);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.fig .ac2{fill:none;stroke:var(--accent);stroke-width:4.5;stroke-linecap:round}
.fig .fl{fill:var(--accent-soft);stroke:var(--ink);stroke-width:1.5;stroke-linejoin:round}
.fig .fl2{fill:var(--mag-soft);stroke:var(--ink);stroke-width:1.5;stroke-linejoin:round}
.fig .fl3{fill:var(--line);stroke:var(--ink);stroke-width:1.5;stroke-linejoin:round}
.fig .ac3{fill:var(--accent);stroke:var(--ink);stroke-width:1.2;stroke-linejoin:round}
.fig .bx{fill:var(--bg);stroke:var(--line);stroke-width:1.5}
.fig .gz{fill:var(--accent)} .fig .gb{fill:var(--mag)}
.fig .zn{fill:var(--mag-soft);opacity:.7}
.fig .vo{fill:none;stroke:var(--mag);stroke-width:1.6}
.fig .dt{fill:var(--ink)} .fig .dm{fill:var(--mag)} .fig .dp{fill:var(--accent)}
.fig .dc{fill:var(--surface);stroke:var(--mag);stroke-width:2}
.fig .ter{fill:var(--accent-soft);stroke:var(--ink);stroke-width:1.5}
.fig .orb{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-dasharray:5 4}
.fig .dsh{fill:var(--bg);stroke:var(--ink);stroke-width:1.3;stroke-dasharray:3 2}
.fig text{font-family:var(--body)}
.fig .tx{fill:var(--ink);font:600 11px var(--body)}
.fig .tm{fill:var(--muted);font:500 10px var(--mono)}
.fig .tac{fill:var(--accent);font:700 11px var(--body)}
.fig .tmg{fill:var(--mag);font:700 11px var(--body)}
.fig .tgr{fill:var(--ok);font:700 11px var(--body)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
.chip{position:relative}
.dot{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#c0362c;color:#fff;font:700 12px/20px var(--mono,monospace);text-align:center;box-shadow:0 0 0 2px var(--bg)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid currentColor}
.pill.o-corrige{color:#12775f}.pill.o-partiel{color:#c25a00}.pill.o-inchange{color:#5b6f91}.pill.o-new{color:#fff;background:#c0362c;border-color:#c0362c}

background:var(--surface);display:flex;align-items:center;justify-content:center;min-width:0}.mfc.em{background:var(--bg)}.mfc.cl{flex-direction:column;align-items:stretch;justify-content:center;gap:2px;padding:2px 3px;background:var(--accent-soft);overflow:hidden}.mfc.cl span{font:600 9.5px/1.1 var(--body);color:var(--ink);overflow-wrap:anywhere}

<div class="wrap" id="app"></div>

<script>
(function(){
"use strict";
var SECS=[
 {k:"A",t:"L'aile et la portance",p:"PROG 2.1",th:2},
 {k:"B",t:"Les forces et le vol stabilisé",p:"PROG 2.2",th:2},
 {k:"C",t:"Axes et commandes de vol",p:"PROG 2.2 · 3.4",th:2},
 {k:"D",t:"L'aérostation",p:"PROG 2.3",th:2},
 {k:"E",t:"Le vol spatial",p:"PROG 2.4",th:2},
 {k:"F",t:"L'atmosphère et la pression",p:"Thème 1 · Atmosphère",th:1},
 {k:"G",t:"Le vent et les masses d'air",p:"Thème 1 · Vent et fronts",th:1},
 {k:"H",t:"Nuages et phénomènes dangereux",p:"Thème 1 · Nuages et dangers",th:1},
 {k:"I",t:"Les informations météo",p:"Thème 1 · METAR, TAF, cartes",th:1},
 {k:"J",t:"Cellule et motorisation",p:"Thème 3 · Structure et moteurs",th:3},
 {k:"K",t:"Les instruments de bord",p:"Thème 3 · Instruments",th:3},
 {k:"L",t:"Hélicoptères, planeurs, ULM et drones",p:"Thème 3 · Autres aéronefs",th:3},
 {k:"M",t:"La navigation",p:"Thème 4 · Navigation",th:4},
 {k:"N",t:"La réglementation",p:"Thème 4 · Règles de l'air",th:4},
 {k:"O",t:"Sécurité et facteurs humains",p:"Thème 4 · Sécurité",th:4},
 {k:"P",t:"Histoire de l'aviation",p:"Thème 5 · Aviation",th:5},
 {k:"Q",t:"Histoire de l'espace",p:"Thème 5 · Espace",th:5},
 {k:"R",t:"Culture aéronautique et spatiale",p:"Thème 5 · Culture",th:5},
 {k:"S",t:"Anglais aéronautique",p:"Option · Anglais",th:6}
];
var THEMES=[
 {n:1,t:"Météorologie et aérologie",short:"Météo"},
 {n:2,t:"Aérodynamique, aérostatique et principes du vol",short:"Vol"},
 {n:3,t:"Aéronefs et engins spatiaux",short:"Aéronefs"},
 {n:4,t:"Navigation, réglementation et sécurité",short:"Navigation"},
 {n:5,t:"Histoire et culture aéronautiques et spatiales",short:"Histoire"},
 {n:6,t:"Option : anglais aéronautique",short:"Anglais",opt:true}
];
var RAW=[];
function Q(k,q,c,a,h,s,f,src){RAW.push({k:k,q:q,c:c,a:a,h:h,s:s,f:f,src:src});}

/* ---------- A. L'aile et la portance ---------- */
Q("A","La portance est une force…",["parallèle au vent relatif, dans le sens du mouvement","perpendiculaire au vent relatif","toujours dirigée vers le sol","dirigée selon l'axe du fuselage"],1,
 "Elle ne freine pas l'avion : c'est le rôle d'une autre force.",
 "La résultante aérodynamique se décompose en deux forces : la portance, perpendiculaire au vent relatif, et la traînée, parallèle au vent relatif et opposée à l'avancement.");
Q("A","La traînée est une force…",["perpendiculaire au vent relatif","dirigée dans le sens du mouvement de l'avion","parallèle au vent relatif, qui s'oppose à l'avancement","qui n'existe qu'au décollage"],2,
 "Tout corps qui avance dans l'air le sent se freiner.",
 "La traînée résiste à l'avancement. Elle existe à toutes les phases du vol, car tout objet qui se déplace dans l'air en subit une.");
Q("A","La corde d'un profil d'aile est la ligne droite qui relie…",["l'extrados à l'intrados","le bord d'attaque au bord de fuite","le saumon à l'emplanture","le haut de la dérive au fuselage"],1,
 "Elle traverse le profil dans sa longueur, de l'avant vers l'arrière.",
 "Le profil est la coupe de l'aile. Bord d'attaque : avant. Bord de fuite : arrière. Corde : segment qui joint les deux. Extrados : dessus. Intrados : dessous.");
Q("A","L'extrados est…",["la face inférieure de l'aile","la face supérieure de l'aile","le bord arrière de l'aile","l'extrémité de l'aile"],1,
 "C'est la face qui regarde le ciel.",
 "Extrados = dessus, intrados = dessous. L'extrémité de l'aile s'appelle le saumon, sa jonction avec le fuselage l'emplanture.");
Q("A","L'angle d'incidence est l'angle entre…",["la corde du profil et le vent relatif","l'axe du fuselage et l'horizon","l'aile et le sol","la corde du profil et la verticale"],0,
 "Il compare l'orientation de l'aile avec la direction d'où vient l'air.",
 "Ne pas confondre : incidence (corde / vent relatif), assiette (axe de l'avion / horizon) et pente (trajectoire / horizon).");
Q("A","Dans le domaine de vol normal, quand l'incidence augmente, la portance…",["diminue","augmente","reste constante","s'annule"],1,
 "Plus l'aile « mord » dans l'air, plus elle porte… jusqu'à une limite.",
 "La portance croît avec l'incidence jusqu'à l'incidence critique (de l'ordre de 15° pour beaucoup de profils). Au-delà, l'écoulement se décolle : c'est le décrochage.");
Q("A","Le décrochage se produit quand…",["la vitesse dépasse la vitesse maximale","le moteur s'arrête","l'incidence dépasse l'incidence critique","l'avion vole trop bas"],2,
 "Le facteur déterminant est un angle, pas le moteur.",
 "Le décrochage est un décollement des filets d'air sur l'extrados dû à une incidence trop grande : la portance chute brutalement. Il peut survenir à n'importe quelle vitesse.");
Q("A","Toutes choses égales par ailleurs, si la vitesse double, la portance est multipliée par…",["2","4","8","0,5"],1,
 "Regarde comment la vitesse apparaît dans la formule de la portance.",
 "Rz = ½ × ρ × S × V² × Cz (ρ : masse volumique de l'air, S : surface alaire, V : vitesse, Cz : coefficient de portance). V est au carré : vitesse × 2, portance × 4.");
Q("A","À vitesse et incidence égales, si l'avion monte et que l'air devient moins dense, la portance…",["augmente","diminue","ne change pas","devient nulle"],1,
 "Regarde le terme ρ de la formule.",
 "La masse volumique de l'air ρ diminue avec l'altitude. Pour garder la même portance, il faut voler plus vite en altitude (vitesse vraie plus grande).");
Q("A","Une aile de 20 m² donne 10 000 N de portance. À même vitesse et même incidence, une aile de 40 m² donnerait…",["5 000 N","10 000 N","20 000 N","40 000 N"],2,
 "La surface est un simple facteur multiplicatif dans la formule.",
 "Rz est proportionnelle à S : surface × 2, portance × 2 (à vitesse, incidence et densité de l'air identiques).");
Q("A","Sur un profil porteur en vol, la pression sur l'extrados est, par rapport à celle de l'intrados…",["plus forte","identique","plus faible","nulle"],2,
 "L'aile est comme « aspirée » vers le haut.",
 "L'air accélère sur l'extrados et sa pression statique y baisse (dépression). La différence de pression entre intrados et extrados crée la portance, la dépression de l'extrados y contribuant pour la plus grande part.");
Q("A","Selon Bernoulli, quand la vitesse d'un écoulement d'air augmente, sa pression statique…",["augmente","diminue","ne change pas","double"],1,
 "Pense à un rétrécissement dans un tuyau (effet Venturi).",
 "Pression statique + pression dynamique (½ρV²) reste constante dans un écoulement sans échange d'énergie. Si la vitesse augmente, la pression dynamique croît, donc la pression statique baisse.");
Q("A","Un planeur a des ailes longues et étroites (grand allongement). Cette forme sert surtout à…",["augmenter la traînée induite","réduire la traînée induite","diminuer la portance","faciliter le roulage"],1,
 "Les planeurs cherchent à planer le plus loin possible.",
 "Allongement = envergure² / surface. Un grand allongement réduit la traînée induite et améliore la finesse.");
Q("A","La traînée induite est due…",["au frottement de l'air sur le revêtement","à la forme du fuselage","à la création de la portance (tourbillons de bout d'aile)","à l'échauffement du moteur"],2,
 "Le mot « induite » indique qu'elle est la conséquence d'autre chose.",
 "Traînée = parasite (frottement et forme) + induite (liée à la portance, tourbillons marginaux). L'induite est forte à basse vitesse, la parasite à grande vitesse.");

/* ---------- B. Les forces et le vol stabilisé ---------- */
Q("B","En vol rectiligne horizontal à vitesse constante…",["portance = poids et traction = traînée","portance > poids et traction = traînée","portance = traînée et traction = poids","traction > traînée et portance = poids"],0,
 "Aucune accélération, aucune montée : tout s'équilibre.",
 "Vitesse constante : traction = traînée (direction horizontale). Altitude constante : portance = poids (direction verticale).");
Q("B","Les quatre forces qui s'exercent sur un avion en vol sont…",["portance, poids, traction, traînée","portance, masse, vitesse, traînée","poussée, incidence, poids, traînée","portance, finesse, poids, assiette"],0,
 "Deux sont à peu près verticales, deux à peu près horizontales.",
 "Poids (vers le bas), portance (vers le haut), traction ou poussée (vers l'avant), traînée (vers l'arrière).");
Q("B","Le poids de l'avion s'applique…",["au centre de poussée, vers le haut","au centre de gravité, vers le bas","au bord d'attaque, vers l'avant","à l'hélice, vers l'arrière"],1,
 "Il est dirigé vers le centre de la Terre.",
 "Poids = masse × g (g ≈ 9,81 m/s²). Il s'applique au centre de gravité, à la verticale, vers le bas.");
Q("B","La finesse d'un avion est le rapport…",["poids / portance","vitesse / traînée","portance / traînée","traction / poids"],2,
 "Plus ce rapport est grand, mieux l'avion plane.",
 "Finesse f = Rz / Rx = Cz / Cx. En vol plané rectiligne en air calme, f = distance parcourue / hauteur perdue.");
Q("B","Un planeur de finesse 30 part de 1 000 m de hauteur en air calme. Il peut parcourir au maximum environ…",["3,3 km","30 km","300 km","33 m"],1,
 "Distance = finesse × hauteur.",
 "f = d / h, donc d = 30 × 1 000 m = 30 000 m = 30 km. Hypothèse : air calme (une ascendance ou le vent changent le résultat).");
Q("B","En vol plané stabilisé, ce qui remplace la traction du moteur, c'est…",["la portance seule","une composante du poids","l'effet de sol","la pression dynamique"],1,
 "Sans moteur, l'avion avance quand même : qui le tire ?",
 "En descente, le poids possède une composante dans le sens de la trajectoire qui compense la traînée. C'est ce qui fait avancer un planeur.");
Q("B","En montée stabilisée à vitesse constante, par rapport au vol horizontal, la traction doit être…",["plus faible que la traînée","égale à la traînée","supérieure à la traînée","nulle"],2,
 "Une partie du poids tire l'avion vers l'arrière.",
 "En montée, une composante du poids s'oppose à l'avancement : traction = traînée + composante du poids.");
Q("B","Si la masse de l'avion augmente, sa vitesse de décrochage…",["diminue","augmente","ne change pas","devient nulle"],1,
 "Plus l'avion est lourd, plus il faut de portance pour le soutenir.",
 "Pour équilibrer un poids plus grand, il faut plus de portance, donc plus de vitesse (à l'incidence critique). La vitesse de décrochage augmente avec la charge alaire (poids / surface).");
Q("B","Quand la vitesse augmente, la traînée parasite (frottement et forme)…",["diminue","augmente","est nulle","ne varie pas"],1,
 "Elle croît avec le carré de la vitesse.",
 "La traînée parasite croît comme V². La traînée induite diminue quand la vitesse augmente. La traînée totale est minimale à une vitesse intermédiaire.");
Q("B","En virage incliné à altitude constante, la portance doit être…",["inférieure au poids","égale au poids","supérieure au poids","nulle"],2,
 "Une partie de la portance sert à faire tourner l'avion.",
 "La portance est inclinée : sa composante verticale doit toujours équilibrer le poids, donc la portance totale dépasse le poids. Le facteur de charge devient supérieur à 1.");
Q("B","Le facteur de charge n est le rapport…",["poids / portance","portance / poids","traction / traînée","vitesse / vitesse de décrochage"],1,
 "En palier rectiligne, il vaut exactement 1.",
 "n = portance / poids. En palier rectiligne n = 1. En virage à 60° d'inclinaison et altitude constante, n = 1 / cos 60° = 2.");
Q("B","Plus la finesse d'un planeur est grande, plus sa pente de descente est…",["forte","faible","verticale","égale à 45°"],1,
 "Un bon planeur perd peu de hauteur par kilomètre.",
 "Pente ≈ 1 / finesse. Finesse 30 : pente de 1/30, soit environ 3,3 %.");
Q("B","Le point d'application de la portance sur l'aile est…",["le centre de gravité","le centre de poussée","le bord d'attaque","le saumon"],1,
 "Ce n'est pas le point où s'applique le poids.",
 "Le centre de poussée est le point d'application de la résultante aérodynamique. Sa position varie avec l'incidence.");
Q("B","Le vent relatif a…",["la direction de la trajectoire et le sens opposé au mouvement","la direction de l'axe du fuselage et le même sens que le mouvement","la direction verticale","la direction de l'horizon artificiel"],0,
 "Si tu avances vers l'est, d'où te vient l'air par rapport à toi ?",
 "Le vent relatif est l'écoulement de l'air par rapport à l'avion : même direction que la trajectoire, sens opposé.");

/* ---------- C. Axes et commandes de vol ---------- */
Q("C","Le mouvement de roulis se fait autour de l'axe…",["longitudinal (du nez à la queue)","transversal (d'un bout d'aile à l'autre)","vertical","de l'hélice seulement"],0,
 "Imagine une brochette qui traverse le fuselage dans sa longueur.",
 "Roulis : axe longitudinal, ailerons. Tangage : axe transversal, gouverne de profondeur. Lacet : axe vertical, gouverne de direction.");
Q("C","Le tangage (le nez monte ou descend) est commandé par…",["les ailerons","la gouverne de direction","la gouverne de profondeur","les volets"],2,
 "Elle est située sur l'empennage horizontal.",
 "La gouverne de profondeur, commandée par le manche d'avant en arrière, contrôle le mouvement autour de l'axe transversal.");
Q("C","Le palonnier, actionné par les pieds, commande…",["les ailerons","la gouverne de direction (lacet)","la gouverne de profondeur","les volets"],1,
 "Ce sont les pieds du pilote qui agissent dessus.",
 "Le palonnier agit sur la gouverne de direction, placée sur la dérive : il contrôle le mouvement de lacet.");
Q("C","En tirant le manche vers l'arrière, la gouverne de profondeur se lève et le nez de l'avion…",["descend","monte","tourne à gauche","ne bouge pas"],1,
 "Tirer le manche, c'est cabrer.",
 "Profondeur vers le haut : l'empennage reçoit une force vers le bas, ce qui fait monter le nez (cabré). Pousser le manche fait piquer.");
Q("C","Pour provoquer un roulis à droite, l'aileron droit…",["se baisse et le gauche se lève","se lève et le gauche se baisse","et le gauche se lèvent ensemble","reste neutre"],1,
 "L'aile qui descend est celle qui porte moins.",
 "Aileron levé : portance réduite, l'aile descend. Aileron baissé : portance augmentée, l'aile monte. Les deux ailerons travaillent en opposition.");
Q("C","Les volets de courbure sortis à l'atterrissage servent à…",["augmenter la vitesse de décrochage","diminuer la vitesse de décrochage et voler plus lentement","supprimer la traînée","diriger l'avion"],1,
 "Ils augmentent la surface et la courbure de l'aile.",
 "Les volets (hypersustentateurs) augmentent la portance, et aussi la traînée, à basse vitesse. La vitesse de décrochage baisse : approches plus lentes et atterrissages plus courts.");
Q("C","Les aérofreins (spoilers) servent à…",["augmenter la portance","diminuer la portance et augmenter la traînée","faire monter l'avion","améliorer la finesse"],1,
 "On les sort pour perdre de la hauteur ou ralentir.",
 "Les aérofreins, dressés sur l'extrados, détruisent une partie de la portance et augmentent la traînée.");
Q("C","Le compensateur (trim) permet…",["d'augmenter la puissance du moteur","de supprimer l'effort que le pilote exerce sur le manche","de sortir le train d'atterrissage","de réduire la traînée induite"],1,
 "Il soulage le pilote pendant un vol stabilisé.",
 "Une petite surface mobile sur la gouverne (ou un réglage équivalent) équilibre les efforts : le pilote n'a plus à tenir le manche.");
Q("C","L'empennage horizontal contribue surtout à la stabilité en…",["roulis","tangage","lacet","vitesse"],1,
 "Pense à l'empennage d'une flèche.",
 "L'empennage horizontal (stabilisateur et profondeur) assure la stabilité en tangage ; la dérive assure la stabilité en lacet.");
Q("C","La dérive (empennage vertical) contribue surtout à la stabilité en…",["tangage","roulis","lacet","incidence"],2,
 "Elle empêche le nez de partir de côté.",
 "La dérive maintient l'avion dans l'axe du vent relatif. La gouverne de direction, articulée sur la dérive, commande le lacet.");

/* ---------- D. L'aérostation ---------- */
Q("D","La poussée d'Archimède subie par un ballon est égale…",["au poids de l'air déplacé","au poids du gaz qu'il contient","à la pression atmosphérique","au poids du ballon"],0,
 "Elle dépend du fluide que le ballon repousse.",
 "Tout corps plongé dans un fluide subit une poussée verticale, vers le haut, égale au poids du volume de fluide qu'il déplace.");
Q("D","Un ballon libre monte lorsque…",["son poids total est supérieur à la poussée d'Archimède","la poussée d'Archimède est supérieure à son poids total","la poussée est nulle","il est immobile"],1,
 "Compare les deux forces verticales.",
 "Poussée d'Archimède > poids total (enveloppe, nacelle, charge, gaz) : le ballon monte. Égalité : il flotte à altitude constante.");
Q("D","Une montgolfière s'élève parce que l'air chauffé de son enveloppe est…",["plus dense que l'air extérieur","moins dense que l'air extérieur","aussi dense que l'air extérieur","remplacé par de l'hydrogène"],1,
 "L'air chaud se dilate.",
 "Chauffé, l'air se dilate : à volume égal, il pèse moins que l'air extérieur. La poussée d'Archimède l'emporte sur le poids total.");
Q("D","Pour monter, le pilote d'une montgolfière…",["ouvre la soupape","allume le brûleur","largue du lest d'hydrogène","coupe le brûleur"],1,
 "Il réchauffe l'air de l'enveloppe.",
 "Brûleur : l'air chauffe, le ballon monte. Pour descendre, on laisse l'air refroidir ou on ouvre la soupape (parachute) pour évacuer de l'air chaud.");
Q("D","Quel gaz, inflammable, Jacques Charles a-t-il utilisé en 1783 pour gonfler son ballon ?",["l'hélium","l'hydrogène","l'azote","le dioxyde de carbone"],1,
 "C'est le gaz le plus léger qui existe.",
 "L'hydrogène est très léger mais inflammable (catastrophe du dirigeable Hindenburg en 1937). L'hélium, un peu plus lourd, est ininflammable et sert aujourd'hui.");
Q("D","Pour descendre, le pilote d'un ballon à gaz…",["largue du lest","évacue du gaz par la soupape","allume le brûleur","chauffe le gaz"],1,
 "Il faut alourdir le ballon par rapport à l'air déplacé : que retire-t-on ?",
 "Ballon à gaz : soupape pour descendre (perdre du gaz), lest (sable) largué pour monter.");
Q("D","Un pilote de ballon libre peut choisir…",["sa route horizontale librement","seulement son altitude : sa route dépend du vent","uniquement sa vitesse","rien du tout"],1,
 "Il n'a ni moteur ni gouvernail.",
 "Un ballon libre dérive avec le vent. En changeant d'altitude, le pilote cherche une couche d'air qui va dans la direction souhaitée.");
Q("D","Quand un ballon à gaz monte, la pression extérieure diminue, donc le gaz de l'enveloppe…",["se comprime","se dilate (son volume augmente)","se liquéfie","disparaît"],1,
 "Moins de pression autour, plus de place pour le gaz.",
 "Pression extérieure en baisse : le volume du gaz augmente. C'est pourquoi une enveloppe à gaz n'est pas entièrement gonflée au sol.");
Q("D","Un dirigeable se distingue d'un ballon libre par…",["une enveloppe plus grande","sa propulsion et ses gouvernes","un gaz plus lourd que l'air","l'absence de nacelle"],1,
 "Le mot « dirigeable » indique ce qu'il sait faire.",
 "Un dirigeable est un ballon muni de moteurs et de gouvernes : il peut choisir sa route. Il existe en versions souple, semi-rigide ou rigide (Zeppelin).");
Q("D","La masse volumique de l'air au niveau de la mer est d'environ…",["0,001 kg/m³","1,2 kg/m³","12 kg/m³","1 200 kg/m³"],1,
 "Un mètre cube d'air pèse un peu plus d'un kilogramme.",
 "ρ ≈ 1,225 kg/m³ à 15 °C au niveau de la mer (atmosphère standard). Elle diminue avec l'altitude.");
Q("D","Un mètre cube d'hélium (ρ ≈ 0,18 kg/m³) dans l'air (ρ ≈ 1,2 kg/m³) peut soulever environ…",["0,2 kg","1 kg","10 kg","100 kg"],1,
 "Fais la différence des deux masses volumiques.",
 "Force ascensionnelle par m³ = ρ air − ρ gaz ≈ 1,2 − 0,18 ≈ 1 kg.");
Q("D","Un ballon de 1 000 m³ déplace une masse d'air d'environ…",["12 kg","120 kg","1 200 kg","12 000 kg"],2,
 "Masse = masse volumique × volume.",
 "m = 1,2 kg/m³ × 1 000 m³ ≈ 1 200 kg. La poussée d'Archimède vaut environ 1 200 × 9,81 ≈ 11 800 N.");
Q("D","Quelle fut la première ascension humaine en vol libre, le 21 novembre 1783 ?",["un ballon à hydrogène de Charles","la montgolfière de Pilâtre de Rozier et du marquis d'Arlandes","un dirigeable Zeppelin","un ballon à l'hélium"],1,
 "C'est un ballon à air chaud, inventé par deux frères.",
 "Le 21 novembre 1783, Pilâtre de Rozier et le marquis d'Arlandes volent en montgolfière. Le 1er décembre 1783, Charles et Robert volent en ballon à hydrogène.");

/* ---------- E. Le vol spatial ---------- */
Q("E","Une fusée avance grâce au principe…",["d'Archimède","de l'action et de la réaction","de Bernoulli","de la portance"],1,
 "Elle éjecte quelque chose vers l'arrière.",
 "La fusée éjecte des gaz à grande vitesse vers l'arrière (action) et reçoit une poussée vers l'avant (réaction) : c'est la 3e loi de Newton.");
Q("E","Une fusée peut fonctionner dans le vide parce qu'elle emporte…",["de l'air comprimé uniquement","son carburant et son comburant","des hélices spéciales","des ailes repliables"],1,
 "Il n'y a pas d'oxygène dans l'espace.",
 "Les ergols sont le carburant et le comburant (l'oxygène). Une fusée n'a besoin ni d'air ni d'hélice.");
Q("E","Un lanceur est constitué d'étages afin de…",["augmenter sa traînée","larguer les masses devenues inutiles","chauffer les ergols","ralentir la montée"],1,
 "Une fois un réservoir vide, il ne sert plus qu'à alourdir.",
 "Un étage vide est largué : la fusée n'a plus à accélérer cette masse inutile, ce qui améliore le rendement.");
Q("E","Pour se placer en orbite basse autour de la Terre, un satellite doit atteindre une vitesse d'environ…",["8 km/h","80 km/h","8 km/s","300 km/s"],2,
 "Beaucoup plus vite qu'un avion de ligne (environ 900 km/h).",
 "En orbite basse, la vitesse est d'environ 7,8 km/s, soit près de 28 000 km/h.");
Q("E","En orbite, un satellite…",["est en chute libre permanente autour de la Terre","n'est plus attiré par la Terre","n'est attiré que par la Lune","est porté par l'air"],0,
 "La Terre l'attire toujours, même à 400 km.",
 "Sa vitesse horizontale est assez grande pour que, en tombant, il suive la courbure de la Terre sans jamais l'atteindre.");
Q("E","Un satellite géostationnaire se trouve à environ…",["400 km d'altitude, au-dessus des pôles","36 000 km d'altitude, au-dessus de l'équateur","3 600 km d'altitude, à n'importe quelle latitude","100 000 km d'altitude"],1,
 "Il fait un tour en 24 h, comme la Terre.",
 "Altitude d'environ 35 800 km, dans le plan de l'équateur, période de 24 h : le satellite paraît immobile vu du sol. Usages : télécommunications et météo.");
Q("E","La Station spatiale internationale évolue sur une orbite…",["géostationnaire","basse, vers 400 km d'altitude","lunaire","solaire"],1,
 "Elle fait le tour de la Terre en environ 90 minutes.",
 "Orbite basse : entre 200 et 2 000 km environ. L'ISS est vers 400 km et fait un tour de Terre en environ 90 minutes.");
Q("E","Les astronautes de l'ISS flottent parce que…",["la gravité y est nulle","ils sont, avec la station, en chute libre","l'air les porte","la Terre est trop loin"],1,
 "À 400 km d'altitude, la gravité est encore forte.",
 "À 400 km, la gravité vaut encore environ 90 % de celle du sol. L'impression d'apesanteur vient de la chute libre de la station et de ses occupants.");
Q("E","Le centre spatial de Kourou, en Guyane, est bien placé car il est proche…",["du pôle Nord","de l'équateur","de l'Europe","de la Lune"],1,
 "Où la Terre tourne-t-elle le plus vite ?",
 "Près de l'équateur, la rotation de la Terre donne au lanceur une vitesse initiale vers l'est d'environ 460 m/s. Le lancement vers l'est se fait en plus au-dessus de l'océan.");
Q("E","Quel est le premier satellite artificiel de la Terre, lancé en 1957 ?",["Explorer 1","Spoutnik 1","Apollo 11","Vostok 1"],1,
 "Il a été lancé par l'URSS.",
 "Spoutnik 1 : 4 octobre 1957. Vostok 1 (Gagarine) : 12 avril 1961, premier homme dans l'espace. Apollo 11 : juillet 1969, premiers pas sur la Lune.");
Q("E","Au retour sur Terre, une capsule spatiale est protégée par un bouclier thermique car…",["l'espace est très froid","la compression et le frottement de l'air l'échauffent fortement","son moteur surchauffe","la Lune rayonne de la chaleur"],1,
 "Elle entre dans l'atmosphère à environ 28 000 km/h.",
 "À très grande vitesse, l'air est comprimé devant la capsule et la température atteint plusieurs milliers de degrés : il faut un bouclier qui s'use progressivement.");
Q("E","La coiffe d'une fusée sert à…",["fournir la poussée","protéger la charge utile pendant la traversée de l'atmosphère","stocker le carburant","guider la fusée"],1,
 "Elle est larguée quand l'air est assez rare.",
 "La coiffe est un carénage qui abrite le ou les satellites (charge utile) pendant la traversée des couches denses de l'atmosphère. Elle est larguée ensuite.");

/* ---------- F. Atmosphère et pression ---------- */
Q("F","L'air sec qui nous entoure est composé approximativement de…",["78 % d'oxygène et 21 % d'azote","78 % d'azote et 21 % d'oxygène","50 % d'azote et 50 % d'oxygène","21 % d'azote et 78 % d'hydrogène"],1,
 "Le gaz le plus abondant n'est pas celui que l'on respire.",
 "L'air contient environ 78 % d'azote, 21 % d'oxygène et 1 % d'autres gaz (argon, gaz carbonique…). C'est l'oxygène qui permet la respiration et la combustion dans les moteurs.","atmo");
Q("F","Dans quelle couche de l'atmosphère se produisent la plupart des nuages et des phénomènes météo ?",["La stratosphère","La troposphère","La mésosphère","La thermosphère"],1,
 "C'est la couche la plus basse, celle dans laquelle volent les avions de tourisme.",
 "La troposphère s'étend du sol jusqu'à environ 11 km (8 km aux pôles, 16 km à l'équateur). Elle contient presque toute la vapeur d'eau : c'est là que naissent nuages, pluie et vent.","atmo");
Q("F","Quelle couche se trouve juste au-dessus de la troposphère ?",["La mésosphère","La thermosphère","La stratosphère","L'exosphère"],2,
 "Les avions de ligne y volent souvent en croisière.",
 "Dans l'ordre depuis le sol : troposphère, stratosphère, mésosphère, thermosphère. La stratosphère est stable, sans nuages importants, et contient la couche d'ozone.","atmo");
Q("F","À quelle altitude moyenne se trouve la tropopause, limite entre troposphère et stratosphère (atmosphère standard) ?",["2 km","5 km","11 km","50 km"],2,
 "C'est à peu près l'altitude de croisière des avions de ligne.",
 "Dans l'atmosphère standard, la tropopause est placée à 11 000 m (environ 36 000 ft). Sa hauteur réelle varie avec la latitude et la saison.","atmo");
Q("F","Au niveau de la mer, la pression de l'atmosphère standard vaut…",["760 hPa","1013 hPa","1500 hPa","101 hPa"],1,
 "Ce nombre est proche de 1000 hPa.",
 "La pression standard au niveau de la mer est de 1013,25 hPa (hectopascals), soit 760 mm de mercure. Elle sert de référence pour calibrer les instruments.","pressalt");
Q("F","Près du sol, quand on monte d'environ 8 m (27 ft), la pression diminue d'environ…",["0,1 hPa","1 hPa","10 hPa","100 hPa"],1,
 "La pression chute vite au début de la montée.",
 "Près du sol, la pression baisse d'environ 1 hPa tous les 8 m (27 ft). C'est ce principe qui permet à l'altimètre de mesurer l'altitude : il mesure la pression.","pressalt");
Q("F","Dans l'atmosphère standard, de combien la température diminue-t-elle quand on monte de 1000 m ?",["0,65 °C","2 °C","6,5 °C","15 °C"],2,
 "À 11 km, la température standard est d'environ −56 °C, en partant de +15 °C.",
 "Le gradient standard est de −6,5 °C par 1000 m (environ −2 °C par 1000 ft). On le retrouve en montant : +15 °C au sol, −56,5 °C à la tropopause.","tempstd");
Q("F","Quel instrument mesure la pression atmosphérique ?",["Le thermomètre","Le baromètre","L'anémomètre","L'hygromètre"],1,
 "Le préfixe « baro » vient du grec pour « poids ».",
 "Le baromètre mesure la pression. L'altimètre d'un avion est en réalité un baromètre gradué en altitude. L'anémomètre mesure le vent, l'hygromètre l'humidité.");
Q("F","En aéronautique européenne, la pression est exprimée en…",["hectopascals (hPa)","kilogrammes","nœuds","mètres par seconde"],0,
 "Le préfixe « hecto » veut dire cent.",
 "L'unité de pression est le pascal ; le hectopascal (100 Pa) est utilisé en aviation en Europe. Les États-Unis utilisent encore des pouces de mercure (inHg).","unites");
Q("F","Quand le pilote cale son altimètre au QNH, celui-ci indique…",["la hauteur au-dessus de l'aérodrome","l'altitude par rapport au niveau de la mer","la pression à l'extérieur","la vitesse verticale"],1,
 "Le QNH est une pression ramenée au niveau de la mer.",
 "Au QNH, l'altimètre donne l'altitude (par rapport au niveau moyen de la mer). Posé sur l'aérodrome, il indique alors l'altitude de l'aérodrome. Le QNH est fourni par le contrôle ou l'ATIS.","calages");
Q("F","Avec le calage QFE, que lit-on sur l'altimètre d'un avion posé sur la piste ?",["0 (zéro)","l'altitude de l'aérodrome","1013","15"],0,
 "Le QFE est la pression mesurée à l'aérodrome.",
 "Avec le QFE, l'altimètre indique la hauteur au-dessus de l'aérodrome : zéro posé sur la piste. Il est surtout utile pour le circuit d'aérodrome.","calages");
Q("F","Les niveaux de vol (FL) sont calculés avec un calage altimétrique de…",["1013 hPa (calage standard)","QNH local","QFE","0 hPa"],0,
 "Tous les avions doivent utiliser la même référence en croisière.",
 "En route, tous les pilotes calent 1013 hPa : ainsi les altitudes sont comparables et les avions restent séparés. FL 100 correspond à 10 000 ft environ.","calages");

/* ---------- G. Vent et masses d'air ---------- */
Q("G","À l'origine, le vent est un déplacement d'air…",["des basses pressions vers les hautes pressions","des hautes pressions vers les basses pressions","du nord vers le sud uniquement","de la mer vers la terre uniquement"],1,
 "L'air cherche à égaliser les pressions, comme l'eau qui descend une pente.",
 "L'air se déplace de l'anticyclone (hautes pressions) vers la dépression (basses pressions). La rotation de la Terre (force de Coriolis) dévie ensuite ce mouvement.","ventpr");
Q("G","Dans l'hémisphère nord, le vent tourne autour d'un anticyclone…",["dans le sens des aiguilles d'une montre","dans le sens inverse des aiguilles d'une montre","en ligne droite","du centre vers l'extérieur sans tourner"],0,
 "Autour d'une dépression, c'est l'inverse.",
 "Dans l'hémisphère nord, la circulation est horaire autour d'un anticyclone (A) et anti-horaire autour d'une dépression (D). Dans l'hémisphère sud, c'est l'inverse.","anticy");
Q("G","Sur une carte météo, des isobares très serrées indiquent…",["un vent faible","l'absence de vent","un vent fort","un brouillard certain"],2,
 "Plus la pression change vite sur une courte distance, plus l'air est « poussé ».",
 "Les isobares relient les points de même pression. Serrées, elles traduisent un fort gradient de pression et donc un vent fort ; espacées, un vent faible.","anticy");
Q("G","Un vent « de nord-ouest » souffle…",["vers le nord-ouest","depuis le nord-ouest","depuis le sud-est","vers l'est"],1,
 "Pour un marin comme pour un pilote, on donne l'origine du vent.",
 "La direction du vent indique d'où il vient. Un vent de 270° vient de l'ouest et souffle vers l'est. Un METAR donne cette direction en degrés par rapport au nord géographique.","vents3");
Q("G","1 nœud (kt) correspond à environ…",["0,5 km/h","1,85 km/h","3,6 km/h","10 km/h"],1,
 "Un nœud, c'est un mille nautique par heure.",
 "1 kt = 1 mille nautique par heure = 1,852 km/h (environ 0,5 m/s). 100 kt font donc environ 185 km/h.","unites");
Q("G","Le jour, au bord de la mer, la brise souffle en général…",["de la terre vers la mer","de la mer vers la terre","uniquement le long de la côte","du ciel vers le sol"],1,
 "Le sol se réchauffe plus vite que la mer.",
 "Le jour, la terre chauffée réchauffe l'air, qui monte ; de l'air plus frais venu de la mer le remplace : c'est la brise de mer. La nuit, le phénomène s'inverse (brise de terre).","brisemer");
Q("G","Pourquoi décolle-t-on de préférence face au vent ?",["pour consommer moins de carburant en croisière","parce que la vitesse nécessaire est atteinte avec une vitesse sol plus faible, donc sur une distance plus courte","parce que le vent pousse l'avion vers l'avant","pour mieux voir la piste"],1,
 "C'est la vitesse par rapport à l'air qui compte pour la portance.",
 "La portance dépend de la vitesse par rapport à l'air. Avec un vent de face, l'avion atteint cette vitesse en roulant moins vite par rapport au sol : décollage et atterrissage plus courts.","facevent");
Q("G","Par vent fort traversant une chaîne de montagnes, où trouve-t-on les turbulences (rotors, ondes) ?",["sur la face exposée au vent seulement","côté sous le vent, derrière le relief","uniquement au sommet","il n'y a jamais de turbulence en montagne"],1,
 "L'air « retombe » derrière l'obstacle.",
 "Après avoir franchi le relief, l'air forme des ondes et des rotors sous le vent : fortes descendances et turbulences. Il faut rester prudent et garder de la marge d'altitude.","onde");
Q("G","Un vent de face est un vent qui souffle…",["dans le même sens que la route de l'avion","dans le sens opposé à la route de l'avion","perpendiculairement à la route","uniquement vers le haut"],1,
 "Il réduit la vitesse sol mais pas la vitesse air.",
 "Vent de face : il vient de devant, réduit la vitesse par rapport au sol. Vent arrière : il pousse l'avion, augmente la vitesse sol. Vent de travers : perpendiculaire, il fait dériver l'avion.","vents3");
Q("G","Un front est…",["une zone de brouillard","la surface de séparation entre deux masses d'air de caractéristiques différentes","une ligne de nuages d'orage uniquement","un anticyclone très étendu"],1,
 "Une masse d'air est chaude et humide, ou froide et sèche, selon son origine.",
 "Un front sépare une masse d'air chaud d'une masse d'air froid. On distingue front froid et front chaud selon la masse qui avance. Les phénomènes météo y sont plus marqués.","fronts");
Q("G","Le passage d'un front froid s'accompagne souvent de…",["pluie fine continue pendant 24 h","grains, averses, parfois orages, et d'un net refroidissement","ciel clair et vent nul","brouillard persistant"],1,
 "L'air froid pousse brusquement l'air chaud vers le haut.",
 "Dans un front froid, l'air froid soulève brutalement l'air chaud : cumulonimbus, averses, rafales, orages, puis ciel de traîne. Les phénomènes sont violents mais courts.","frontfroid");
Q("G","Avant un front chaud, on observe généralement…",["des orages violents","des nuages en couches (cirrus, puis stratus) et une pluie continue","un ciel toujours dégagé","de la grêle seulement"],1,
 "L'air chaud glisse doucement au-dessus de l'air froid.",
 "L'air chaud monte en pente douce au-dessus de l'air froid : cirrus, puis cirrostratus, altostratus, nimbostratus. Pluie régulière et plafond bas qui s'abaisse peu à peu.","frontchaud");

/* ---------- H. Nuages et phénomènes dangereux ---------- */
Q("H","Un nuage est formé de…",["fumée et poussières","fines gouttelettes d'eau et/ou cristaux de glace en suspension","vapeur d'eau invisible","azote liquide"],1,
 "La vapeur d'eau est invisible : le nuage, lui, se voit.",
 "Quand l'air humide s'élève, il se refroidit ; la vapeur d'eau se condense en minuscules gouttes (ou cristaux de glace) autour de noyaux de condensation : c'est le nuage.","condens");
Q("H","Un cumulus est un nuage…",["en nappe grise très basse","à développement vertical, aux contours bourgeonnants","fin et filamenteux, très haut","en forme de lentille collée à la montagne"],1,
 "Pense à un chou-fleur blanc dans un ciel d'été.",
 "Les cumulus naissent des ascendances thermiques. Ils indiquent de l'air instable et sont recherchés par les pilotes de planeur. Trop développés, ils deviennent des cumulonimbus.","nuages");
Q("H","Quel nuage est associé aux orages, à la grêle et aux fortes turbulences ?",["Le cirrus","Le stratus","Le cumulus de beau temps","Le cumulonimbus"],3,
 "Le suffixe « nimbus » signifie nuage de pluie.",
 "Le cumulonimbus (Cb) est un nuage d'orage très haut, avec foudre, grêle, givrage, turbulences extrêmes et cisaillement. C'est le nuage le plus dangereux pour un aéronef.","nuages");
Q("H","Un stratus est…",["un nuage bas en nappe grise uniforme","un nuage d'orage","un nuage de glace très haut","un nuage de forme lenticulaire"],0,
 "« Stratus » vient du latin « étendu en couche ».",
 "Le stratus est une couche grise et uniforme, très basse, qui peut donner de la bruine. Il réduit le plafond et la visibilité, ce qui complique les vols à vue.","nuages");
Q("H","Les cirrus, nuages blancs et filamenteux très élevés, sont composés de…",["gouttes d'eau chaude","cristaux de glace","poussières volcaniques","sable"],1,
 "À plus de 6000 m, la température est très basse.",
 "Les nuages élevés (cirrus, cirrostratus, cirrocumulus) se forment à plus de 6000 m et sont constitués de cristaux de glace. Ils annoncent parfois l'arrivée d'un front chaud.","nuages");
Q("H","On parle de brouillard lorsque la visibilité est inférieure à…",["100 m","1000 m","5000 m","10 km"],1,
 "Au-dessus de ce seuil, on parle de brume.",
 "Brouillard : visibilité inférieure à 1000 m. Brume : visibilité entre 1000 m et 5000 m. Dans les deux cas, l'humidité est élevée.","visib");
Q("H","Pourquoi le givrage est-il dangereux pour un avion ?",["il rend l'avion plus léger","il alourdit l'avion et déforme le profil de l'aile : moins de portance, plus de traînée","il améliore l'écoulement de l'air","il ne concerne que les hélicoptères"],1,
 "La glace modifie la forme de l'aile.",
 "La glace s'accumule sur le bord d'attaque, les hélices et les prises d'air. Elle augmente le poids, réduit la portance et la poussée. Elle se forme surtout dans les nuages entre 0 °C et −20 °C.","givrage");
Q("H","Face à un cumulonimbus, que doit faire le pilote ?",["le traverser rapidement par le centre","le contourner largement","passer juste en dessous pour se protéger","voler juste au-dessus"],1,
 "Aucun avion léger n'est conçu pour résister à un orage.",
 "Il faut éviter un Cb avec une grande marge : grêle, turbulences et rafales peuvent s'étendre loin du nuage, y compris sous l'enclume. Un détour de plusieurs dizaines de kilomètres est normal.","nuages");
Q("H","Le cisaillement de vent (windshear) est…",["un vent régulier de face","un changement brusque de vitesse ou de direction du vent sur une courte distance","un nuage en forme de coin","un type de brouillard"],1,
 "L'avion perd ou gagne de la vitesse en quelques secondes.",
 "Le cisaillement est particulièrement dangereux à l'atterrissage et au décollage, quand l'avion est lent et proche du sol. Il apparaît sous les orages et près des reliefs.","cisaillement");
Q("H","Pour monter sans moteur, un planeur utilise notamment…",["les ascendances thermiques (air chaud qui s'élève)","la poussée de l'hélice","le vent de face seulement","la rotation de la Terre"],0,
 "Le sol chauffé par le Soleil réchauffe l'air qui le touche.",
 "L'air chauffé au sol forme des bulles qui montent : ce sont les thermiques. Les cumulus marquent souvent leur sommet. Le pilote spirale dedans pour gagner de l'altitude.","thermique");
Q("H","Quand l'air est saturé en vapeur d'eau, son humidité relative vaut…",["0 %","50 %","80 %","100 %"],3,
 "À ce stade, l'air ne peut plus contenir de vapeur supplémentaire.",
 "L'humidité relative est le rapport entre la vapeur présente et la quantité maximale possible à cette température. À 100 %, l'air est saturé et la vapeur se condense en gouttelettes.","rosee");
Q("H","Quand l'écart entre la température et le point de rosée devient très faible, il y a un risque de…",["tempête de sable","brouillard ou nuages bas","gel au sol uniquement","forte turbulence thermique"],1,
 "L'air est presque saturé.",
 "Le point de rosée est la température à laquelle l'air devient saturé. Si l'air se refroidit (la nuit) jusqu'à ce point, la vapeur se condense : brouillard ou nuages bas.","rosee");

/* ---------- I. Informations météo ---------- */
Q("I","Le TAF est…",["l'observation météo en temps réel d'un aérodrome","la prévision météo d'un aérodrome pour quelques heures","la carte des vents en altitude","un avertissement d'orage"],1,
 "L'observation s'appelle METAR ; la prévision a un autre nom.",
 "METAR = observation (ce qui se passe maintenant). TAF = prévision pour l'aérodrome, valable de 9 à 30 heures selon l'aérodrome.","metar");
Q("I","Dans un METAR, « 24012KT » signifie…",["température 24 °C, pression 12 hPa","vent de 240° pour 12 nœuds","24 nuages à 12 000 ft","visibilité de 2400 m"],1,
 "Les trois premiers chiffres sont une direction.",
 "24012KT : vent de 240° (vent d'ouest-sud-ouest) à 12 kt. Le groupe est direction (3 chiffres) + vitesse (2 chiffres) + unité KT. Une rafale s'écrit G (par ex. 24012G25KT).","metar");
Q("I","Dans un METAR, « Q1018 » indique…",["une visibilité de 1018 m","une altitude de 1018 ft","un QNH de 1018 hPa","une température de 18 °C"],2,
 "Le Q fait penser à un calage altimétrique.",
 "Q1018 signifie QNH = 1018 hPa : c'est la valeur à afficher sur l'altimètre pour lire l'altitude.","metar");
Q("I","Dans un METAR, « 9999 » signifie…",["visibilité de 10 km ou plus","visibilité de 999 m","température de 99 °C","vent de 99 kt"],0,
 "C'est la valeur maximale de ce groupe, exprimée en mètres.",
 "La visibilité est donnée en mètres, par pas jusqu'à 9999 ; 9999 signifie 10 km ou plus.","metar");
Q("I","Que signifie « CAVOK » dans un METAR ?",["orage probable avec grêle","ciel entièrement couvert","bonnes conditions : visibilité ≥ 10 km, pas de nuage significatif, pas de phénomène notable","piste fermée"],2,
 "C'est un code positif qui résume plusieurs conditions.",
 "CAVOK (Ceiling And Visibility OK) : visibilité 10 km ou plus, pas de nuage sous 5000 ft ni de Cb, pas de précipitation ni de phénomène significatif.","metar");
Q("I","Dans un message météo, « OVC » indique un ciel…",["dégagé","avec 1 à 2 octas de nuages","couvert (8 octas)","avec du brouillard"],2,
 "On mesure la couverture nuageuse en huitièmes de ciel.",
 "La nébulosité se compte en octas (huitièmes) : FEW 1-2, SCT 3-4, BKN 5-7, OVC 8 octas (ciel entièrement couvert).","octas");
Q("I","« FEW030 » dans un METAR signifie…",["quelques nuages (1 à 2 octas) à 3000 ft","30 nuages dispersés","ciel couvert à 300 ft","un vent faible de 30 kt"],0,
 "FEW veut dire « peu ». Les trois chiffres sont en centaines de pieds.",
 "FEW030 : 1 à 2 octas de nuages dont la base est à 3000 ft (030 × 100 ft). Le plafond est la base de la plus basse couche BKN ou OVC.","octas");
Q("I","Un SIGMET est…",["un avertissement de phénomènes météo dangereux pour les aéronefs en route","un type de nuage","un code d'urgence radio","une prévision de vent à l'aérodrome"],0,
 "Il prévient d'orages intenses, turbulences fortes, givrage sévère…",
 "Le SIGMET est un message d'alerte sur une zone : orages, turbulences ou givrage sévères, cendres volcaniques… Pour les aérodromes, on parle d'AIRMET (basses couches) ou d'avertissement d'aérodrome.");
Q("I","L'ATIS est…",["un radar météo embarqué","une diffusion radio continue de la météo et des informations d'un aérodrome","un type d'orage","un instrument de bord"],1,
 "Le pilote l'écoute avant d'appeler la tour.",
 "L'ATIS diffuse en boucle (VHF) la météo, la piste en service et le QNH, avec une lettre d'identification. Le pilote l'écoute pour limiter la charge radio du contrôleur.");
Q("I","Dans un METAR, les heures sont exprimées en…",["heure locale","UTC (heure universelle), suffixe Z","heure d'été uniquement","heure de l'aéroport d'arrivée"],1,
 "Le suffixe Z signifie « Zoulou ».",
 "L'aviation utilise le temps universel coordonné (UTC) pour éviter les confusions entre fuseaux horaires. 121030Z se lit : le 12 du mois à 10 h 30 UTC.","metar");
Q("I","Sur une carte du temps, un front froid est tracé avec des…",["triangles (bleus)","demi-cercles (rouges)","croix noires","étoiles jaunes"],0,
 "Pense à des dents qui pointent dans le sens de déplacement.",
 "Front froid : triangles bleus. Front chaud : demi-cercles rouges. Front occlus : triangles et demi-cercles violets. Les symboles pointent vers la direction de déplacement.","fronts");

/* ---------- J. Cellule et motorisation ---------- */
Q("J","La cellule d'un avion désigne…",["le moteur seul","la structure : fuselage, ailes, empennage et train d'atterrissage","uniquement l'habitacle","le circuit de carburant"],1,
 "Le mot s'oppose au « groupe motopropulseur ».",
 "La cellule est la structure de l'aéronef : fuselage, voilure, empennage, train d'atterrissage. Les moteurs, instruments et équipements viennent s'y ajouter.","cellule");
Q("J","Dans une aile, quelles pièces donnent sa forme au profil ?",["les longerons","les nervures","le saumon","les ailerons"],1,
 "Elles sont disposées d'avant en arrière, comme les côtes d'un squelette.",
 "Les nervures, placées perpendiculairement à l'envergure, donnent la forme du profil. Le revêtement (toile, tôle ou composite) est fixé dessus.","aileint");
Q("J","Le longeron est…",["la poutre principale de l'aile, qui supporte les efforts de flexion","un instrument de navigation","la partie mobile qui commande le roulis","le réservoir principal"],0,
 "Il court dans le sens de l'envergure.",
 "Le longeron est la poutre principale de l'aile. Il reprend les efforts de flexion quand l'aile porte l'avion. Les gros avions ont souvent deux longerons (avant et arrière).","aileint");
Q("J","Quels matériaux légers et résistants sont de plus en plus utilisés dans les avions modernes ?",["le bois uniquement","le plomb","les matériaux composites (fibre de carbone)","le verre massif"],2,
 "Moins de masse = moins de carburant consommé.",
 "Les composites (fibres de carbone noyées dans une résine) sont légers et très résistants. Ils représentent plus de la moitié de la structure de l'Airbus A350 et du Boeing 787, aux côtés des alliages d'aluminium et de titane.");
Q("J","Dans l'ordre, les quatre temps d'un moteur à pistons sont…",["admission, compression, combustion-détente, échappement","compression, admission, échappement, combustion","combustion, admission, compression, échappement","échappement, combustion, compression, admission"],0,
 "Le mélange d'air et de carburant doit d'abord entrer.",
 "1 admission du mélange, 2 compression, 3 combustion qui pousse le piston (le seul temps moteur), 4 échappement des gaz brûlés. Le cycle se répète plusieurs milliers de fois par minute.","quatretemps");
Q("J","Une hélice sert à…",["freiner l'avion","transformer la puissance du moteur en force de traction","produire de l'électricité uniquement","refroidir le moteur uniquement"],1,
 "Elle fonctionne comme une aile qui tourne.",
 "Chaque pale est un petit profil d'aile. En tournant, elle crée une force dirigée vers l'avant, la traction, qui remplace la poussée d'un réacteur.","helice");
Q("J","Le pas d'une hélice est lié…",["à l'angle de calage de ses pales","au nombre de passagers","à la couleur de l'avion","à la pression au sol"],0,
 "Une hélice à pas variable peut modifier cet angle en vol.",
 "Le pas correspond à l'angle que font les pales avec le plan de rotation. Une hélice à pas variable adapte cet angle : petit pas au décollage, grand pas en croisière.","helice");
Q("J","Dans un turboréacteur, l'air traverse dans l'ordre…",["turbine, chambre de combustion, compresseur, tuyère","compresseur, chambre de combustion, turbine, tuyère","chambre de combustion, compresseur, tuyère, turbine","tuyère, turbine, compresseur, chambre"],1,
 "Il faut d'abord comprimer l'air avant d'y brûler du carburant.",
 "L'air est aspiré, comprimé par le compresseur, mélangé au kérosène et brûlé dans la chambre de combustion. Les gaz font tourner la turbine (qui entraîne le compresseur) puis sont éjectés par la tuyère.","turbo");
Q("J","La poussée d'un réacteur s'explique par le principe…",["d'Archimède","d'action et de réaction (3e loi de Newton)","de Pascal","de la conservation de l'énergie thermique uniquement"],1,
 "Quand on éjecte un gaz vers l'arrière, il se passe quelque chose à l'avant.",
 "Le moteur éjecte des gaz vers l'arrière à grande vitesse ; en réaction, l'avion est poussé vers l'avant. C'est aussi le principe de la fusée, même dans le vide.","turbo");
Q("J","Pourquoi les avions de ligne utilisent-ils des turboréacteurs « à double flux » ?",["ils sont plus économiques et plus silencieux : une grande partie de l'air contourne le cœur du moteur","ils n'ont pas besoin de carburant","ils volent seulement sous 1000 m","ils n'ont pas de compresseur"],0,
 "On voit à l'avant la grande soufflante.",
 "Dans un turbofan, la soufflante accélère un grand débit d'air « froid » qui contourne le moteur et fournit l'essentiel de la poussée. C'est plus efficace et moins bruyant qu'un jet pur.","turbofan");
Q("J","Quel carburant utilise un avion de ligne à turboréacteurs ?",["l'essence automobile","le kérosène (Jet A-1)","le gazole","l'hydrogène exclusivement"],1,
 "C'est un produit pétrolier proche du pétrole lampant.",
 "Les turbomachines brûlent du kérosène (Jet A-1), qui résiste bien au froid de l'altitude. On travaille sur des carburants durables (SAF) pour réduire l'empreinte carbone.");
Q("J","Un moteur à pistons d'avion léger fonctionne généralement avec…",["de l'AVGAS 100LL","du kérosène Jet A-1 uniquement","du gaz naturel","de l'électricité exclusivement"],0,
 "C'est une essence spéciale pour l'aviation.",
 "Les avions à pistons utilisent de l'AVGAS 100LL (essence aviation à indice d'octane élevé). Certains moteurs diesel récents brûlent du Jet A-1.");
Q("J","Un train d'atterrissage « tricycle » comprend…",["une roue avant et deux trains principaux","une roulette de queue","quatre roues alignées","des skis uniquement"],0,
 "Comme un tricycle d'enfant, mais dans un autre sens.",
 "Tricycle : une roue avant (directrice) et deux trains principaux sous les ailes. Il facilite le roulage. Le train classique a deux roues principales et une roulette de queue.","tricycle");
Q("J","Dans un réacteur, le comburant qui permet la combustion du kérosène est…",["l'oxygène de l'air","l'azote de l'air","un réservoir d'oxygène liquide","l'hélium"],0,
 "Une fusée, elle, doit emporter ce comburant avec elle.",
 "Le réacteur puise l'oxygène dans l'air ambiant, donc ne fonctionne que dans l'atmosphère. Une fusée emporte son propre comburant (oxygène liquide) pour voler dans le vide.","turbo");

/* ---------- K. Instruments de bord ---------- */
Q("K","Quel instrument indique la vitesse de l'avion par rapport à l'air ?",["l'altimètre","l'anémomètre (badin)","le variomètre","l'horizon artificiel"],1,
 "Il est relié à la prise Pitot.",
 "L'anémomètre, ou badin, mesure la vitesse par rapport à l'air, en nœuds ou en km/h. Il ne donne pas la vitesse par rapport au sol.","panneau6");
Q("K","L'altimètre fonctionne en mesurant…",["la température extérieure","la pression atmosphérique","la vitesse du vent","l'humidité"],1,
 "Plus on monte, plus ce paramètre diminue.",
 "L'altimètre est un baromètre gradué en pieds ou en mètres : la pression diminue avec l'altitude. C'est pourquoi on le cale au QNH ou à 1013 hPa.","panneau6");
Q("K","Le variomètre indique…",["la vitesse horizontale","la vitesse verticale (montée ou descente)","le cap","le régime moteur"],1,
 "Il se lit en pieds par minute ou en m/s.",
 "Le variomètre indique si l'avion monte, descend ou reste en palier. Il est particulièrement utile pour les planeurs, qui cherchent des ascendances.","panneau6");
Q("K","L'horizon artificiel indique…",["l'attitude de l'avion (assiette et inclinaison)","la direction du nord","l'altitude","la vitesse"],0,
 "Il montre la position de l'avion par rapport à l'horizon.",
 "L'horizon artificiel représente la ligne d'horizon : on lit l'assiette (nez haut ou bas) et l'inclinaison (ailes penchées). Il est essentiel quand on n'a plus de repère extérieur.","panneau6");
Q("K","Le compas magnétique indique…",["le cap magnétique","la route vraie au sol","la vitesse","le QNH"],0,
 "Une aiguille aimantée s'aligne sur le champ magnétique terrestre.",
 "Le compas donne le cap magnétique. Il est sensible aux virages et aux accélérations ; on le combine avec un conservateur de cap (directionnel) plus stable.","panneau6");
Q("K","La prise Pitot mesure…",["la pression totale de l'air qui arrive de face","la température extérieure","uniquement la pression statique","la hauteur au-dessus du sol"],0,
 "Elle est tournée vers l'avant, face au vent relatif.",
 "Le Pitot mesure la pression totale (statique + dynamique). L'anémomètre compare cette pression totale à la pression statique : la différence donne la vitesse.","pitot");
Q("K","Si la prise Pitot est obstruée (glace, insecte), quel instrument devient peu fiable ?",["la montre","l'anémomètre","le compas","le compte-tours"],1,
 "L'instrument qui en dépend pour mesurer la vitesse.",
 "Une prise Pitot obstruée donne une vitesse erronée. C'est pourquoi on la réchauffe électriquement (réchauffage Pitot) et on la vérifie, avec sa housse retirée, lors de la visite prévol.","pitot");
Q("K","Le compte-tours indique…",["la vitesse de l'avion","le régime du moteur en tours par minute","l'altitude","le niveau de carburant"],1,
 "Il indique à quelle vitesse tourne l'hélice ou le moteur.",
 "Le compte-tours (tachymètre) affiche le régime moteur en tr/min. Associé à la pression d'huile et à la température, il permet de surveiller le moteur.");
Q("K","Quels instruments utilisent la prise de pression statique ?",["l'altimètre, le variomètre et l'anémomètre","le compte-tours seulement","le compas seulement","aucun"],0,
 "La pression statique est celle de l'air au repos autour de l'avion.",
 "Altimètre, variomètre et anémomètre sont des instruments anémobarométriques : ils lisent la pression statique et, pour l'anémomètre, la pression totale du Pitot.","pitot");
Q("K","L'indicateur de virage (bille et aiguille) sert à…",["mesurer le taux de virage et vérifier qu'il est bien coordonné","indiquer le carburant","mesurer l'altitude","donner la vitesse du vent"],0,
 "La bille doit rester au centre.",
 "L'aiguille indique le taux de virage, la bille la qualité de la coordination (virage « glissé » ou « dérapé » si la bille est décentrée). Pied à pied : il faut « mettre le pied du côté de la bille ».","panneau6");
Q("K","Sur l'anémomètre d'un avion léger, l'arc vert correspond…",["à la plage de vitesses d'utilisation normale","à la vitesse de décrochage uniquement","au régime moteur","à la zone interdite"],0,
 "Le trait rouge, lui, ne doit jamais être dépassé.",
 "Arc vert : utilisation normale. Arc blanc : plage d'utilisation des volets. Arc jaune : prudence (air calme seulement). Trait rouge : VNE, vitesse à ne jamais dépasser.","anemo");

/* ---------- L. Hélicoptères, planeurs, ULM et drones ---------- */
Q("L","L'hélicoptère est un aéronef à…",["voilure fixe","voilure tournante","ballon libre","moteur-fusée"],1,
 "Ses « ailes » tournent.",
 "Les pales du rotor principal sont des ailes tournantes : elles produisent la portance, ce qui permet le vol stationnaire, le décollage et l'atterrissage verticaux.","helico");
Q("L","Le rotor de queue d'un hélicoptère classique sert à…",["compenser la rotation du fuselage provoquée par le rotor principal","ralentir l'appareil","produire la portance principale","refroidir le moteur"],0,
 "Quand le rotor tourne dans un sens, le fuselage veut tourner dans l'autre.",
 "Le rotor principal tourne dans un sens ; par réaction, le fuselage tendrait à tourner dans le sens contraire. Le rotor de queue (anticouple) crée une force latérale qui s'y oppose et sert aussi à orienter le nez.","helico");
Q("L","Le pas collectif modifie…",["l'angle de toutes les pales en même temps : l'hélicoptère monte ou descend","uniquement la direction vers l'avant","la couleur du rotor","la quantité de carburant"],0,
 "On le commande avec le levier à gauche du pilote.",
 "Le pas collectif augmente ou diminue l'angle de toutes les pales simultanément, donc la portance totale : l'hélicoptère monte ou descend.","pas");
Q("L","Le manche de pas cyclique sert à…",["incliner le disque rotor pour faire avancer l'hélicoptère dans une direction","couper le moteur","régler la radio","baisser le train"],0,
 "Il fonctionne comme le manche d'un avion.",
 "Le pas cyclique modifie l'angle des pales de façon différente selon leur position dans le tour. Le disque rotor s'incline et la portance a une composante horizontale : l'hélicoptère avance.","pas");
Q("L","En cas de panne moteur, un hélicoptère peut atterrir en…",["autorotation : l'air qui monte à travers le rotor le fait tourner sans moteur","chute libre","planant grâce à ses ailes","ouvrant un parachute obligatoire"],0,
 "Le pilote baisse immédiatement le pas collectif.",
 "En autorotation, le pilote réduit le pas et laisse l'air traverser le rotor de bas en haut : celui-ci continue de tourner et ralentit la descente. Au dernier moment, le pilote remet du pas pour amortir.","autorot");
Q("L","Comment décolle un planeur ?",["il ne peut pas décoller","remorqué par un avion ou tiré par un treuil","par catapulte uniquement","grâce à un moteur-fusée"],1,
 "Un câble est utilisé dans les deux cas.",
 "Les planeurs sont lancés par remorquage derrière un avion ou par treuil. Certains ont un petit moteur auxiliaire. Une fois largué, le pilote cherche des ascendances.","planeur");
Q("L","Parmi ces aéronefs, lequel a la meilleure finesse ?",["l'hélicoptère","le planeur de performance","la montgolfière","le parachute"],1,
 "Il parcourt beaucoup de distance pour peu d'altitude perdue.",
 "Un planeur moderne a une finesse de 40 à 60 : en perdant 1 m, il avance de 40 à 60 m. Un parapente est autour de 8 à 10, un hélicoptère n'est pas fait pour planer.","finesse");
Q("L","Un paramoteur est…",["un parapente équipé d'un moteur porté dans le dos","un hélicoptère sans pilote","un avion de ligne","un ballon à gaz"],0,
 "La voile est la même que celle d'un parapente.",
 "Un paramoteur est un ULM : une aile souple de type parapente, tractée par une hélice entraînée par un petit moteur porté par le pilote.");
Q("L","Que signifie ULM ?",["Ultra Léger Motorisé","Unité de Lancement Militaire","Union Légère Mécanique","Ultra Long Mètre"],0,
 "Ce sont des aéronefs légers, avec moteur.",
 "Un ULM est un aéronef ultra léger motorisé. Il en existe plusieurs classes : paramoteur, pendulaire, multiaxes (avion), autogire, hélicoptère ultra léger. Un brevet spécifique est exigé.");
Q("L","En catégorie « ouverte », un drone de loisir ne doit pas voler à plus de…",["120 m au-dessus du sol","10 m","1000 m","aucune limite n'existe"],0,
 "C'est la limite européenne de hauteur.",
 "En Europe, la hauteur maximale est de 120 m (400 ft) au-dessus du sol en catégorie ouverte. Le pilote doit garder son drone à vue et respecter les zones interdites.","drone");
Q("L","Un autogire se distingue de l'hélicoptère car son rotor…",["tourne en autorotation, entraîné par l'air, et une hélice assure la traction","est entraîné par un moteur électrique","n'existe pas","est fixe"],0,
 "Le rotor est comme celui d'un hélicoptère en panne moteur.",
 "L'autogire a un rotor non motorisé qui tourne grâce à l'air relatif. Une hélice distincte le propulse. Il ne peut pas faire de vol stationnaire pur.","autorot");

/* ---------- M. Navigation ---------- */
Q("M","La déclinaison magnétique est l'angle entre…",["le nord géographique et le nord magnétique","l'horizontale et l'axe de l'avion","le cap et la route","le vent et la piste"],0,
 "Le pôle Nord magnétique n'est pas au même endroit que le pôle Nord géographique.",
 "Le compas pointe vers le nord magnétique, qui diffère du nord géographique (celui des cartes). L'écart est la déclinaison, variable selon le lieu et l'année ; elle est indiquée sur les cartes aéronautiques.","declin");
Q("M","Le cap d'un avion est l'angle entre le nord et…",["la trajectoire de l'avion au sol","l'axe longitudinal de l'avion (là où pointe le nez)","la direction du vent","l'axe de la piste"],1,
 "Le nez de l'avion pointe dans cette direction.",
 "Le cap est la direction dans laquelle pointe le nez de l'avion, comptée en degrés depuis le nord (0 à 360). La route est la trajectoire réellement suivie par rapport au sol.","capcourse");
Q("M","Avec un vent de travers, la route de l'avion diffère de son cap à cause…",["de la dérive provoquée par le vent","de la déclinaison","du carburant","de l'altitude"],0,
 "L'air lui-même se déplace avec l'avion.",
 "L'avion se déplace dans une masse d'air qui, elle, se déplace par rapport au sol : le vent pousse l'avion de côté. L'écart entre cap et route s'appelle la dérive.","capcourse");
Q("M","Le vent vient de la droite. Pour tenir une route donnée, le pilote doit afficher un cap…",["à droite de la route (dans le vent)","à gauche de la route","identique à la route","opposé à la route"],0,
